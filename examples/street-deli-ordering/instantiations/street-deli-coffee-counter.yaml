schema_version: 0
artifact_type: dmeta_instance
id: street_deli_coffee_counter
name: Street Deli Coffee Counter
summary: Alternate DMETA instantiation proving the menu-ordering templates can support a variant/modifier/simple-item counter flow without sandwich substitutions.
semantic_root: ..
interactions_root: ../../../sources/dmeta-ir
meta_design_systems:
  web:
    root: ../meta-design-systems/web
    global_root: ../../../sources/dmeta-ir/meta-design-systems/web
    template_files:
      - ../meta-design-systems/web/widgets/menu-browsing.yaml
      - ../meta-design-systems/web/widgets/item-cards.yaml
      - ../meta-design-systems/web/widgets/customization.yaml
      - ../meta-design-systems/web/widgets/modifiers.yaml
      - ../meta-design-systems/web/widgets/substitutions.yaml
      - ../meta-design-systems/web/widgets/ordering.yaml
      - ../meta-design-systems/web/widgets/availability.yaml
      - ../meta-design-systems/web/widgets/tracking.yaml
targets:
  react:
    target_file: ../../../sources/dmeta-ir/meta-design-systems/web/targets/react.yaml
    output_dir: ../generated/coffee-counter-react
    package_name: street-deli-coffee-counter-react
selected_templates:
- template: deli.menu_browser
  as: CoffeeCounterMenuBrowser
  variant: dense_list
  reason: Coffee counter still needs category browsing for coffee, tea, pastries, and bottled drinks.
- template: deli.simple_menu_item_card
  as: CoffeeCounterSimpleItemCard
  variant: compact_tile
  reason: Many counter items are fixed grab-and-go products that do not need composition customization.
- template: deli.variant_menu_item_card
  as: CoffeeCounterVariantItemCard
  variant: inline_variants
  reason: Coffee and soup items primarily vary by size or similar variant choices.
- template: deli.variant_selector
  as: CoffeeCounterVariantSelector
  variant: segmented
  reason: Size and hot/iced choices should be selected quickly inline.
- template: deli.modifier_group
  as: CoffeeCounterModifierGroup
  variant: chip_group
  reason: Milk, sweetener, espresso-shot, and temperature modifiers are option groups rather than ingredient substitutions.
- template: deli.quantity_selector
  as: CoffeeCounterQuantitySelector
  variant: single_item
  reason: Simple counter items need quantity adjustment.
- template: deli.order_cart
  as: CoffeeCounterOrderCart
  variant: mobile_bottom_sheet
  reason: Counter orders still need cart review and submit behavior.
- template: deli.availability_badge
  as: CoffeeCounterAvailabilityBadge
  variant: scheduled
  reason: Breakfast, soup, and special items may have availability windows.
excluded_templates:
- template: deli.composition_customizer
  reason: Coffee counter variant/modifier flow does not expose sandwich ingredient editing.
- template: deli.ingredient_row
  reason: Ingredient rows are not shown for simple drinks and pastries.
- template: deli.substitution_chip
  reason: Coffee modifiers are explicit choices rather than intelligent ingredient substitutions.
- template: deli.bundle_menu_item_card
  reason: Combo/bundle support is deferred for the coffee counter flow.
- template: dmeta.dense_table
  reason: Customer-facing counter ordering is not table oriented.
