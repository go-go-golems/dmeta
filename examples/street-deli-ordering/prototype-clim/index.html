<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hudson Street Deli — CLIM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- === HEADER === -->
  <header id="header">
    <span class="brand">HUDSON STREET DELI</span>
    <span class="mode" id="mode-label">MENU</span>
  </header>

  <!-- === MAIN PRESENTATION AREA === -->
  <main id="main">

    <!-- MENU VIEW -->
    <div id="view-menu" class="view active">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-menu"></span>
      </div>
      <div class="presentations" id="menu-presentations">
        <!-- JS renders menu presentations here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-menu"></span>
      </div>
    </div>

    <!-- DETAIL / CUSTOMIZER VIEW -->
    <div id="view-detail" class="view">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-detail"></span>
      </div>
      <div class="presentations" id="detail-presentations">
        <!-- JS renders item detail + ingredient presentations here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-detail"></span>
      </div>
    </div>

    <!-- SUBSTITUTION VIEW -->
    <div id="view-substitution" class="view">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-sub"></span>
      </div>
      <div class="presentations" id="sub-presentations">
        <!-- JS renders substitution candidates here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-sub"></span>
      </div>
    </div>

    <!-- CART VIEW -->
    <div id="view-cart" class="view">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-cart"></span>
      </div>
      <div class="presentations" id="cart-presentations">
        <!-- JS renders cart items here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-cart"></span>
      </div>
    </div>

    <!-- HELP VIEW -->
    <div id="view-help" class="view">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-help"></span>
      </div>
      <div class="presentations" id="help-presentations">
        <!-- JS renders help/action reference here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-help"></span>
      </div>
    </div>

    <!-- TRACKER VIEW -->
    <div id="view-tracker" class="view">
      <div class="cmd-bar">
        <span class="prompt">Deli&gt;</span>
        <span class="cmd-text" id="cmd-text-tracker"></span>
      </div>
      <div class="presentations" id="tracker-presentations">
        <!-- JS renders order tracker here -->
      </div>
      <div class="cmd-bar">
        <span class="prompt">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span class="cmd-text" id="cmd-actions-tracker"></span>
      </div>
    </div>

  </main>

  <!-- === COMMAND LINE === -->
  <footer id="command-line">
    <div class="cmd-input-area">
      <span class="prompt">Command:&nbsp;</span>
      <span class="cmd-buffer" id="cmd-buffer"></span>
      <span class="cmd-cursor">_</span>
    </div>
    <div class="cmd-hint" id="cmd-hint">Click a presented object to act on it. Type a command or press a key.</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
