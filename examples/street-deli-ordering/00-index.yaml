schema_version: 0
artifact_type: dmeta_ir_index
summary: DMETA meta design system for a mobile ordering app for a street deli, with intelligent ingredient replacement.
status: draft
artifacts:
  core_model:
    path: ./01-core-model.yaml
    artifact_type: dmeta_core_model
    description: Split core-model package index with references to archetypes, capabilities, presentations/actions, and the street deli domain example.
    consumers:
    - validate-dmeta-ir
    - generate-presentation-registry
    - generate-action-registry
  design_language:
    path: ./02-design-language.yaml
    artifact_type: dmeta_design_language
    description: Mobile-friendly deli ordering design-language ranges, recipes, states, and lint rules.
    consumers:
    - validate-dmeta-ir
    - generate-design-language
    - lint-dmeta-design-system
  web_meta_design_system:
    path: ./meta-design-systems/web/meta-design-system.yaml
    artifact_type: dmeta_meta_design_system
    description: Street Deli Web MetaDesignSystem extensions and local widget templates.
    consumers:
    - validate-dmeta-ir
    - lower-web
    - plan-scaffold
    - scaffold-react
  interaction_package:
    path: ./interactions/00-index.yaml
    artifact_type: dmeta_interaction_package
    description: Street Deli interaction package extending shared generic actions and representations with deli ordering actions, representations, and elaboration rules.
    consumers:
    - validate-interactions
    - lower-pbui
    - instantiate-pbui
    - plan-pbui-react-app
  pbui_meta_design_system:
    path: ./meta-design-systems/pbui/presentation-system.yaml
    artifact_type: dmeta_pbui_presentation_system
    description: Street Deli concrete PBUI/CLIM presentation profile.
    consumers:
    - validate-pbui-profile
    - instantiate-pbui
    - plan-pbui-react-app
    - scaffold-pbui-react-app
references:
  base_dmeta_system_spec: ../../design-docs/04-concrete-dmeta-system-spec.md
  base_dmeta_core_model_spec: ../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
  base_dmeta_design_language_spec: ../../design-docs/06-dmeta-design-language-and-tooling-spec.md
  shared_compiler_playbook: ../../playbooks/01-dmeta-shared-compiler-playbook.md
  web_react_playbook: ../../playbooks/02-dmeta-web-react-metadesignsystem-playbook.md
  pbui_clim_playbook: ../../playbooks/03-dmeta-pbui-clim-metadesignsystem-playbook.md
validation:
  require_artifact_type_match: true
  require_schema_version_match: true
  require_paths_exist: true
