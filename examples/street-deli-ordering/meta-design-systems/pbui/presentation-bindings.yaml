schema_version: 0
artifact_type: dmeta_pbui_presentation_bindings
summary: Street Deli CLIM presentation binding overrides.
intent: >-
  Inherit reusable CLIM bindings for presentation refs, action presentations,
  action choosers, inspectors, lifecycle status, and generic composition
  presentations, then override only the Street Deli composition details that are
  tied to menu items, ingredients, substitutions, cart summaries, and order
  actions.
source:
  visual_reference: ../../www/clim/js/app-main.js
  runtime_reference: /home/manuel/code/wesen/2026-05-21--readwise-viewer/pkg/web/clim/render.ts
  rationale: >-
    The reusable CLIM profile explains the general renderer vocabulary. The
    Street Deli prototype adds domain-specific subpresentation roles for menu
    composition editing and cart review.
bindings:
  pbui.composition_presentation:
    component: CompositionPresentationBlock
    summary: Render composed menu/order items with ingredient rows, roles, substitutions, and cart actions.
    intent: >-
      This is the richest Street Deli binding. It turns one abstract composition
      presentation into a concrete family of CLIM text-object subpresentations:
      menu-item header, ingredient rows, removed/substituted states,
      substitution candidates, role labels, cart summaries, and order actions.
    placement:
      preferred_surface: active_view
    display:
      block: true
      show_composition_header: true
      show_part_rows: true
      show_role_labels: true
      show_substitution_candidates: true
      show_cart_summary: true
    classes:
      base: pres-block
      section: section-label
      ingredient_removed: ing-removed
      ingredient_substituted: ing-substituted
      role: role
    subpresentations:
      composition_header:
        component: CompositionHeaderLine
        classes:
          base: pres pres-block
          type: pres-type
          role: role
      part_rows:
        component: IngredientPresentationRow
        classes:
          base: pres pres-block
          removed: ing-removed
          substituted: ing-substituted
          type: pres-type
          role: role
      role_labels:
        component: RoleLabelInline
        classes:
          base: role
      substitution_candidates:
        component: SubstitutionCandidateLine
        classes:
          base: pres sub-candidate
          auto: auto
          type: pres-type
      cart_item:
        component: CartItemBlock
        classes:
          base: cart-item-block
          item: pres pres-block
notes: >-
  Most CLIM presentation bindings are inherited from the reusable PBUI CLIM
  profile. This file keeps only the Street Deli domain vocabulary that should
  later drive app-specific templates, selectors, and presentation renderers.
