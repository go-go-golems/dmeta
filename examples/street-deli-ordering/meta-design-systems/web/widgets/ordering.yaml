schema_version: 0
artifact_type: dmeta_web_widget_templates
category: ordering
summary: Cart, checkout, pickup, and order-summary templates.
long_summary: Street Deli local ordering templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.order_cart
  name: OrderCart
  status: template
  classification:
    level: organism
    role: cart_management
  intent:
    purpose: Render cart line items, item customizations, totals, fulfillment details, and checkout/submit actions.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: ordering
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_bottom_sheet
    - full_page
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    archetypes:
    - WorkItem
    - Composition
    presentations:
    - order_item_row
    - compact_ref
    capabilities:
    - measurable
    - stateful
  contract:
    props:
      OrderCartProps:
        fields:
          items:
            type: OrderItemViewModel[]
            required: true
          totals:
            type: OrderTotalsViewModel
            required: true
    action_slots:
      onRemoveItem:
        accepts: PresentationRef
      onSubmitOrder:
        accepts: PresentationActionRequest
  stories:
  - empty_cart
  - multiple_items
  - checkout_ready
  outputs:
    component: src/street-deli/widgets/OrderCart/OrderCart.tsx
    types: src/street-deli/widgets/OrderCart/OrderCart.types.ts
    metadata: src/street-deli/widgets/OrderCart/OrderCart.metadata.ts
    stories: src/street-deli/widgets/OrderCart/OrderCart.stories.tsx
    barrel: src/street-deli/widgets/OrderCart/index.ts
  semantic_context:
    archetypes:
    - OrderItem
    - WorkItem
    - ProductComposition
    capabilities:
    - ingredient_composable
    - configurable
    - measurable
    - stateful
    presentations:
    - order_item_row
    - compact_ref
    intent: Render the order review surface after menu items become customized order items. The inherited work-item and product-composition
      context should guide metadata and adapter TODOs, not force cart layout.
    inherited_context_note: OrderItem extends WorkItem and ProductComposition, so it combines lifecycle/work semantics with
      final ingredient composition state.
  projection_hints:
    recommended:
    - labelable.label
    - measurable.value
    - ingredient_composable.parts
    - configurable.current_config
    optional:
    - stateful.state
    - relatable.work_item_ref
    adapter_todos:
    - Map applied substitutions as cart-line annotations, not as raw ingredient rows only.
    - Decide whether stateful prep status appears in cart or only in tracker.
  generation:
    scaffold_mode: adapter_todos
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: true
    strict_projection_adapter: false
- id: deli.cart_line_item
  name: CartLineItem
  status: template
  classification:
    level: molecule
    role: cart_line_item
  intent:
    purpose: Render one cart line with quantity, selected modifiers/substitutions, price, and edit/remove actions.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: ordering
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    presentations:
    - order_item_row
    - compact_ref
    capabilities:
    - measurable
  contract:
    props:
      CartLineItemProps:
        fields:
          item:
            type: OrderItemViewModel
            required: true
    action_slots:
      onEdit:
        accepts: PresentationRef
      onRemove:
        accepts: PresentationRef
  stories:
  - simple_item
  - customized_item
  - quantity
  outputs:
    component: src/street-deli/widgets/CartLineItem/CartLineItem.tsx
    types: src/street-deli/widgets/CartLineItem/CartLineItem.types.ts
    metadata: src/street-deli/widgets/CartLineItem/CartLineItem.metadata.ts
    stories: src/street-deli/widgets/CartLineItem/CartLineItem.stories.tsx
    barrel: src/street-deli/widgets/CartLineItem/index.ts
