schema_version: 0
artifact_type: dmeta_widget_template_index
summary: Street Deli local Web widget templates for flexible menu-ordering design systems.
long_summary: The local catalog is split into menu-ordering families so concrete Street Deli instantiations can select sandwich/composition,
  coffee/variant, catering/bundle, or other menu-specific subsets.
files:
  menu_browsing: ./menu-browsing.yaml
  item_cards: ./item-cards.yaml
  customization: ./customization.yaml
  modifiers: ./modifiers.yaml
  substitutions: ./substitutions.yaml
  ordering: ./ordering.yaml
  availability: ./availability.yaml
  tracking: ./tracking.yaml
validation:
  require_unique_template_ids: true
authoring_guidance:
  semantic_context_policy: Street Deli widgets use inherited archetypes/capabilities to explain why templates apply to MenuItem,
    OrderItem, Ingredient, and SubstitutionSuggestion. Generated scaffolds should surface this context while leaving final
    mobile layout decisions to the implementor.
  projection_generation_policy: Use projection_hints for adapter TODOs and review notes. Keep strict projection adapters disabled
    until a promoted React implementation chooses stable view-model shapes.
  default_generation_policy:
    scaffold_mode: reflective
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: false
    strict_projection_adapter: false
