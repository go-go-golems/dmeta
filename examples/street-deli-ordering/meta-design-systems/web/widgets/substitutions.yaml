schema_version: 0
artifact_type: dmeta_web_widget_templates
category: substitutions
summary: Ingredient and substitution templates.
long_summary: Street Deli local substitutions templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.ingredient_row
  name: IngredientRow
  status: template
  classification:
    level: molecule
    role: ingredient_composition_row
  intent:
    purpose: Render one ingredient in a composition with role labels, required/optional status, dietary/allergen hints, and
      remove/substitute actions.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: substitutions
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    presentations:
    - ingredient_list
    - compact_ref
    capabilities:
    - dietary
    - substitutable
  contract:
    props:
      IngredientRowProps:
        fields:
          ingredient:
            type: IngredientViewModel
            required: true
          removable:
            type: boolean
            required: false
    action_slots:
      onRemove:
        accepts: PresentationRef
      onShowSubstitutions:
        accepts: PresentationRef
  stories:
  - required_ingredient
  - optional_ingredient
  - removed_state
  outputs:
    component: src/street-deli/widgets/IngredientRow/IngredientRow.tsx
    types: src/street-deli/widgets/IngredientRow/IngredientRow.types.ts
    metadata: src/street-deli/widgets/IngredientRow/IngredientRow.metadata.ts
    stories: src/street-deli/widgets/IngredientRow/IngredientRow.stories.tsx
    barrel: src/street-deli/widgets/IngredientRow/index.ts
- id: deli.substitution_chip
  name: SubstitutionChip
  status: template
  classification:
    level: atom
    role: substitution_suggestion
  intent:
    purpose: Render an inline replacement suggestion showing original to replacement, dietary compatibility, role fit, and
      price delta.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: substitutions
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    presentations:
    - substitution_badge
    - substitution_pair
    capabilities:
    - substitutable
    - dietary
    - measurable
  contract:
    props:
      SubstitutionChipProps:
        fields:
          suggestion:
            type: SubstitutionSuggestionViewModel
            required: true
          state:
            type: '"suggested" | "applied" | "dismissed"'
            required: false
    action_slots:
      onApply:
        accepts: PresentationActionRequest
      onReject:
        accepts: PresentationActionRequest
  stories:
  - no_cheese_to_avocado
  - applied_state
  - allergen_warning
  outputs:
    component: src/street-deli/widgets/SubstitutionChip/SubstitutionChip.tsx
    types: src/street-deli/widgets/SubstitutionChip/SubstitutionChip.types.ts
    metadata: src/street-deli/widgets/SubstitutionChip/SubstitutionChip.metadata.ts
    stories: src/street-deli/widgets/SubstitutionChip/SubstitutionChip.stories.tsx
    barrel: src/street-deli/widgets/SubstitutionChip/index.ts
  semantic_context:
    archetypes:
    - Substitution
    capabilities:
    - role_preserving_substitutable
    - dietary_substitutable
    - price_aware_substitutable
    presentations:
    - substitution_badge
    - substitution_pair
    intent: Render a compact replacement suggestion or applied substitution. Descendant capabilities may add dietary and price
      information, but each variant decides what fits in the chip.
    inherited_context_note: SubstitutionSuggestion and AppliedSubstitution extend Substitution and can carry role-preserving,
      dietary, and price-aware substitution capabilities.
  projection_hints:
    recommended:
    - substitutable.replaces
    - substitutable.replacement_candidates
    - role_preserving_substitutable.role_overlap_score
    optional:
    - dietary_substitutable.dietary_explanation
    - price_aware_substitutable.price_delta_label
    - dietary.dietary_tags
    adapter_todos:
    - Choose whether the chip shows only top replacement or opens alternatives.
    - Do not hide allergen warnings when the selected candidate introduces risk.
  generation:
    scaffold_mode: adapter_todos
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: true
    strict_projection_adapter: false
