    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - bottom_sheet
    - inline_panel
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    capabilities:
    - substitutable
    - dietary
    - measurable
  contract:
    props:
      SubstitutionDetailSheetProps:
        fields:
          removed:
            type: IngredientViewModel
            required: true
          candidates:
            type: SubstitutionSuggestionViewModel[]
            required: true
    action_slots:
      onApply:
        accepts: PresentationActionRequest
  stories:
  - multiple_candidates
  - no_candidates
  - allergen_conflicts
  outputs:
    component: src/street-deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.tsx
    types: src/street-deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.types.ts
    metadata: src/street-deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.metadata.ts
    stories: src/street-deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.stories.tsx
    barrel: src/street-deli/widgets/SubstitutionDetailSheet/index.ts
