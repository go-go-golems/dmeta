schema_version: 0
artifact_type: dmeta_web_widget_templates
category: tracking
summary: Preparation and pickup-tracking templates.
long_summary: Street Deli local tracking templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.order_tracker
  name: OrderTracker
  status: template
  classification:
    level: organism
    role: prep_tracking
  intent:
    purpose: Render order preparation status, timeline events, pickup instructions, and related order references.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: tracking
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - compact_status
    - timeline
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    archetypes:
    - WorkItem
    - TimelineSpan
    - Event
    presentations:
    - prep_status_indicator
    - timeline_marker
    - dense_row
    capabilities:
    - stateful
    - temporal
    - relatable
  contract:
    props:
      OrderTrackerProps:
        fields:
          order:
            type: OrderTrackingViewModel
            required: true
    action_slots:
      onInspectOrder:
        accepts: PresentationRef
      onOpenEvent:
        accepts: PresentationRef
  stories:
  - received
  - in_prep
  - ready_for_pickup
  outputs:
    component: src/street-deli/widgets/OrderTracker/OrderTracker.tsx
    types: src/street-deli/widgets/OrderTracker/OrderTracker.types.ts
    metadata: src/street-deli/widgets/OrderTracker/OrderTracker.metadata.ts
    stories: src/street-deli/widgets/OrderTracker/OrderTracker.stories.tsx
    barrel: src/street-deli/widgets/OrderTracker/index.ts
  semantic_context:
    archetypes:
    - Order
    - WorkItem
    - TimelineSpan
    capabilities:
    - stateful
    - temporal
    - relatable
    presentations:
    - prep_status_indicator
    - timeline_marker
    - dense_row
    intent: Render order preparation progress using work-item state and timeline semantics. Inheritance helps explain why
      Order and PrepTask can share tracking presentations while still using different layouts.
    inherited_context_note: Order extends WorkItem and TimelineSpan; PrepTask extends WorkItem and can appear as a station-level
      child in tracking views.
  projection_hints:
    recommended:
    - stateful.state
    - temporal.start_time
    - temporal.end_time
    optional:
    - temporal.duration_ms
    - relatable.actor_ref
    - relatable.work_item_ref
    adapter_todos:
    - Decide whether tracker steps are derived from order state, prep tasks, or both.
- id: deli.prep_status_badge
  name: PrepStatusBadge
  status: template
  classification:
    level: atom
    role: prep_status_badge
  intent:
    purpose: Render order preparation status such as received, in prep, ready, delayed, or picked up.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: tracking
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    capabilities:
    - stateful
    presentations:
    - prep_status_indicator
  contract:
    props:
      PrepStatusBadgeProps:
        fields:
          status:
            type: string
            required: true
          tone:
            type: tone
            required: false
  stories:
  - received
  - in_prep
  - ready
  outputs:
    component: src/street-deli/widgets/PrepStatusBadge/PrepStatusBadge.tsx
    types: src/street-deli/widgets/PrepStatusBadge/PrepStatusBadge.types.ts
    metadata: src/street-deli/widgets/PrepStatusBadge/PrepStatusBadge.metadata.ts
    stories: src/street-deli/widgets/PrepStatusBadge/PrepStatusBadge.stories.tsx
    barrel: src/street-deli/widgets/PrepStatusBadge/index.ts
