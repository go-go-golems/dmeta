schema_version: 0
artifact_type: dmeta_web_widget_templates
category: availability
summary: Availability, specials, sold-out, and schedule templates.
long_summary: Street Deli local availability templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.availability_badge
  name: AvailabilityBadge
  status: template
  classification:
    level: atom
    role: availability_badge
  intent:
    purpose: Render availability state such as available, sold out, limited, breakfast only, or unavailable until time.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: availability
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - available
    - sold_out
    - limited
    - scheduled
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    capabilities:
    - stateful
    - temporal
    - available
  contract:
    props:
      AvailabilityBadgeProps:
        fields:
          availability:
            type: AvailabilityViewModel
            required: true
  stories:
  - available
  - sold_out
  - limited
  - scheduled
  outputs:
    component: src/street-deli/widgets/AvailabilityBadge/AvailabilityBadge.tsx
    types: src/street-deli/widgets/AvailabilityBadge/AvailabilityBadge.types.ts
    metadata: src/street-deli/widgets/AvailabilityBadge/AvailabilityBadge.metadata.ts
    stories: src/street-deli/widgets/AvailabilityBadge/AvailabilityBadge.stories.tsx
    barrel: src/street-deli/widgets/AvailabilityBadge/index.ts
- id: deli.sold_out_state
  name: SoldOutState
  status: template
  classification:
    level: molecule
    role: sold_out_state
  intent:
    purpose: Render sold-out messaging and optional related substitutions/alternatives.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: availability
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    capabilities:
    - stateful
    - relatable
  contract:
    props:
      SoldOutStateProps:
        fields:
          item:
            type: PresentationRef
            required: true
          alternatives:
            type: PresentationRef[]
            required: false
    action_slots:
      onChooseAlternative:
        accepts: PresentationRef
  stories:
  - no_alternatives
  - with_alternatives
  outputs:
    component: src/street-deli/widgets/SoldOutState/SoldOutState.tsx
    types: src/street-deli/widgets/SoldOutState/SoldOutState.types.ts
    metadata: src/street-deli/widgets/SoldOutState/SoldOutState.metadata.ts
    stories: src/street-deli/widgets/SoldOutState/SoldOutState.stories.tsx
    barrel: src/street-deli/widgets/SoldOutState/index.ts
