- id: deli.substitution_chip
  name: SubstitutionChip
  status: template
  classification:
    level: atom
    role: substitution_suggestion
  intent:
    purpose: Render an inline replacement suggestion showing original to replacement, dietary compatibility, role fit, and
      price delta.
    adapter_boundary: Receives normalized street-deli view models and emits typed presentation/action callbacks; does not
      call backend or parse raw source YAML.
  template:
    category: street_deli_ordering_flow
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this ordering instance need a concrete SubstitutionChip widget or is the behavior covered by another selected template?
    adaptation_points:
    - component_name
    - mobile_layout
    - presentation_mapping
    - action_slots
    - story_examples
    common_variants:
    - mobile_default
    avoid_when:
    - The concrete ordering flow does not expose this part of the menu/customization/cart lifecycle.
  consumes:
    presentations:
    - substitution_badge
    - substitution_pair
    capabilities:
    - substitutable
    - dietary
    - measurable
  contract:
    props:
      SubstitutionChipProps:
        fields:
          suggestion:
            type: SubstitutionSuggestionViewModel
            required: true
          state:
            type: '"suggested" | "applied" | "dismissed"'
            required: false
    action_slots:
      onApply:
        accepts: PresentationActionRequest
      onReject:
        accepts: PresentationActionRequest
  stories:
  - no_cheese_to_avocado
  - applied_state
  - allergen_warning
  outputs:
    component: src/street-deli/widgets/SubstitutionChip/SubstitutionChip.tsx
