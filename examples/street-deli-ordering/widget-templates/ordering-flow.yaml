schema_version: 0
artifact_type: dmeta_widget_templates
category: street_deli_ordering_flow
summary: Street Deli ordering-flow widget templates.
long_summary: Concrete street-deli instances select from these local templates when generating the mobile ordering design
  system under examples/street-deli-ordering.
templates:
- id: deli.menu_browser
  name: MenuBrowser
  status: template
  classification:
    level: organism
    role: menu_browsing
  intent:
    purpose: Render grouped menu categories and selectable menu-item composition cards for the ordering entrypoint.
    adapter_boundary: Receives normalized street-deli view models and emits typed presentation/action callbacks; does not
      call backend or parse raw source YAML.
  template:
    category: street_deli_ordering_flow
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this ordering instance need a concrete MenuBrowser widget or is the behavior covered by another selected template?
    adaptation_points:
    - component_name
    - mobile_layout
    - presentation_mapping
    - action_slots
    - story_examples
    common_variants:
    - mobile_cards
    - dense_list
    avoid_when:
    - The concrete ordering flow does not expose this part of the menu/customization/cart lifecycle.
  consumes:
    archetypes:
    - Composition
    presentations:
    - composition_card
    - compact_ref
    capabilities:
    - composable
    - dietary
  contract:
    props:
      MenuBrowserProps:
        fields:
          categories:
            type: MenuCategoryViewModel[]
            required: true
          selectedItemId:
            type: string
            required: false
    action_slots:
      onSelectItem:
        accepts: PresentationRef
      onFilterDietary:
        accepts: PresentationRef
  stories:
  - categories
  - dietary_filter
  - sold_out_items
  outputs:
    component: src/street-deli/widgets/MenuBrowser/MenuBrowser.tsx
    types: src/street-deli/widgets/MenuBrowser/MenuBrowser.types.ts
    metadata: src/street-deli/widgets/MenuBrowser/MenuBrowser.metadata.ts
    stories: src/street-deli/widgets/MenuBrowser/MenuBrowser.stories.tsx
    barrel: src/street-deli/widgets/MenuBrowser/index.ts
- id: deli.composition_card
  name: CompositionCard
  status: template
  classification:
    level: molecule
    role: composition_summary
  intent:
    purpose: Render a menu item as a compact selectable composition summary with price, dietary tags, and primary customize
      action.
    adapter_boundary: Receives normalized street-deli view models and emits typed presentation/action callbacks; does not
      call backend or parse raw source YAML.
  template:
    category: street_deli_ordering_flow
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this ordering instance need a concrete CompositionCard widget or is the behavior covered by another selected template?
    adaptation_points:
    - component_name
    - mobile_layout
    - presentation_mapping
    - action_slots
    - story_examples
    common_variants:
    - mobile_default
    avoid_when:
    - The concrete ordering flow does not expose this part of the menu/customization/cart lifecycle.
  consumes:
    archetypes:
    - Composition
    presentations:
    - composition_card
    capabilities:
    - composable
    - dietary
    - measurable
  contract:
    props:
      CompositionCardProps:
        fields:
          item:
            type: MenuItemViewModel
            required: true
          selected:
            type: boolean
            required: false
    action_slots:
      onCustomize:
        accepts: PresentationRef
      onAddQuick:
        accepts: PresentationActionRequest
  stories:
  - sandwich_card
