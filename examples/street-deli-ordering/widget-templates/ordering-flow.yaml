- id: deli.composition_customizer
  name: CompositionCustomizer
  status: template
  classification:
    level: organism
    role: item_customizer
  intent:
    purpose: Render the menu-item customization surface with ingredient rows, substitution suggestions, configuration controls,
      dietary summary, and add-to-order action.
    adapter_boundary: Receives normalized street-deli view models and emits typed presentation/action callbacks; does not
      call backend or parse raw source YAML.
  template:
    category: street_deli_ordering_flow
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this ordering instance need a concrete CompositionCustomizer widget or is the behavior covered by another selected
      template?
    adaptation_points:
    - component_name
    - mobile_layout
    - presentation_mapping
    - action_slots
    - story_examples
    common_variants:
    - bottom_sheet
    - full_screen_mobile
    avoid_when:
    - The concrete ordering flow does not expose this part of the menu/customization/cart lifecycle.
  consumes:
    archetypes:
    - Composition
    presentations:
    - composition_detail
    - ingredient_list
    - substitution_badge
    capabilities:
    - composable
    - substitutable
    - configurable
    - dietary
  contract:
    props:
      CompositionCustomizerProps:
        fields:
          item:
