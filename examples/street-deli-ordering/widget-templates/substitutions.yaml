- id: deli.role_tag
  name: RoleTag
  status: template
  classification:
    level: atom
    role: ingredient_role_label
  intent:
    purpose: Render an ultra-compact ingredient role label such as protein, crunch, richness, heat, freshness, or structure.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: substitutions
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
    - component_name
    - mobile_layout
    - presentation_mapping
    - copy_and_labels
    - action_slots
    - story_examples
    common_variants:
    - compact_mode
    - regular
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes: {}
  contract:
    props:
      RoleTagProps:
        fields:
          role:
            type: ingredient_role
            required: true
          size:
            type: '"compact" | "regular"'
            required: false
  stories:
  - all_roles
  - compact_mode
  outputs:
    component: src/street-deli/widgets/RoleTag/RoleTag.tsx
    types: src/street-deli/widgets/RoleTag/RoleTag.types.ts
    metadata: src/street-deli/widgets/RoleTag/RoleTag.metadata.ts
    stories: src/street-deli/widgets/RoleTag/RoleTag.stories.tsx
    barrel: src/street-deli/widgets/RoleTag/index.ts
