schema_version: 0
artifact_type: dmeta_widget_templates
category: menu_browsing
summary: Menu discovery, navigation, filtering, and search templates.
long_summary: Street Deli local menu_browsing templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.menu_browser
  name: MenuBrowser
  status: template
  classification:
    level: organism
    role: menu_browsing
  intent:
    purpose: Render grouped menu categories and selectable item cards for a concrete ordering entrypoint.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: menu_browsing
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_cards
    - dense_list
    - dashboard_grid
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    archetypes:
    - Composition
    - Resource
    presentations:
    - composition_card
    - compact_ref
    capabilities:
    - dietary
    - filter_source
  contract:
    props:
      MenuBrowserProps:
        fields:
          categories:
            type: MenuCategoryViewModel[]
            required: true
          selectedItemId:
            type: string
            required: false
    action_slots:
      onSelectItem:
        accepts: PresentationRef
      onFilterDietary:
        accepts: PresentationRef
  stories:
  - categories
  - dietary_filter
  - sold_out_items
  outputs:
    component: src/street-deli/widgets/MenuBrowser/MenuBrowser.tsx
    types: src/street-deli/widgets/MenuBrowser/MenuBrowser.types.ts
    metadata: src/street-deli/widgets/MenuBrowser/MenuBrowser.metadata.ts
    stories: src/street-deli/widgets/MenuBrowser/MenuBrowser.stories.tsx
    barrel: src/street-deli/widgets/MenuBrowser/index.ts
