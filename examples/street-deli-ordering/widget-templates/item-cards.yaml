      parse raw source YAML or own trusted side effects.
  template:
    category: item_cards
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - compact_tile
    - list_row
    - large_touch_target
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    archetypes:
    - Resource
    capabilities:
    - measurable
    - dietary
    - available
  contract:
    props:
      SimpleMenuItemCardProps:
        fields:
          item:
            type: SimpleMenuItemViewModel
            required: true
          quantity:
            type: number
            required: false
    action_slots:
      onAdd:
        accepts: PresentationActionRequest
      onChangeQuantity:
        accepts: number
  stories:
  - drink
  - chips
  - cookie
  - sold_out
  outputs:
    component: src/street-deli/widgets/SimpleMenuItemCard/SimpleMenuItemCard.tsx
    types: src/street-deli/widgets/SimpleMenuItemCard/SimpleMenuItemCard.types.ts
    metadata: src/street-deli/widgets/SimpleMenuItemCard/SimpleMenuItemCard.metadata.ts
    stories: src/street-deli/widgets/SimpleMenuItemCard/SimpleMenuItemCard.stories.tsx
    barrel: src/street-deli/widgets/SimpleMenuItemCard/index.ts
