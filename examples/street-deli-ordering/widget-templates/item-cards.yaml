schema_version: 0
artifact_type: dmeta_widget_templates
category: item_cards
summary: Menu item card templates for different menu archetypes.
long_summary: Street Deli local item_cards templates. These are selectable menu-ordering templates; concrete instantiations
  choose only the families they need.
templates:
- id: deli.composition_card
  name: CompositionCard
  status: template
  classification:
    level: molecule
    role: composition_summary
  intent:
    purpose: Render a composed menu item such as a sandwich, bowl, wrap, salad, or plate with ingredients, dietary tags, and
      price.
    adapter_boundary: Receives normalized menu-ordering view models and emits typed presentation/action callbacks; does not
      parse raw source YAML or own trusted side effects.
  template:
    category: item_cards
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Which menu archetypes in this concrete ordering system require this widget?
    - Should this be generated from the shared menu-ordering template or replaced with a more specific local template?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      mobile_layout:
        type: any
        required: false
        description: Mobile-specific layout, surface, and touch target choices.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      copy_and_labels:
        type: any
        required: false
        description: Instance-specific labels, helper text, and operator-facing copy.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      story_examples:
        type: any
        required: false
        description: Instance-specific adaptation for story examples.
    common_variants:
    - mobile_default
    - dense_list
    - image_card
    avoid_when:
    - The menu type does not expose this interaction.
    - A simpler selected template covers the flow without extra UI surface.
  consumes:
    archetypes:
    - Composition
    presentations:
    - composition_card
    capabilities:
    - composable
    - dietary
    - measurable
  contract:
    props:
      CompositionCardProps:
        fields:
          item:
            type: MenuItemViewModel
            required: true
          selected:
            type: boolean
            required: false
    action_slots:
      onCustomize:
        accepts: PresentationRef
      onAddQuick:
        accepts: PresentationActionRequest
  stories:
  - sandwich_card
  - bowl_card
  - dietary_badges
  outputs:
    component: src/street-deli/widgets/CompositionCard/CompositionCard.tsx
    types: src/street-deli/widgets/CompositionCard/CompositionCard.types.ts
    metadata: src/street-deli/widgets/CompositionCard/CompositionCard.metadata.ts
    stories: src/street-deli/widgets/CompositionCard/CompositionCard.stories.tsx
    barrel: src/street-deli/widgets/CompositionCard/index.ts
  semantic_context:
    archetypes:
    - ProductComposition
    capabilities:
    - ingredient_composable
    - dietary
    - measurable
    - available
    presentations:
    - composition_card
    intent: Render a mobile menu card for a sellable ingredient composition. The semantic model explains why MenuItem fits
      here without requiring every variant to render the full ingredient role graph.
    inherited_context_note: MenuItem extends ProductSpec and ProductComposition, so it satisfies both product browsing and
      composition customization context.
  projection_hints:
    recommended:
    - labelable.label
    - measurable.value
    - ingredient_composable.parts
    - dietary.dietary_tags
    optional:
    - available.availability_state
    - ingredient_composable.required_roles
    - ingredient_composable.ingredient_roles
    documentation_only:
    - ingredient_composable.role_profile
    adapter_todos:
    - Decide whether the selected variant shows a short ingredient summary or full ingredient rows.
    - Keep dietary/allergen information visible when safety-relevant.
  generation:
    scaffold_mode: adapter_todos
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: true
    strict_projection_adapter: false
