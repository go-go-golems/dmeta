schema_version: 0
artifact_type: dmeta_presentations
summary: Standalone Street Deli presentations/actions including base DMETA contracts and deli-specific extensions.
long_summary: This file includes base DMETA presentation/action contracts plus Street Deli composition, substitution, dietary,
  configuration, and ordering contracts. The file is standalone so the example can validate end to end without import flattening.
references:
  base_presentations: ../../../sources/dmeta-ir/core-model/presentations.yaml
  inheritance_guide: ../../../ttmp/2026/05/22/DMETA-IR-COMPOSITION--ir-imports-and-extension-composition/design-doc/03-implemented-inheritance-system-intern-guide.md
  core_model_widget_ir_spec: ../../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
  design_language_spec: ../../../design-docs/06-dmeta-design-language-and-tooling-spec.md
  core_model_metadata: ./core-model.yaml
presentations:
  compact_id:
    description: Compact copyable identifier.
    applies_to:
      capabilities:
      - identifiable
    requires:
    - id
    role: inline_code
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
    long_description: 'Use compact_id when the most important fact is a stable, copyable identifier. This presentation should
      be visually small, precise, and low-chrome: it is for ids, keys, handles, call ids, shipment ids, order ids, package
      ids, event ids, and similar values. It supports selection, context menus, and copy because identifiers often become
      action arguments, filters, debug anchors, or references in external systems. It should not try to provide rich human
      context; pair it with display_label or compact_ref when label context matters.'
  display_label:
    description: Primary human-readable label.
    applies_to:
      capabilities:
      - labelable
    requires:
    - label
    optional:
    - subtitle
    role: inline_text
    density: any
    interaction:
      selectable: false
      context_menu: false
      copy: false
    long_description: Use display_label when the subject needs a human-readable name or title in a non-interactive or lightly
      interactive context. Labels improve scanability and comprehension, but they are not stable identifiers. This presentation
      intentionally does not enable selection or copy by default because the label alone is usually insufficient as an action
      target. It is commonly composed into richer presentations such as compact_ref, dense_row, summary_card, and detail_panel.
  status_badge:
    description: Compact state/status badge.
    applies_to:
      capabilities:
      - stateful
    requires:
    - state
    optional:
    - state_label
    - state_tone
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
    long_description: Use status_badge to represent the stateful capability in compact surfaces. It should convey state through
      text first and semantic tone second; color reinforces meaning but must not be the only carrier of information. This
      is appropriate for pending/running/failed/completed/delayed/blocked style states across domains. The badge should remain
      visually restrained so dense tables and streams do not turn into noisy color blocks.
  state_cell:
    description: Table cell state presentation.
    applies_to:
      capabilities:
      - stateful
    requires:
    - state
    optional:
    - state_label
    - state_tone
    role: table_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
    long_description: Use state_cell when the same stateful information appears in a table or grid cell rather than as an
      inline badge in prose. It follows the same semantic rules as status_badge but is optimized for alignment, sorting, filtering,
      and comparison inside dense tabular layouts. State cells should be consistent across WorkItems, ActionInvocations, Shipments,
      Orders, Sensors, and other stateful subjects.
  timestamp_inline:
    description: Compact timestamp display.
    applies_to:
      capabilities:
      - temporal
    requires_any:
    - timestamp
    - start_time
    role: inline_mono
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
    long_description: Use timestamp_inline for compact temporal references in streams, tables, timelines, and detail summaries.
      It should use monospace or tabular numeric treatment and should preserve exactness. The display may be shortened for
      density, but full value should remain available through copy, tooltip, detail, or accessible label. This presentation
      is central for logs, scans, tool events, sensor readings, and lifecycle updates.
  duration_cell:
    description: Duration value for tables/details.
    applies_to:
      capabilities:
      - temporal
    requires:
    - duration_ms
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
    long_description: 'Use duration_cell for elapsed time, latency, execution duration, transit time, or other duration values
      that need comparison. It is a temporal presentation but visually behaves like a metric: values should align consistently,
      include appropriate units, and support copy or comparison actions when useful. It should avoid decorative charting unless
      the widget explicitly asks for trend or distribution context.'
  metric_cell:
    description: Numeric metric display with unit and alignment.
    applies_to:
      capabilities:
      - measurable
    requires:
    - value
    optional:
    - unit
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
    long_description: Use metric_cell for numeric values that users compare, sort, filter, or aggregate. Metric cells should
      emphasize precision, units, and alignment rather than decoration. They are suitable for throughput, counts, cost, queue
      depth, error rate, latency, duration, inventory quantity, and similar values. The presentation should be compact enough
      for dense tables but semantic enough to become an action/filter/compare target.
  relation_link:
    description: Compact link/reference to a related semantic object.
    applies_to:
      capabilities:
      - relatable
    requires_any:
    - relation_refs
    - actor_ref
    - work_item_ref
    - resource_ref
    role: relation_link
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
    long_description: 'Use relation_link when the displayed value points to another semantic subject. This presentation turns
      graph-shaped operational data into navigable UI: a tool event links to a tool run, a shipment links to a carrier, an
      order links to packages, a metric links to the monitored resource. Relation links should remain compact and action-aware;
      they should support opening related objects, filtering by relation, and copying the reference.'
  compact_ref:
    description: Compact reference combining id and label.
    applies_to:
      capabilities:
      - identifiable
      - labelable
    requires:
    - id
    - label
    optional:
    - state
    - state_tone
    role: compact_reference
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
    long_description: Use compact_ref as the default compact representation of an identifiable and labelable semantic object.
      It combines stable identity with a readable label and may optionally include state tone or state indicator. It is the
      workhorse presentation for Actors, WorkItems, Resources, ActionSpecs, and related subjects when they appear inside rows,
      chips, detail panels, filters, and context menus. It should be dense, copyable, inspectable, and consistent across domains.
  inline_token:
    description: Inline semantic token for dense streams.
    applies_to:
      archetypes:
      - Actor
      - WorkItem
      - Event
      - Resource
      - Metric
      - TimelineSpan
    requires_any:
    - id
    - label
    - state
    - timestamp
    - value
    role: inline_token
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
    long_description: Use inline_token when semantic values appear inside dense prose-like streams such as logs, traces, scan
      feeds, event rows, or operational messages. Inline tokens should feel like text first, not heavy pills. They must carry
      enough metadata to support selection, context menus, action matching, and argument collection. The goal is to make semantic
      structure available without destroying the rhythm of dense textual information.
  dense_row:
    description: Dense row for streams or tables.
    applies_to:
      archetypes:
      - WorkItem
      - Event
      - Resource
      - TimelineSpan
      - ActionInvocation
    requires_any:
    - id
    - label
    - timestamp
    role: dense_row
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: dense_row
    long_description: Use dense_row for records that need to appear in high-volume streams or tables. This presentation composes
      multiple capability-level presentations—timestamp, state, compact reference, metric, relation—into a scannable row.
      It must preserve identity, selection, context menu, keyboard focus, and detail-opening affordances while remaining visually
      quiet. It is the main presentation for WorkItems, Events, Resources, TimelineSpans, and ActionInvocations.
  summary_card:
    description: Compact card/summary surface.
    applies_to:
      archetypes:
      - Actor
      - WorkItem
      - Resource
      - TimelineSpan
      - ActionSpec
      - ActionInvocation
    requires_any:
    - id
    - label
    role: summary_card
    density: regular
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: Use summary_card when the UI needs a compact but more spacious overview than a row or token can provide.
      Summary cards should not become decorative marketing cards; they are operational summaries with a small set of important
      fields, state, metrics, and actions. They are useful in side panels, dashboards, grouped results, and search outputs
      where several facts must be shown together without opening a full detail panel.
  detail_panel:
    description: Full inspection surface for selected semantic subject.
    applies_to:
      capabilities:
      - inspectable
    requires_any:
    - id
    - label
    - detail_ref
    role: detail_panel
    density: spacious
    interaction:
      selectable: false
      context_menu: false
      copy: true
    long_description: Use detail_panel as the full inspection surface for a selected semantic subject. It should expose canonical
      identity, labels, state, related objects, timelines, metrics, raw payloads, and actions in structured sections. Detail
      panels are not modal by default; they should preserve the surrounding operational context so users can inspect without
      losing their place in a stream or table. The panel should favor copyable key-value fields and progressive disclosure
      for large payloads.
  timeline_marker:
    description: Compact marker or span for temporal processes.
    applies_to:
      archetypes:
      - TimelineSpan
      - Event
      - WorkItem
    requires_any:
    - timestamp
    - start_time
    - end_time
    role: timeline_marker
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: Use timeline_marker for temporal subjects that need to be placed along an ordered time axis or phase
      progression. It may represent an instant Event, a WorkItem milestone, or a TimelineSpan boundary/segment. It should
      use a compact operational visual grammar—line, dot, tick, badge, timestamp—rather than illustrative timeline art. Timeline
      markers should remain selectable and related to the same PresentationRef/action system as rows and tokens.
  filter_chip:
    description: Compact active filter criterion shown in a FilterBar or result header.
    applies_to:
      archetypes:
      - FilterCriterion
    requires_any:
    - filter_expression
    - filter_label
    role: filter_chip
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: Use filter_chip to render an active FilterCriterion as operational state rather than decorative chrome.
      A chip should show the constrained dimension, operator when necessary, and value label. It should support removal, context-menu
      actions, keyboard focus, and inspection/explanation when the filter was inferred from a semantic presentation. Filter
      chips must remain compact because dense operational users often combine several constraints while still needing the
      underlying table or stream to dominate the screen.
  filter_dimension_label:
    description: Label for an available filter dimension or filter specification.
    applies_to:
      archetypes:
      - FilterSpec
    requires_any:
    - id
    - label
    role: filter_dimension_label
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: Use filter_dimension_label in filter builders, facet panels, command palettes, and generated reference
      documentation when the user needs to choose or inspect a dimension such as session, client, state, timestamp, event
      type, carrier, or facility. The presentation names the dimension and may expose its type/operator metadata through details
      or context actions.
  filter_value_token:
    description: Selectable value that can derive a filter expression for compatible targets.
    applies_to:
      capabilities:
      - filter_source
    requires_any:
    - filter_value
    - id
    - label
    role: filter_value_token
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    long_description: Use filter_value_token when a visible semantic object or scalar can become a filter value. Examples
      include agent references, session ids, client ids, state values, event types, facilities, timestamps, or metric thresholds.
      It should preserve the source PresentationRef so the runtime can derive the correct FilterExpression for the current
      FilterTargetRef rather than treating the displayed label as an untyped string.
  filter_summary:
    description: Compact summary of the filter/search/window state for a result set.
    applies_to:
      capabilities:
      - filterable
    requires:
    - filter_target_id
    optional:
    - active_filters
    - active_search
    role: filter_summary
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: Use filter_summary to show the current constraint state of a ResultSet or filterable surface. It can
      communicate result count, number of active filters, search text, live-tail state, cursor/window state, or a compact
      textual description such as `42 sessions · client = web`. It should be selectable when the result set itself has actions
      such as clear filters, save preset, inspect query, or copy query state.
  search_summary:
    description: Compact summary of text search applied to a searchable target.
    applies_to:
      capabilities:
      - searchable
    requires_any:
    - active_search
    - search_scope
    role: search_summary
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    long_description: Use search_summary when text query state needs to be rendered separately from structured filter chips.
      Search summaries should name the query and scope clearly because free-text search may behave differently from exact
      filter expressions. They support clearing, copying, or inspecting the query but should not be visually conflated with
      typed filter criteria.
  facet_bucket:
    description: Counted facet value that can be selected to apply a filter.
    applies_to:
      capabilities:
      - facetable
    requires:
    - facets
    role: facet_bucket
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    long_description: 'Use facet_bucket to render grouped counts returned for a facetable result surface, such as state counts,
      severity counts, client counts, carrier counts, event-type counts, or facility counts. A facet bucket is both summary
      and action source: selecting it typically applies a corresponding FilterExpression to the current target. Counts should
      be aligned and text-first so facet panels remain scannable in dense applications.

      '
  ingredient_list:
    description: Ordered list of ingredients with role badges and dietary indicators.
    applies_to:
      capabilities:
      - ingredient_composable
    requires:
    - parts
    optional:
    - part_count
    - required_roles
    role: composition_list
    density: regular
    interaction:
      selectable: false
      context_menu: false
      copy: false
    style_recipe: ingredient_list
    long_description: 'Use ingredient_list to render the full composition of a menu item. Each ingredient should show its
      name, role badge (structural, protein, richness, etc.), and dietary flags. Ingredients should be swipeable on mobile
      to reveal quick-remove and substitution actions. The list should visually distinguish required vs optional parts so
      the customer understands which removals will compromise the composition.

      '
  composition_card:
    description: Compact menu item card showing name, price, key ingredients, and dietary tags.
    applies_to:
      archetypes:
      - MenuItem
    requires_any:
    - id
    - label
    optional:
    - parts
    - dietary_tags
    - price
    role: summary_card
    density: regular
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: composition_card
    long_description: 'Use composition_card as the primary browsing surface for menu items. It should show the item name,
      a compact ingredient summary (not the full list), price, and dietary badges. Tapping the card opens the composition_detail
      for full customization. The card should be thumb-friendly on mobile and visually distinct from the dense-row style used
      for order items.

      '
  composition_detail:
    description: Full menu item detail with ingredient list, substitution suggestions, config options, and add-to-order action.
    applies_to:
      archetypes:
      - MenuItem
      capabilities:
      - ingredient_composable
      - configurable
    requires_any:
    - id
    - label
    - parts
    role: detail_panel
    density: spacious
    interaction:
      selectable: false
      context_menu: false
      copy: false
    style_recipe: composition_detail
    long_description: 'Use composition_detail as the full-screen or bottom-sheet view for customizing a menu item before adding
      it to the order. It combines the ingredient_list (with per-ingredient swipe actions), substitution suggestions (inline
      suggestion chips), config selectors (size, spice, temperature), dietary information, price, and the add-to-order action.
      This is the primary interaction surface where the intelligent replacement engine''s suggestions become visible.

      '
  substitution_badge:
    description: Inline badge indicating an active or suggested substitution on an ingredient.
    applies_to:
      capabilities:
      - role_preserving_substitutable
    requires:
    - replaces
    optional:
    - role_preservation
    - dietary_compatibility
    - auto_suggest
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: substitution_badge
    long_description: 'Use substitution_badge as a compact inline indicator that an ingredient has been or can be substituted.
      It should show what was removed (e.g., "No cheese") and optionally what replaces it (e.g., "→ avocado"). The badge should
      use semantic tone to indicate whether the substitution is active (success), suggested (info), or conflicting (warning).
      Tapping the badge opens the substitution_detail for full alternatives.

      '
  substitution_pair:
    description: Side-by-side or before/after presentation of an original ingredient and its replacement.
    applies_to:
      capabilities:
      - role_preserving_substitutable
    requires:
    - replaces
    - replacement_candidates
    optional:
    - role_preservation
    - flavor_fit
    - price_delta_cents
    role: substitution_pair
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: substitution_pair
    long_description: 'Use substitution_pair to show the original ingredient and its top replacement candidate side by side.
      This is the primary way the intelligent replacement engine communicates its reasoning to the customer: "You removed
      cheese → We suggest avocado (richness, creaminess)". The pair should show role overlap, flavor fit, dietary compatibility,
      and price delta so the customer can make an informed choice.

      '
  substitution_detail:
    description: Full detail surface for a substitution, showing all replacement candidates ranked by compatibility.
    applies_to:
      archetypes:
      - IngredientSubstitutionRule
      capabilities:
      - role_preserving_substitutable
    requires:
    - replaces
    - replacement_candidates
    optional:
    - role_preservation
    - dietary_compatibility
    - allergen_flags
    - flavor_fit
    - price_delta_cents
    role: detail_panel
    density: spacious
    interaction:
      selectable: false
      context_menu: false
      copy: false
    style_recipe: substitution_detail
    long_description: 'Use substitution_detail as the full bottom-sheet or screen for exploring all replacement candidates
      for a removed ingredient. It should rank candidates by compatibility score, show which roles each candidate fills, display
      dietary and allergen flags, indicate flavor fit, and show price deltas. The customer can swipe through candidates and
      tap to apply a substitution.

      '
  dietary_badge:
    description: Compact badge showing dietary constraint tag (vegan, GF, etc.).
    applies_to:
      capabilities:
      - dietary
    requires:
    - dietary_tags
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: dietary_badge
    long_description: 'Use dietary_badge to display dietary constraint tags on menu items, ingredients, and substitutions.
      Badges should be compact, use consistent abbreviations (V for vegan, GF for gluten-free, DF for dairy-free, NF for nut-free),
      and use semantic tones to indicate safety (green for matches customer profile, yellow for compatible with caveats, red
      for contains allergen). Tapping a badge filters the menu by that dietary tag.

      '
  allergen_warning:
    description: Warning indicator for allergen presence or cross-contamination risk.
    applies_to:
      capabilities:
      - dietary
    requires_any:
    - allergen_contains
    - allergen_may_contain
    role: warning
    density: compact
    interaction:
      selectable: true
      context_menu: false
      copy: false
    style_recipe: allergen_warning
    long_description: 'Use allergen_warning when a menu item or ingredient contains or may contain an allergen that conflicts
      with the customer''s dietary profile. The warning should be visually prominent (danger tone, icon) but not modal—it
      should inform, not block. Tapping the warning shows the full allergen detail including cross-contamination notes.

      '
  config_selector:
    description: Selector control for configurable menu item options (size, spice, temperature).
    applies_to:
      capabilities:
      - configurable
    requires:
    - config_options
    optional:
    - current_config
    role: selector
    density: regular
    interaction:
      selectable: true
      context_menu: false
      copy: false
    style_recipe: config_selector
    long_description: 'Use config_selector to render the configuration options for a menu item. On mobile, these should be
      segmented controls, radio groups, or slider-style selectors depending on the option type. Each option should show the
      current value and any price impact. Config selectors should be visually distinct from ingredient/substitution controls
      so customers understand the difference between "change the spice level" and "substitute an ingredient".

      '
  config_summary:
    description: Compact inline summary of current configuration choices.
    applies_to:
      capabilities:
      - configurable
    requires:
    - current_config
    role: inline_text
    density: compact
    interaction:
      selectable: false
      context_menu: false
      copy: false
    long_description: 'Use config_summary as a compact inline representation of current configuration choices in cart items
      and order summaries. For example, "Whole · Hot · Medium Spice" below the item name.

      '
  order_item_row:
    description: Dense row for an item in the current order, showing name, config, substitutions, quantity, and price.
    applies_to:
      archetypes:
      - WorkItem
      capabilities:
      - ingredient_composable
    requires_any:
    - id
    - label
    optional:
    - current_config
    - parts
    role: dense_row
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: order_item_row
    long_description: 'Use order_item_row for each line item in the order cart. It should show the item name, config summary,
      active substitution badges, quantity control, and line price. Swipe left to remove; swipe right to edit. The row should
      be compact enough for a mobile cart but detailed enough to confirm the customer''s customization choices.

      '
  menu_category_header:
    description: Section header for menu categories (Sandwiches, Sides, Drinks, etc.).
    applies_to:
      archetypes:
      - MenuItem
    requires_any:
    - label
    role: section_heading
    density: compact
    interaction:
      selectable: false
      context_menu: false
      copy: false
    style_recipe: section_heading
    long_description: 'Use menu_category_header to group menu items by category in the browsing surface. Headers should be
      compact and use the section_heading typography role. They may optionally show item counts or dietary filter indicators.

      '
  prep_status_indicator:
    description: Visual indicator of order preparation status and station assignment.
    applies_to:
      capabilities:
      - stateful
    requires:
    - state
    optional:
    - state_label
    - state_tone
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: prep_status_badge
    long_description: 'Use prep_status_indicator to show the preparation status of an order or order item. States include
      received, in_prep, at_station, ready, picked_up, cancelled. The indicator should use semantic tones (pending=neutral,
      in_prep=active, ready=success, cancelled=danger) and should show station assignment when relevant.

      '
actions:
  inspect:
    description: Open detail view for any inspectable subject.
    category: inspect
    accepts:
    - capability: inspectable
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
        - capability: inspectable
    result:
      kind: open_detail
    long_description: 'Inspect opens or focuses a detail surface for the selected subject. It is the most broadly available
      action because any inspectable subject should be explorable without requiring a domain-specific command. Inspect should
      preserve user context: selecting a row, token, relation, or card should open detail without discarding the surrounding
      stream/table state.'
  copy_reference:
    description: Copy the canonical id or copy value of a semantic presentation.
    category: utility
    accepts:
    - capability: identifiable
    - presentation: compact_ref
    - presentation: compact_id
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
        - capability: identifiable
    result:
      kind: copy
    long_description: Copy_reference copies the stable id or explicit copy value for a selected semantic presentation. It
      exists because dense operational users often move identifiers between tools, logs, tickets, terminals, and chat. The
      action should prefer canonical ids over labels and should be available from compact id/reference presentations.
  filter_by_value:
    description: Add a filter matching the selected presentation value.
    category: filter
    accepts:
    - presentation: inline_token
    - presentation: compact_ref
    - presentation: metric_cell
    arguments:
      value:
        mode: selected_presentation
        required: true
    result:
      kind: apply_filter
    long_description: 'Filter_by_value converts a selected presentation into a query/filter constraint. It is the basic bridge
      between presentation-based UI and exploratory analysis: users can click or context-select a visible semantic value and
      narrow the surface to matching records. This action should work across tokens, compact references, metrics, and other
      value-like presentations.'
  filter_by_state:
    description: Add a filter matching the selected state.
    category: filter
    accepts:
    - capability: stateful
    - presentation: status_badge
    - presentation: state_cell
    arguments:
      state:
        mode: selected_presentation
        required: true
        accepts:
        - capability: stateful
    result:
      kind: apply_filter
    long_description: Filter_by_state is the state-specialized version of filter_by_value. It exists because state is common
      enough to deserve a consistent action label and behavior across domains. Whether the state is failed tool run, delayed
      shipment, blocked task, unhealthy sensor, or pending job, the UI should expose a predictable way to filter by that state.
  open_related:
    description: Navigate to or reveal a related semantic subject.
    category: navigate
    accepts:
    - capability: relatable
    - presentation: relation_link
    arguments:
      relation:
        mode: presentation_candidate
        required: true
        accepts:
        - capability: relatable
    result:
      kind: open_related
    long_description: 'Open_related follows a semantic relation from the current subject to another subject or related collection.
      It supports graph-shaped operational work: event to work item, work item to actor, shipment to package, order to customer,
      sensor reading to device. This action should be offered from relation links and relatable subjects.'
  retry_work_item:
    description: Retry failed or retryable work.
    category: action
    accepts:
    - archetype: WorkItem
      requires_capabilities:
      - stateful
      - actionable
    - archetype: ActionInvocation
      requires_capabilities:
      - stateful
      - executable
    arguments:
      work_item:
        mode: selected_presentation
        required: true
        accepts:
        - archetype: WorkItem
        - archetype: ActionInvocation
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
    long_description: Retry_work_item dispatches a retry operation for failed or retryable operational work. It applies to
      WorkItems and ActionInvocations that expose stateful/actionable or executable semantics. Because retry can have side
      effects, the action should normally require confirmation and should flow through the adapter/backend dispatch boundary
      rather than executing inside a widget.
  cancel_work_item:
    description: Cancel running or scheduled work.
    category: action
    accepts:
    - archetype: WorkItem
      requires_capabilities:
      - stateful
      - actionable
    - archetype: ActionInvocation
      requires_capabilities:
      - stateful
      - executable
    arguments:
      work_item:
        mode: selected_presentation
        required: true
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
    long_description: Cancel_work_item requests cancellation of running or scheduled work. It is similar to retry in that
      it has side effects and must be mediated by trusted application logic. The presentation layer should only expose the
      action and collect typed arguments; the backend or adapter determines whether cancellation is allowed and performs it.
  schedule_action:
    description: Schedule an action spec for execution.
    category: action
    accepts:
    - archetype: ActionSpec
    arguments:
      action_spec:
        mode: selected_presentation
        required: true
        accepts:
        - archetype: ActionSpec
      parameters:
        mode: parameter_form
        required: false
    result:
      kind: dispatch_action
    long_description: Schedule_action turns an ActionSpec into a future or parameterized ActionInvocation. It is used for
      tool definitions, command definitions, scheduled jobs, and workflow actions. The action commonly requires a parameter
      form and should clearly distinguish the specification being scheduled from a concrete invocation that is already running.
  compare_metrics:
    description: Compare selected metric presentations.
    category: inspect
    accepts:
    - capability: measurable
    - presentation: metric_cell
    arguments:
      metric_a:
        mode: selected_presentation
        required: true
      metric_b:
        mode: presentation_candidate
        required: true
        accepts:
        - capability: measurable
    result:
      kind: open_comparison
    long_description: Compare_metrics opens a comparison flow for two or more measurable presentations. It is useful when
      users need to compare latencies, durations, counts, costs, error rates, or throughput values visible on screen. Candidate
      selection should prefer other measurable presentations with compatible semantics or units.
  apply_filter:
    description: Apply a typed filter expression to a compatible filterable target.
    category: filter
    accepts:
    - capability: filter_source
    - presentation: filter_value_token
    - presentation: facet_bucket
    arguments:
      source:
        mode: selected_presentation
        required: true
        accepts:
        - capability: filter_source
      target:
        mode: choice
        required: true
        accepts:
        - capability: filterable
      dimension:
        mode: choice
        required: true
      operator:
        mode: choice
        required: true
    result:
      kind: apply_filter
    long_description: Apply_filter is the explicit target-aware filter action. It turns a selected filter source, facet bucket,
      or user-chosen value into a FilterExpression and applies it to a ResultSet or other filterable target. Widgets collect
      the typed arguments; adapters lower the expression to backend query syntax. This action should be preferred when the
      target, dimension, or operator is ambiguous and the UI needs to ask the user for a choice.
  remove_filter:
    description: Remove one active filter criterion from its target.
    category: filter
    accepts:
    - archetype: FilterCriterion
    - presentation: filter_chip
    arguments:
      criterion:
        mode: selected_presentation
        required: true
        accepts:
        - archetype: FilterCriterion
    result:
      kind: remove_filter
    long_description: Remove_filter removes a single active FilterCriterion from the target ResultSet. It is normally exposed
      from a filter chip close affordance, context menu, keyboard action, or ActionPalette command. Removing a filter should
      update the target's result state through the adapter rather than mutating widget-only local state.
  clear_filters:
    description: Clear all active structured filters from a filterable target.
    category: filter
    accepts:
    - capability: filterable
    - presentation: filter_summary
    arguments:
      target:
        mode: selected_presentation
        required: true
        accepts:
        - capability: filterable
      confirmation:
        mode: confirmation
        required: false
    result:
      kind: clear_filters
    long_description: Clear_filters removes all structured filter criteria from a ResultSet or filterable surface. It should
      be available from FilterBar, filter summaries, command palettes, and result headers. It may require confirmation when
      clearing many constraints would cause a large or expensive query refresh.
  replace_filter:
    description: Replace an existing criterion for the same target or dimension.
    category: filter
    accepts:
    - archetype: FilterCriterion
    - capability: filter_source
    arguments:
      existing:
        mode: selected_presentation
        required: false
        accepts:
        - archetype: FilterCriterion
      replacement:
        mode: presentation_candidate
        required: true
        accepts:
        - capability: filter_source
    result:
      kind: replace_filter
    long_description: Replace_filter updates an existing constraint, usually when only one criterion for a dimension should
      be active at a time. Examples include replacing one session id with another, one state with another, or one time window
      with a new time window. It prevents UIs from accumulating contradictory chips when the intended behavior is replacement.
  filter_by_relation:
    description: Add a relation-based filter derived from a related semantic reference.
    category: filter
    accepts:
    - capability: relatable
    - capability: filter_source
    - presentation: relation_link
    arguments:
      relation:
        mode: selected_presentation
        required: true
        accepts:
        - capability: relatable
      target:
        mode: choice
        required: true
        accepts:
        - capability: filterable
    result:
      kind: apply_filter
    long_description: Filter_by_relation specializes filtering for graph-shaped operational data. It handles cases such as
      event stream by session, tool runs by agent, scan events by shipment, shipments by carrier, or resources by facility.
      The action should preserve the relation path or backend field mapping so adapters can lower it correctly.
  apply_search:
    description: Apply text search to a searchable target.
    category: filter
    accepts:
    - capability: searchable
    arguments:
      target:
        mode: selected_presentation
        required: true
        accepts:
        - capability: searchable
      query:
        mode: free_text
        required: true
    result:
      kind: apply_search
    long_description: Apply_search applies a free-text query to a searchable target. It is intentionally separate from structured
      filtering because search may involve tokenization, backend indexes, highlighting, and query syntax. Search should compose
      with active filters without becoming an untyped filter chip unless the adapter explicitly represents it that way.
  clear_search:
    description: Clear text search from a searchable target.
    category: filter
    accepts:
    - capability: searchable
    - presentation: search_summary
    arguments:
      target:
        mode: selected_presentation
        required: true
        accepts:
        - capability: searchable
    result:
      kind: clear_search
    long_description: Clear_search removes the active free-text query from a searchable target while preserving structured
      filters unless the UI explicitly asks to clear both. It should be available from SearchBox, search summaries, and command
      palettes.
  apply_facet_filter:
    description: Apply a filter expression from a selected facet bucket.
    category: filter
    accepts:
    - capability: facetable
    - presentation: facet_bucket
    arguments:
      bucket:
        mode: selected_presentation
        required: true
        accepts:
        - presentation: facet_bucket
      target:
        mode: choice
        required: true
        accepts:
        - capability: filterable
    result:
      kind: apply_filter
    long_description: Apply_facet_filter turns a counted facet bucket into an active FilterCriterion on the same or compatible
      ResultSet. It lets facet panels operate through the same typed action and adapter boundary as presentation-derived filters
      rather than owning backend query mutation inside the facet widget.
  remove_part:
    description: Remove an ingredient from a composition, triggering the replacement engine.
    category: modify
    accepts:
    - capability: ingredient_composable
    arguments:
      composition:
        mode: selected_presentation
        required: true
        accepts:
        - capability: ingredient_composable
      part_id:
        mode: choice
        required: true
        description: The ingredient to remove from the composition.
    result:
      kind: trigger_replacement
    long_description: 'Remove_part removes an ingredient from a composition and triggers the intelligent replacement engine
      to find substitutes. The action does not just delete; it creates unfilled roles that the replacement engine fills. The
      result includes the substitution candidates for the removed part so the UI can immediately present alternatives.

      '
  add_part:
    description: Add an extra ingredient to a composition.
    category: modify
    accepts:
    - capability: ingredient_composable
    arguments:
      composition:
        mode: selected_presentation
        required: true
      part_id:
        mode: choice
        required: true
        description: The ingredient to add.
    result:
      kind: update_composition
    long_description: 'Add_part adds an extra ingredient to a composition. Unlike substitution, this is additive—no ingredient
      is removed. The system should still check for dietary conflicts and allergen warnings when adding an ingredient.

      '
  substitute_part:
    description: Replace one ingredient with a compatible alternative.
    category: modify
    accepts:
    - capability: ingredient_composable
    - capability: role_preserving_substitutable
    arguments:
      composition:
        mode: selected_presentation
        required: true
      original_part:
        mode: choice
        required: true
      replacement_part:
        mode: choice
        required: true
    result:
      kind: update_composition
    long_description: 'Substitute_part applies a specific substitution to a composition. It replaces the original ingredient
      with the selected alternative, updates the role profile, and recalculates dietary tags and allergen flags. The system
      should confirm if the substitution introduces allergens not present in the original.

      '
  apply_substitution:
    description: Accept a suggested substitution.
    category: modify
    accepts:
    - capability: role_preserving_substitutable
    arguments:
      substitution:
        mode: selected_presentation
        required: true
        accepts:
        - capability: role_preserving_substitutable
    result:
      kind: update_composition
    long_description: 'Apply_substitution accepts a replacement engine suggestion. It is the action that confirms a substitution
      badge or substitution pair, updating the composition accordingly.

      '
  reject_substitution:
    description: Dismiss a suggested substitution, leaving the ingredient removed without replacement.
    category: modify
    accepts:
    - capability: role_preserving_substitutable
    arguments:
      substitution:
        mode: selected_presentation
        required: true
    result:
      kind: dismiss_suggestion
    long_description: 'Reject_substitution dismisses a suggestion without applying it. The ingredient remains removed and
      the role is left unfilled. The UI should note that a required role is now empty.

      '
  see_alternatives:
    description: Browse all replacement candidates for a substitution, not just the top suggestion.
    category: inspect
    accepts:
    - capability: role_preserving_substitutable
    arguments:
      substitution:
        mode: selected_presentation
        required: true
    result:
      kind: open_detail
    long_description: 'See_alternatives opens the full substitution_detail surface showing all ranked replacement candidates,
      not just the top auto-suggestion. This lets the customer explore creative or less obvious substitutions.

      '
  change_config:
    description: Change a configurable option on a menu item (size, spice, temperature, etc.).
    category: modify
    accepts:
    - capability: configurable
    arguments:
      option:
        mode: choice
        required: true
      value:
        mode: choice
        required: true
    result:
      kind: update_config
    long_description: 'Change_config modifies a scalar or categorical option on a configurable item. It is distinct from ingredient
      substitution and should be presented separately in the UI.

      '
  filter_by_dietary:
    description: Filter menu items or substitutions by dietary constraint.
    category: filter
    accepts:
    - capability: dietary
    - presentation: dietary_badge
    arguments:
      dietary_tag:
        mode: choice
        required: true
    result:
      kind: apply_filter
    long_description: 'Filter_by_dietary narrows the visible menu or substitution candidates to those matching a dietary constraint.
      Tapping a dietary badge on any surface should offer this action.

      '
