schema_version: 0
artifact_type: dmeta_design_language
summary: Mobile-friendly deli ordering design-language ranges, recipes, states, and lint rules.
status: draft
mode: archetype_range
references:
  dense_operational_ui_graphic_design_and_ux_archetype: ../../design-docs/03-dense-operational-ui-graphic-design-and-ux-archetype.md
  design_language_tooling_spec: ../../design-docs/06-dmeta-design-language-and-tooling-spec.md
  core_presentations: ./core-model/presentations.yaml
  base_design_language: ../../sources/dmeta-ir/02-design-language.yaml
  dense_operational_ui: ../../design-docs/03-dense-operational-ui-graphic-design-and-ux-archetype.md
  design_tooling_spec: ../../design-docs/06-dmeta-design-language-and-tooling-spec.md
source_guidance:
  archetype_name: Mobile Deli Ordering UI
  aliases:
  - Thumb-Friendly Deli Console
  - Pocket Sandwich Builder
  - Street Counter Touch Interface
  source_document_note: 'This design language adapts the sober dense operational UI archetype for a mobile-first street deli
    ordering application. The key differences from the base archetype: touch-first interaction replaces keyboard-first, thumb
    zones replace mouse targets, and the composition customization flow (ingredient list → swipe → substitution suggestion
    → confirm) replaces dense-stream table scanning. The intelligent replacement system requires visual affordances for substitution
    badges, role indicators, and dietary flags that do not exist in the base model.

    '
  human_authoring_note: 'This is a mobile-first design language. All sizes, targets, and spacing assume a 375–414px wide viewport
    as the baseline. Density is lower than desktop operational consoles because thumb accuracy requires larger targets. However,
    the information-density philosophy remains: the UI should show as much useful information as possible without visual noise.

    '
  core_qualities:
  - Touch-first: all interactive targets meet 44×44pt minimum; swipe gestures are primary.
  - Thumb-zone aware: primary actions sit in the bottom thumb zone; browse content sits mid-screen.
  - Composition-aware: ingredient lists with role badges and substitution indicators are the central visual element.
  - Dietary-transparent: dietary tags and allergen warnings are always visible, never hidden behind interactions.
  - Quick-path optimized: the flow from "see menu item" to "add to order" should be under 5 taps.
  - Substitution-intelligent: replacement suggestions appear inline and can be accepted with a single tap.
  anti_goals:
  - Do not build a generic food delivery app UI; this is a street deli counter with a specific ordering flow.
  - Do not hide dietary or allergen information behind tabs, modals, or progressive disclosure.
  - Do not treat substitution suggestions as advertising or upselling; they are intelligent role-preservation recommendations.
  - Do not use decorative food photography that increases load time and adds no ordering information.
  - Do not use bottom navigation bars with 5 tabs; the ordering flow is linear, not tabbed.
theme_axes:
  density:
    values:
    - compact
    - regular
    default: regular
    description: 'Mobile density is more constrained than desktop. Compact mode uses smaller cards and tighter ingredient
      lists; regular mode uses comfortable touch targets. There is no spacious mode on mobile—detail panels become bottom
      sheets instead.

      '
    hard_boundaries:
    - Touch targets must be at least 44×44pt regardless of density mode.
    - Ingredient list items must be tall enough to swipe reliably even in compact mode.
  neutral_tone:
    values:
    - warm_white
    - subtle_warm_gray
    - kraft_paper
    default: warm_white
    description: 'Deli ordering benefits from a warm, approachable neutral that feels like a paper menu rather than a clinical
      console. Kraft paper tone is acceptable for a casual street deli aesthetic but must not introduce texture or grain.

      '
    hard_boundaries:
    - Backgrounds must remain texture-free even when using warm tones.
    - Text contrast must meet WCAG AA on all neutral backgrounds.
  type_mode:
    values:
    - sans_with_mono
    - rounded_sans
    default: rounded_sans
    description: 'A slightly rounded sans-serif feels approachable for a deli without becoming childish. Monospace is still
      used for prices, order numbers, and timestamps.

      '
  radius:
    values:
    - square
    - slight
    default: slight
    description: Controls corner treatment. The range is intentionally narrow because large rounded surfaces undermine the
      precise operational tone.
  row_treatment:
    values:
    - plain
    - striped
    - ruled
    - banded
    default: ruled
    description: 'Controls how dense repeated records separate from one another: plain, striped, ruled, or banded. The choice
      should improve scanning, not add decoration.'
  surface_separation:
    values:
    - spacing
    - keyline
    - tint
    - subtle_shadow
    default: keyline
    description: Controls whether panels separate through spacing, hairlines, subtle tint, or rare shadows. Static operational
      surfaces should usually prefer keylines and spacing.
  accent_strategy:
    values:
    - single_primary
    - ingredient_color
    default: ingredient_color
    description: 'Deli ordering can use subtle ingredient-inspired accent colors (ripe avocado green, smoked salmon pink,
      toasted bread amber) for role indicators and substitution badges, but must not turn the interface into a colorful food
      collage.

      '
    hard_boundaries:
    - Accent colors must remain tied to semantic roles or ingredient categories, not decoration.
    - No more than 3 accent colors visible at once on any screen.
typography:
  families:
    ui_sans:
      role: interface
      examples:
      - Nunito
      - DM Sans
      - SF Pro Rounded
    ui_mono:
      role: prices_numbers_order_ids
      examples:
      - Berkeley Mono
      - IBM Plex Mono
      - SF Mono
  roles:
    body:
      family: ui_sans
      size_range:
      - 15
      - 17
      weight_range:
      - 400
      - 500
      line_height_range:
      - 1.35
      - 1.5
      purpose: Menu item names, ingredient labels, order summaries.
      long_purpose: Primary readable text for the ordering interface. Larger than desktop body to meet touch-target and readability
        requirements on mobile.
    metadata:
      family: ui_mono
      size_range:
      - 12
      - 14
      weight_range:
      - 400
      - 500
      line_height_range:
      - 1.25
      - 1.4
      purpose: Order numbers, timestamps, price values, quantity counts.
      long_purpose: Compact monospaced text for precise numeric and identifier display. Prices should use tabular figures.
    label:
      family: ui_sans
      size_range:
      - 11
      - 13
      weight_range:
      - 600
      - 700
      transform: uppercase
      tracking_range:
      - 0.04em
      - 0.08em
      purpose: Section headers, dietary badges, role tags, station indicators.
      long_purpose: Short labels for section headers, dietary badges (DF, GF, V), ingredient role tags (structural, protein,
        richness), and station names.
    title:
      family: ui_sans
      size_range:
      - 20
      - 28
      weight_range:
      - 600
      - 700
      line_height_range:
      - 1.1
      - 1.2
      purpose: Menu item name in detail view; order confirmation title.
      long_purpose: Sparse hierarchy marker for detail views and confirmation screens. Should not appear in browsing surfaces.
    price:
      family: ui_mono
      size_range:
      - 15
      - 17
      weight_range:
      - 500
      - 600
      numeric: tabular
      purpose: Prices on menu cards, cart items, and totals.
      long_purpose: Prices are semantically important in an ordering app. They deserve their own typography role with tabular
        alignment for easy comparison.
    role_tag:
      family: ui_sans
      size_range:
      - 10
      - 12
      weight_range:
      - 600
      - 700
      transform: uppercase
      tracking_range:
      - 0.06em
      - 0.1em
      purpose: Ingredient role badges (PROTEIN, RICHNESS, CRUNCH, etc.).
      long_purpose: Ultra-compact role tags that appear next to ingredient names in the composition view. They must be immediately
        scannable without reading the ingredient name.
    code:
      family: ui_mono
      size_range:
      - 12
      - 14
      weight_range:
      - 400
      - 500
      line_height_range:
      - 1.25
      - 1.4
      purpose: Identifiers, order numbers, and compact technical values.
    section_heading:
      family: ui_sans
      size_range:
      - 13
      - 16
      weight_range:
      - 700
      - 800
      line_height_range:
      - 1.1
      - 1.25
      purpose: Menu category and section headings.
  long_summary: 'Typography is the primary visual hierarchy mechanism. Dense operational UI should use few roles with clear
    responsibilities. Body text carries records and labels; metadata/code roles carry exact identifiers, timestamps, and values;
    label roles carry headers and badges; title roles are used sparingly. The aim is sustained readability, not dramatic scale.
    The source archetype also calls out an emphasis/section role: a modest 13-16px medium-weight label for section headings
    and row primary labels. Do not introduce large dashboard display type into dense work surfaces unless the surface is explicitly
    a sparse overview.'
  hard_rules:
  - A concrete design system should use no more than 5-7 named typography roles.
  - Every typography role must have a named semantic purpose.
  - Identifiers, timestamps, code, and numeric columns use tabular figures and usually a mono role.
  - Body text should use normal tracking; uppercase tracking is reserved for compact labels and headers.
  - Avoid oversized page titles inside dense work surfaces; titles should orient, not dominate.
density:
  modes:
    compact:
      row_height_range:
      - 22
      - 28
      cell_padding_x_range:
      - 4
      - 8
      cell_padding_y_range:
      - 2
      - 4
      font_body_range:
      - 12
      - 13
      description: Use for streams, dense tables, inline tokens, and high-volume monitoring surfaces where many items must
        be visible at once.
    regular:
      row_height_range:
      - 28
      - 36
      cell_padding_x_range:
      - 6
      - 10
      cell_padding_y_range:
      - 4
      - 6
      font_body_range:
      - 13
      - 14
      description: Use as the default balanced mode for most operational pages.
    spacious:
      row_height_range:
      - 36
      - 44
      cell_padding_x_range:
      - 10
      - 14
      cell_padding_y_range:
      - 6
      - 10
      font_body_range:
      - 14
      - 15
      description: Use for detail drawers, forms, or inspection panels where users need more room to parse structured fields.
  long_summary: Density modes coordinate row height, padding, and typography across widgets. They prevent every widget from
    inventing its own compactness. Compact mode is for high-volume streams and tables; regular mode is the default; spacious
    mode is for inspection surfaces where comprehension beats throughput.
  surface_recommendations:
    log_event_row:
      dense_range:
      - 22
      - 26
      regular_range:
      - 28
      - 32
      guidance: Use for logs, event streams, lifecycle updates, scans, and tool output rows.
    table_row:
      dense_range:
      - 24
      - 30
      regular_range:
      - 32
      - 40
      guidance: Use for sortable/filterable tables where column alignment matters.
    command_item:
      dense_range:
      - 28
      - 34
      regular_range:
      - 36
      - 44
      guidance: Command items need enough height for keyboard scanning, shortcut hints, and optional descriptions.
    detail_field_row:
      dense_range:
      - 22
      - 28
      regular_range:
      - 30
      - 36
      guidance: Detail panels may be compact, but should preserve enough space for labels, values, copy affordances, and wrapping.
  rules:
  - Density should not be ad hoc per widget; it is consumed by rows, tables, tokens, menus, panels, and forms.
  - Compact mode is for throughput surfaces; spacious mode is for comprehension surfaces.
  - Do not collapse line-height to fit more records if identifiers or timestamps become hard to read.
spacing:
  base_grid: 4
  tokens:
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 32
  - 40
  rules:
  - Touch targets are minimum 44×44pt (11×11 grid units).
  - Ingredient list items need 12pt vertical padding for reliable swipe gestures.
  - Cart items need 8pt vertical separation.
  - Bottom sheets need 24pt top padding for drag handle.
  long_summary: Spacing expresses grouping and rhythm. The system should prefer consistent small spacing tokens and hairline
    structure over decorative boxes. Local ad hoc spacing should migrate into density helpers once tooling exists.
color:
  neutral_roles:
    background:
      range:
      - warm_white
      - subtle_warm_gray
      purpose: Main app background.
    surface:
      purpose: Menu cards, bottom sheets, cart panels.
    text_primary:
      purpose: Menu item names, ingredient names, order details.
    text_secondary:
      purpose: Descriptions, subtitles, config summaries.
    text_muted:
      purpose: Metadata, prices in browsing context, timestamps.
    divider:
      opacity_range:
      - 0.1
      - 0.2
  semantic_roles:
    neutral:
      purpose: Default non-emphatic state.
    info:
      purpose: Substitution suggestion, dietary info badge.
    success:
      purpose: Order confirmed, item ready, substitution applied.
    warning:
      purpose: Allergen caution, unfulfilled required role, cross-contamination risk.
    danger:
      purpose: Allergen conflict, order cancelled, unavailable item.
    pending:
      purpose: Order received, in queue.
    active:
      purpose: Currently being prepared, at station.
    selected:
      purpose: Selected menu item, chosen substitution.
  rules:
  - Ingredient role colors are used for role tags and substitution indicators only, not for broad backgrounds.
  - Dietary badges use semantic tones: green for safe/matching, yellow for compatible-with-caveats, red for contains-allergen.
  - Price text uses neutral text color; sale/discount uses success tone.
  - Substitution suggestion chips use info tone; accepted substitutions shift to success tone.
  - Unfilled required roles after a removal show warning tone.
  long_summary: Color is semantic and restrained. The default interface should be mostly subtle neutral/cool-grey surfaces
    and dark readable text. Status/category color should be used only when it helps users understand state, risk, selection,
    or operational category.
  hard_boundaries:
  - No decorative background noise, paper grain, texture, or ornamental patterning.
  - No broad saturated panels for ordinary status.
  - No raw status colors outside semantic state, category, risk, selection, or attention contexts.
  ingredient_role_colors:
    structural:
      tone: amber
      description: Bread, wrap, base—structural foundation.
    protein:
      tone: warm_brown
      description: Meat, tofu, tempeh—primary protein source.
    richness:
      tone: avocado_green
      description: Cheese, avocado, mayo—richness and creaminess.
    moisture:
      tone: light_blue
      description: Sauce, dressing, mayo—moisture and binding.
    acidity:
      tone: yellow_green
      description: Pickle, mustard, vinegar—acidity and tang.
    crunch:
      tone: lettuce_green
      description: Lettuce, onion, chips—crunch and freshness.
    heat:
      tone: red_orange
      description: Hot sauce, jalapeño, spice—heat and pungency.
    garnish:
      tone: herb_green
      description: Herbs, sprouts, garnish—finishing touch.
borders:
  width_range:
  - 1
  - 1
  high_dpi_width_optional: 0.5
  divider_style: hairline
  radius_range:
  - 0
  - 4
  rules:
  - Persistent panels use keylines, spacing, or tint before shadows.
  - Avoid large radii for dense operational UI.
  - No decorative border gradients.
  - Floating surfaces may use shadow; persistent content surfaces usually should not.
  - Large pill/card radii are outside the baseline archetype unless a specific theme explicitly narrows and documents the
    exception.
  long_summary: Borders and keylines provide most structural separation. Use thin lines and slight radius at most. Static
    surfaces should avoid heavy elevation; floating surfaces can use subtle shadow only when needed for layering.
elevation:
  static_surfaces: none
  floating_surfaces:
    allowed:
    - menu
    - popover
    - command_palette
    - tooltip
    shadow: subtle
  long_summary: Elevation is rare. Menus, popovers, command palettes, and tooltips may float, but persistent operational panels
    should rely on spacing, keylines, and subtle surface contrast.
  rules:
  - No heavy drop shadows on static panels.
  - Use subtle elevation only to clarify z-order for transient/floating surfaces.
  - A menu, popover, tooltip, or command palette may float; a data table, stream, or panel should generally not.
layout:
  primitives:
    menu_browser:
      regions:
      - dietary_filter_bar
      - category_tabs
      - menu_card_list
      - cart_button
      description: Primary browsing surface showing menu categories and item cards.
      rules:
      - Dietary filter bar is always visible at the top.
      - Category tabs scroll horizontally.
      - Menu cards are in a vertical scrolling list.
      - Cart button floats at the bottom with item count and total.
    composition_customizer:
      regions:
      - item_header
      - ingredient_list
      - config_options
      - substitution_suggestions
      - dietary_summary
      - add_to_order_button
      description: Full customization surface for a selected menu item.
      rules:
      - Opens as a bottom sheet or full screen.
      - Ingredient list is swipeable for remove/substitute.
      - Substitution suggestions appear inline below the removed ingredient.
      - Config options (size, spice, temperature) use segmented controls.
      - Dietary summary shows current item's dietary profile.
      - Add-to-order button is always in the bottom thumb zone.
    order_cart:
      regions:
      - order_item_list
      - subtotal
      - dietary_summary
      - place_order_button
      description: Order review and submission surface.
      rules:
      - Slides up from the bottom.
      - Each order item shows config, substitutions, and price.
      - Dietary summary aggregates all items.
      - Place order button is in the bottom thumb zone.
    order_tracker:
      regions:
      - order_status_header
      - station_progress
      - prep_events
      - pickup_instructions
      description: Post-order status tracking surface.
      rules:
      - Shows station-by-station progress.
      - Prep events stream in reverse chronological order.
      - Pickup instructions are prominent when order is ready.
  long_summary: Layout primitives name the recurring spatial patterns of dense operational applications. These are not necessarily
    generated components; they are shared vocabulary for widgets, stories, and audits.
presentation_recipes:
  compact_ref:
    typography: code
    density: compact
    affordances:
    - hover_underline
    - copy_on_menu
    - context_menu
    states:
    - rest
    - hover
    - focus
    - selected
    - candidate
    - disabled
    description: Visual treatment for compact, selectable references. It should look like precise text with affordances rather
      than a heavy pill.
  status_badge:
    typography: label
    color_source: state_tone
    shape: slight_radius
    affordances:
    - context_menu_optional
    states:
    - rest
    - hover
    - focus
    - selected
    description: Visual treatment for stateful badges/cells. Text is mandatory; tone is semantic reinforcement.
  dense_row:
    typography: body
    density: compact_or_regular
    row_treatment: ruled
    affordances:
    - selection
    - hover_actions
    - context_menu
    - keyboard_focus
    states:
    - rest
    - hover
    - focus
    - selected
    - candidate
    - active
    description: Visual treatment for dense repeated records. It coordinates row density, selection, hover actions, and focus
      treatment.
  metric_cell:
    typography: code
    alignment: right
    numeric: tabular
    affordances:
    - copy_optional
    - compare_optional
    states:
    - rest
    - hover
    - focus
    - selected
    description: Visual treatment for numeric values. It emphasizes alignment, units, and comparability.
  presentation_token:
    typography: body
    density: compact
    affordances:
    - hover_underline
    - copy_on_menu
    - context_menu
    - selection
    - argument_candidate
    states:
    - rest
    - hover
    - focus
    - selected
    - candidate
    - disabled
    description: Generic inline semantic presentation. It may look like plain text at rest, but still carries presentation
      identity, data attributes, and typed-action affordances.
  detail_panel:
    typography: body
    density: regular_or_spacious
    affordances:
    - copy_fields
    - open_related
    - section_collapse
    - toolbar_actions
    states:
    - rest
    - focus
    - active
    description: Inspection surface for a selected subject. It should preserve context, use more spacing than streams, and
      expose copy/related/action affordances predictably.
  filter_chip:
    typography: metadata
    density: compact
    affordances:
    - remove
    - focus
    - context_menu_optional
    states:
    - rest
    - hover
    - focus
    - selected
    - disabled
    description: Compact representation of active query state. It includes field/operator/value and should render semantic
      values through the presentation registry where possible.
  command_item:
    typography: body
    density: regular
    affordances:
    - keyboard_shortcut_hint
    - filter_match
    - argument_collection
    states:
    - rest
    - hover
    - focus
    - selected
    - disabled
    description: Command palette row. It is text-heavy, filterable, keyboard-first, and may show accepted semantic types/archetypes
      plus shortcut hints.
  section_heading:
    typography: section_heading
    density: regular
    affordances:
    - collapse_optional
    - toolbar_optional
    states:
    - rest
    - focus
    description: Restrained local hierarchy for panel sections and detail groups. It should orient the user without disrupting
      dense scan rhythm.
  composition_card:
    typography: body
    density: regular
    affordances:
    - tap_to_customize
    - dietary_badges_visible
    - price_visible
    states:
    - rest
    - pressed
    - selected
    - disabled
    description: Menu item card. Shows name, compact ingredient summary, price, dietary badges.
  ingredient_list:
    typography: body
    density: regular
    affordances:
    - swipe_to_remove
    - swipe_to_substitute
    - long_press_detail
    states:
    - rest
    - swipe_reveal
    - selected
    description: List of ingredients with role tags, dietary flags, and swipe actions.
  substitution_badge:
    typography: label
    color_source: info_or_success_tone
    shape: pill
    affordances:
    - tap_to_apply
    - tap_to_see_alternatives
    states:
    - rest
    - pressed
    - applied
    description: Inline badge showing removal and replacement suggestion. "No cheese → Avocado".
  substitution_pair:
    typography: body
    density: compact
    affordances:
    - tap_to_apply
    - see_alternatives
    states:
    - rest
    - pressed
    - applied
    description: Side-by-side original and replacement with role overlap and dietary compatibility.
  dietary_badge:
    typography: label
    shape: pill
    color_source: dietary_tone
    affordances:
    - tap_to_filter
    states:
    - rest
    - pressed
    - active_filter
    description: Compact dietary tag badge (V, GF, DF, NF).
  prep_status_badge:
    typography: label
    shape: slight_radius
    color_source: state_tone
    affordances:
    - tap_for_detail
    states:
    - rest
    - pressed
    description: Station preparation status indicator.
  order_item_row:
    typography: body
    density: compact
    affordances:
    - swipe_to_edit
    - swipe_to_remove
    - tap_to_expand
    states:
    - rest
    - swipe_reveal
    - expanded
    description: Cart item row with name, config summary, substitution badges, quantity, price.
  role_tag:
    typography: role_tag
    shape: pill
    color_source: ingredient_role_color
    affordances: []
    states:
    - rest
    description: Ultra-compact role tag (PROTEIN, RICHNESS, etc.) next to ingredient names.
  composition_detail:
    typography: body
    density: regular
    affordances: []
    states:
    - rest
    - pressed
    description: Full-screen or bottom-sheet composition customization detail surface.
  substitution_detail:
    typography: body
    density: regular
    affordances: []
    states:
    - rest
    - pressed
    description: Bottom-sheet detail surface for ranked replacement candidates.
  allergen_warning:
    typography: label
    density: compact
    affordances: []
    states:
    - rest
    - pressed
    description: Danger/warning-toned allergen indicator.
  config_selector:
    typography: body
    density: regular
    affordances: []
    states:
    - rest
    - pressed
    description: Touch-friendly selector for item configuration options.
interaction_states:
  states:
    rest:
      purpose: Default non-interacting state.
    pressed:
      purpose: Touch/press active; replaces hover for touch interfaces.
      description: Touch press feedback. Should provide immediate visual response within 100ms.
    selected:
      purpose: Selected menu item, active dietary filter, chosen substitution.
    candidate:
      purpose: Valid substitution candidate during replacement flow.
    active:
      purpose: Currently in preparation at a station.
    disabled:
      purpose: Unavailable menu item or ingredient, sold out.
    swipe_reveal:
      purpose: Swiping an ingredient row reveals remove/substitute actions.
      description: Mobile-specific state where swipe gesture reveals action buttons behind the row.
    applied:
      purpose: Accepted substitution or applied filter state.
    active_filter:
      purpose: Dietary or menu filter currently constraining results.
    expanded:
      purpose: Expanded row or bottom-sheet detail state.
    hover:
      purpose: Pointer hover state retained for desktop/web parity when the mobile UI is used with a mouse.
    focus:
      purpose: Keyboard or accessibility focus state.
    error:
      purpose: Invalid or dangerous state such as allergen conflict.
  rules:
  - All interactive targets must have press feedback.
  - Swipe gestures are primary for ingredient list actions.
  - Long-press opens detail context (ingredient detail, substitution alternatives).
  - Bottom sheets are preferred over modals for substitution flows.
  - Cart slide-up is the primary order review mechanism.
  - Dietary filter chips should persist at the top of the menu browsing surface.
  long_summary: Interaction states must be consistent across widgets so presentation-based actions feel predictable. Focus,
    selection, candidate, and active states are semantically different and should not collapse into one generic highlight.
  keyboard_first_behavior:
    global_command_palette: Ctrl/Cmd+K
    table_list_navigation:
    - ArrowUp
    - ArrowDown
    - PageUp
    - PageDown
    - Home
    - End
    copy_current_token_or_row_id: single shortcut where possible
    open_detail:
    - Enter
    - dedicated shortcut where appropriate
    context_action_menu: keyboard accessible equivalent to right-click
    close_transient_surfaces: Escape closes in predictable order
  typed_action_guidance:
  - The current source selection should be visually marked while collecting arguments.
  - Candidate presentations should be distinguishable from ordinary selection.
  - Context actions are filtered by domain type, archetypes, capabilities, and presentation id.
data_attributes:
  prefix: data-dmeta
  required_for_presentations:
  - semantic-id
  - domain-type
  - archetypes
  - capabilities
  - presentation-id
  - label
  - copy-value
  - source-surface
  - source-path
  required_for_widgets:
  - widget-id
  - widget-level
  required_for_actions:
  - action-id
  - action-category
  long_summary: Data attributes provide a stable bridge for testing, inspection, and presentation-based action routing. Widgets
    should use generated helpers rather than hand-writing data-dmeta attributes, so naming remains consistent.
  runtime_contract_note: Every selectable presentation should carry enough runtime attributes for testing, inspection, copy,
    context-menu routing, and typed action argument collection. Not every presentation needs a visible border or chip; the
    runtime identity may be richer than the visual treatment.
lint_rules:
  no_raw_colors:
    severity: warning
    description: Promoted widgets should use generated color helpers/tokens.
    long_description: Promoted widgets should use generated color helpers/tokens. This rule exists to keep dense operational
      UI consistent as generated scaffolds are manually promoted into real widgets.
  no_unauthorized_type_roles:
    severity: warning
    description: Widgets should use named typography roles.
    long_description: Widgets should use named typography roles. This rule exists to keep dense operational UI consistent
      as generated scaffolds are manually promoted into real widgets.
  no_local_status_badges:
    severity: warning
    description: Status badges should use registered presentation/design recipe.
    long_description: Status badges should use registered presentation/design recipe. This rule exists to keep dense operational
      UI consistent as generated scaffolds are manually promoted into real widgets.
  no_local_density_constants:
    severity: warning
    description: Row heights and cell padding should use density helpers.
    long_description: Row heights and cell padding should use density helpers. This rule exists to keep dense operational
      UI consistent as generated scaffolds are manually promoted into real widgets.
  no_heavy_static_shadows:
    severity: warning
    description: Static surfaces should not use heavy elevation.
    long_description: Static surfaces should not use heavy elevation. This rule exists to keep dense operational UI consistent
      as generated scaffolds are manually promoted into real widgets.
  no_manual_dmeta_data_attributes:
    severity: warning
    description: Widgets should use generated data attribute helpers.
    long_description: Widgets should use generated data attribute helpers. This rule exists to keep dense operational UI consistent
      as generated scaffolds are manually promoted into real widgets.
  hover_controls_keyboard_accessible:
    severity: error
    description: Hover-revealed controls must be reachable by keyboard.
    long_description: Hover-revealed controls must be reachable by keyboard. This rule exists to keep dense operational UI
      consistent as generated scaffolds are manually promoted into real widgets.
  no_decorative_background_noise:
    severity: error
    description: Dense operational surfaces must not use decorative texture, grain, patterning, or background noise.
    long_description: The archetype is texture-free and low-noise. Background decoration competes with dense text and makes
      sustained operational scanning harder.
  no_oversized_static_titles:
    severity: warning
    description: Dense work surfaces should avoid oversized title/display typography.
    long_description: Titles orient users, but should not dominate high-information work areas. Use the title role sparingly
      and prefer section_heading for local hierarchy.
  status_color_semantic_only:
    severity: warning
    description: Status colors must be tied to semantic state, category, risk, selection, or attention.
    long_description: Color is not decoration. Review broad or saturated color use unless it is explicitly tied to a semantic
      status/category task.
  no_pill_every_token:
    severity: warning
    description: Do not render every semantic presentation as a colorful chip or pill.
    long_description: Inline text can still be a semantic presentation. Use chip/badge treatments only when they improve scanning,
      state recognition, selection, or action affordance.
  focus_visible_all_interactive:
    severity: error
    description: Every interactive widget and semantic presentation must have visible keyboard focus.
    long_description: Keyboard and context fluency are first-class. Focus cannot disappear in dense mode.
  no_unapproved_radii_or_shadows:
    severity: warning
    description: Widgets should not introduce radii or shadows outside design-language ranges.
    long_description: Large radii and heavy static shadows undermine the precise operational tone and make generated systems
      drift toward generic product-card UI.
  collapse_long_payloads_by_default:
    severity: warning
    description: Long payloads, JSON, stack traces, notes, and histories should default collapsed with size/count context.
    long_description: Progressive disclosure preserves dense scanability while keeping rich detail reachable.
  touch_target_minimum:
    severity: error
    description: All interactive elements must meet 44×44pt minimum touch target.
    long_description: Mobile touch interfaces require generous targets. Any button, badge, or swipeable row that falls below
      44×44pt is an accessibility and usability failure.
  dietary_always_visible:
    severity: error
    description: Dietary tags and allergen warnings must not be hidden behind interactions.
    long_description: In a food ordering context, hiding dietary information behind taps or modals is a safety risk. Dietary
      badges must be visible on menu cards and ingredient lists.
  no_hidden_substitution_costs:
    severity: warning
    description: Price deltas for substitutions must be shown before application.
    long_description: Customers must see the cost impact of a substitution before confirming it. No surprise upcharges.
  substitution_not_upsell:
    severity: warning
    description: Substitution suggestions must not be disguised upselling.
    long_description: The replacement engine suggests based on role preservation and dietary compatibility, not profit margin.
      If a higher-priced item is suggested, it must be because it is the best role match, not because it costs more.
  allergen_warning_visible:
    severity: error
    description: Allergen conflicts between substitutions and customer dietary profile must show explicit warnings.
    long_description: If a substitution candidate contains an allergen that the customer's dietary profile flags, the UI must
      show a danger-toned warning before the substitution can be applied.
  ingredient_role_tagged:
    severity: warning
    description: Every ingredient in a composition should carry a role tag for the replacement engine to reason about.
    long_description: Ingredients without role tags cannot participate in the intelligent replacement system. Every part of
      a composable menu item must have at least one role.
validation:
  require_axis_defaults_in_values: true
  require_typography_role_references: true
  require_presentation_recipe_state_references: true
  require_lint_rule_severities:
  - info
  - warning
  - error
long_summary: 'This design-language IR describes the visual and interaction constraints for sober dense operational user interfaces.
  It is intentionally written as a human-readable source of truth as well as a future generator input. It links back to the
  dense operational UI graphic design archetype and encodes the major rules from that document: typography and alignment carry
  hierarchy; neutral cool-grey surfaces and hairlines carry structure; color is semantic and restrained; hover utilities must
  remain keyboard reachable; selection, focus, active, and action-candidate states are distinct; and generated widgets should
  avoid decorative chrome, texture, broad status backgrounds, and ad hoc spacing/type/color choices. Concrete systems may
  choose exact tokens later, but they should remain inside these ranges and explanations.'
theme_axes_summary: 'Theme axes define the controlled variation that a concrete design-system instance may choose from. They
  are not arbitrary theme knobs: each axis is constrained so generated widgets remain recognizably part of the sober dense
  operational UI family. A concrete app can choose compact vs regular density or mono-only vs sans-with-mono, but it should
  not introduce decorative surfaces, loud gradients, or inconsistent interaction states through theme configuration.'
presentation_recipes_summary: 'Presentation recipes connect semantic presentations to visual behavior. They should stay generic:
  a status badge recipe can render shipment status, tool run status, or sensor health without becoming domain-specific.'
lint_rules_summary: Lint rules turn design-language intent into enforceable review checks. They should start as warnings where
  the implementation is immature and become stricter once generated helpers and promoted widgets stabilize.
component_archetypes:
  presentation_token:
    summary: Compact inline rendering of a semantic object, projection, relation, state, or metric.
    rules:
    - Small, text-first, low padding.
    - Can be clickable/selectable when semantic type/capability supports actions.
    - Carries data attributes for archetype/capability/domain type.
    - Supports hover, copy, and context-menu affordances.
    - Inline text can still be a presentation; do not force every token into a chip.
  compact_reference:
    summary: Compact rendering of Actor, WorkItem, Resource, Relation endpoints, trace ids, run ids, and similar references.
    rules:
    - Shows label and/or id.
    - Uses middle truncation for long identifiers.
    - Exposes copy and inspect actions.
    - May include a tiny state marker when the subject is stateful.
  status_badge:
    summary: Compact state presentation for stateful subjects.
    rules:
    - Text label is mandatory.
    - Color reinforces the label.
    - Shape is compact and low-radius.
    - No glossy styling.
    - Tone is derived from state mapping.
  dense_row:
    summary: Presentation of Event, WorkItem, Resource, or domain-specific records in a repeated dense surface.
    rules:
    - Expose stable identity and inspect action.
    - Tokenize row content where possible.
    - Support hover actions without displaying every action at rest.
    - Support focus and keyboard activation.
  detail_panel:
    summary: Expanded inspection surface that keeps context visible.
    rules:
    - Use sections separated by spacing and keylines.
    - Present key-value fields with copy affordances.
    - Show related objects as compact references.
    - Show actions in a predictable toolbar or footer.
    - Do not become a modal unless a blocking decision is required.
  filter_chip:
    summary: Persistent representation of query/filter state.
    rules:
    - Includes field, operator, and value.
    - Compact, removable, and keyboard focusable.
    - Values should use the same presentation registry when possible.
  metric_cell:
    summary: Comparable measurable/aggregatable values.
    rules:
    - Right-align comparable numbers.
    - Use units explicitly.
    - Align decimals.
    - Use tiny trend/sparkline only when useful, not decorative.
hardening_guidance:
  summary: This file intentionally keeps ranges. A concrete design system must choose hard values and then lint against them.
  hard_values_to_choose:
  - font sizes and weights per typography role
  - row heights and padding per density mode
  - background/surface/text/divider tokens
  - status tones
  - radius and border widths
  - shadow tokens for floating surfaces only
  lint_targets:
  - unauthorized font sizes
  - unauthorized font weights
  - raw colors not mapped to design tokens
  - status colors outside semantic contexts
  - unapproved border radii or shadows
  - widgets using local spacing instead of density tokens
  - hidden hover-only critical actions
concrete_outputs:
  design_language_yaml:
  - typography roles
  - density modes
  - color semantics
  - spacing scale
  - border/radius/elevation rules
  - presentation-state styles
  - interaction-state styles
  generated_helpers:
  - typography.ts
  - density.ts
  - tokens.ts
  - presentationStyles.ts
  - actionStyles.ts
  - dataAttributes.ts
  lint_rules:
  - no raw color literals
  - no unauthorized type roles
  - no ad hoc status badges
  - no local density constants
  - no heavy shadows on static surfaces
  - no hidden hover-only critical actions
  playbook_rules:
  - how to instantiate the design archetype for a concrete domain
  - how to choose hard tokens from ranges
  - how to promote generated widget scaffolds without violating the archetype
  - how to audit visual drift
