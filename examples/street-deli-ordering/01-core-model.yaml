schema_version: 0
artifact_type: dmeta_core_model
summary: Split semantic archetype, capability, presentation, action, and domain example package for the Street Deli mobile ordering meta design system.
long_summary: >
  This core model extends the base DMETA v0 vocabulary with domain-specific archetypes and capabilities
  needed for a street deli mobile ordering application. The most important addition is the intelligent
  ingredient replacement system: when a customer removes an ingredient (e.g., "no cheese"), the system
  suggests compatible replacements (e.g., avocado) based on ingredient role, dietary constraints, flavor
  profile compatibility, and station availability. The model maps deli concepts—menu items, orders,
  ingredients, substitutions, stations, customers, and prep events—onto the DMETA archetype/capability
  vocabulary so that the same presentation and action machinery used for agent workflows and retail
  logistics can produce a concrete deli ordering UI.
status: draft
