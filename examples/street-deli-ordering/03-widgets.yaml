schema_version: 0
artifact_type: dmeta_widget_ir
summary: Deli-ordering-specific widget classes for the Street Deli mobile ordering meta design system.
long_summary: >
  This file defines the widget inventory for the street deli mobile ordering application.
  Widgets are organized around the ordering flow: menu browsing, composition customization,
  substitution interaction, cart management, and order tracking. The intelligent replacement
  system introduces unique widgets not present in the base DMETA widget inventory:
  IngredientRow, SubstitutionChip, RoleTag, DietaryBadge, and CompositionCustomizer.
status: draft

widgets:
  # --- Atoms ---

  - id: deli.role_tag
    name: RoleTag
    status: draft
    classification:
      level: atom
      role: semantic_label
    intent:
      purpose: Render an ultra-compact ingredient role label (PROTEIN, RICHNESS, CRUNCH, etc.) with ingredient-role color.
      adapter_boundary: Receives role id and optional tone override; does not parse runtime JSON.
    consumes:
      presentations: []
    contract:
      props:
        RoleTagProps:
          fields:
            role:
              type: ingredient_role
              required: true
            tone_override:
              type: tone
              required: false
            size:
              type: '"compact" | "regular"'
              required: false
    stories:
      - all_roles
      - compact_mode
      - with_tone_override
    outputs:
      component: src/deli/widgets/RoleTag/RoleTag.tsx
      types: src/deli/widgets/RoleTag/RoleTag.types.ts
      metadata: src/deli/widgets/RoleTag/RoleTag.metadata.ts
      stories: src/deli/widgets/RoleTag/RoleTag.stories.tsx

  - id: deli.dietary_badge
    name: DietaryBadge
    status: draft
    classification:
      level: atom
      role: semantic_badge
    intent:
      purpose: Render a compact dietary constraint badge (V, GF, DF, NF, etc.) with semantic tone.
      adapter_boundary: Receives dietary tag id and compatibility status; does not parse runtime JSON.
    consumes:
      capabilities:
        - dietary
    contract:
      props:
        DietaryBadgeProps:
          fields:
            tag:
              type: dietary_tag
              required: true
            compatibility:
              type: '"safe" | "caveat" | "conflict"'
              required: false
            onTap:
              type: '() => void'
              required: false
    stories:
      - all_tags
      - safe_caveat_conflict
      - as_filter
    outputs:
      component: src/deli/widgets/DietaryBadge/DietaryBadge.tsx
      types: src/deli/widgets/DietaryBadge/DietaryBadge.types.ts
      metadata: src/deli/widgets/DietaryBadge/DietaryBadge.metadata.ts
      stories: src/deli/widgets/DietaryBadge/DietaryBadge.stories.tsx

  - id: deli.substitution_chip
    name: SubstitutionChip
    status: draft
    classification:
      level: atom
      role: action_suggestion
    intent:
      purpose: Render an inline replacement suggestion chip showing original → replacement with role and dietary compatibility.
      adapter_boundary: Receives substitution data; emits apply/reject/see_alternatives callbacks.
    consumes:
      capabilities:
        - substitutable
      presentations:
        - substitution_badge
    contract:
      props:
        SubstitutionChipProps:
          fields:
            original:
              type: string
              required: true
              description: Original ingredient name.
            replacement:
              type: string
              required: true
              description: Suggested replacement ingredient name.
            roles_filled:
              type: 'ingredient_role[]'
              required: false
            dietary_tags:
              type: 'dietary_tag[]'
              required: false
            price_delta_cents:
              type: integer
              required: false
            flavor_fit:
              type: flavor_profile
              required: false
            state:
              type: '"suggested" | "applied" | "dismissed"'
              required: false
    action_slots:
      onApply:
        accepts: SubstitutionRef
      onReject:
        accepts: SubstitutionRef
      onSeeAlternatives:
        accepts: SubstitutionRef
    stories:
      - no_cheese_to_avocado
      - no_bacon_to_smoked_tofu
      - no_bread_to_lettuce_wrap
      - applied_state
      - dismissed_state
      - with_price_delta
      - with_allergen_warning
    outputs:
      component: src/deli/widgets/SubstitutionChip/SubstitutionChip.tsx
      types: src/deli/widgets/SubstitutionChip/SubstitutionChip.types.ts
      metadata: src/deli/widgets/SubstitutionChip/SubstitutionChip.metadata.ts
      stories: src/deli/widgets/SubstitutionChip/SubstitutionChip.stories.tsx

  - id: deli.price_text
    name: PriceText
    status: draft
    classification:
      level: atom
      role: metric_display
    intent:
      purpose: Render a price value with tabular alignment, currency symbol, and optional delta indicator.
      adapter_boundary: Receives numeric price in cents; does not parse runtime JSON.
    consumes:
      capabilities:
        - measurable
    contract:
      props:
        PriceTextProps:
          fields:
            cents:
              type: integer
              required: true
            delta_cents:
              type: integer
              required: false
              description: Price change delta for substitutions/upgrades.
            show_sign:
              type: boolean
              required: false
    stories:
      - base_price
      - with_delta_up
      - with_delta_down
    outputs:
      component: src/deli/widgets/PriceText/PriceText.tsx
      types: src/deli/widgets/PriceText/PriceText.types.ts
      metadata: src/deli/widgets/PriceText/PriceText.metadata.ts
      stories: src/deli/widgets/PriceText/PriceText.stories.tsx

  - id: deli.prep_status_badge
    name: PrepStatusBadge
    status: draft
    classification:
      level: atom
      role: semantic_badge
    intent:
      purpose: Render order preparation status with semantic tone (received, in_prep, ready, etc.).
      adapter_boundary: Receives status string and tone; does not parse runtime JSON.
    consumes:
      capabilities:
        - stateful
      presentations:
        - prep_status_indicator
    contract:
      props:
        PrepStatusBadgeProps:
          fields:
            status:
              type: string
              required: true
            label:
              type: string
              required: false
            tone:
              type: tone
              required: false
            station_name:
              type: string
              required: false
    stories:
      - all_statuses
      - with_station
    outputs:
      component: src/deli/widgets/PrepStatusBadge/PrepStatusBadge.tsx
      types: src/deli/widgets/PrepStatusBadge/PrepStatusBadge.types.ts
      metadata: src/deli/widgets/PrepStatusBadge/PrepStatusBadge.metadata.ts
      stories: src/deli/widgets/PrepStatusBadge/PrepStatusBadge.stories.tsx

  # --- Molecules ---

  - id: deli.ingredient_row
    name: IngredientRow
    status: draft
    classification:
      level: molecule
      role: composable_part
    intent:
      purpose: Render a single ingredient in a composition with name, role tags, dietary flags, and swipe-to-remove/substitute actions.
      adapter_boundary: Receives ingredient presentation ref and role data; emits remove/substitute callbacks.
    consumes:
      capabilities:
        - composable
      presentations:
        - ingredient_list
    contract:
      props:
        IngredientRowProps:
          fields:
            ingredient:
              type: PresentationRef
              required: true
            roles:
              type: 'ingredient_role[]'
              required: true
            dietary_tags:
              type: 'dietary_tag[]'
              required: false
            allergen_flags:
              type: 'allergen_flag[]'
              required: false
            is_required:
              type: boolean
              required: false
            substitution_suggestion:
              type: SubstitutionRef
              required: false
              description: Inline substitution chip shown when ingredient is swiped to remove.
    action_slots:
      onRemove:
        accepts: PresentationRef
      onSubstitute:
        accepts: PresentationRef
      onLongPress:
        accepts: PresentationRef
    stories:
      - basic_ingredient
      - with_role_tags
      - with_dietary_badges
      - with_substitution_suggestion
      - swipe_reveal_remove
      - swipe_reveal_substitute
      - required_ingredient_warning
    outputs:
      component: src/deli/widgets/IngredientRow/IngredientRow.tsx
      types: src/deli/widgets/IngredientRow/IngredientRow.types.ts
      metadata: src/deli/widgets/IngredientRow/IngredientRow.metadata.ts
      stories: src/deli/widgets/IngredientRow/IngredientRow.stories.tsx

  - id: deli.config_selector
    name: ConfigSelector
    status: draft
    classification:
      level: molecule
      role: option_picker
    intent:
      purpose: Render configurable menu item options as segmented controls, radio groups, or sliders.
      adapter_boundary: Receives config option definitions and current values; emits change callbacks.
    consumes:
      capabilities:
        - configurable
      presentations:
        - config_selector
    contract:
      props:
        ConfigSelectorProps:
          fields:
            options:
              type: 'ConfigOption[]'
              required: true
            current_values:
              type: 'map<string, string>'
              required: true
    action_slots:
      onChange:
        accepts: ConfigChange
    stories:
      - size_selector
      - spice_level_selector
      - temperature_selector
    outputs:
      component: src/deli/widgets/ConfigSelector/ConfigSelector.tsx
      types: src/deli/widgets/ConfigSelector/ConfigSelector.types.ts
      metadata: src/deli/widgets/ConfigSelector/ConfigSelector.metadata.ts
      stories: src/deli/widgets/ConfigSelector/ConfigSelector.stories.tsx

  - id: deli.allergen_warning_banner
    name: AllergenWarningBanner
    status: draft
    classification:
      level: molecule
      role: safety_warning
    intent:
      purpose: Render a prominent allergen conflict warning between a substitution candidate and the customer's dietary profile.
      adapter_boundary: Receives allergen data; does not parse runtime JSON.
    consumes:
      capabilities:
        - dietary
      presentations:
        - allergen_warning
    contract:
      props:
        AllergenWarningBannerProps:
          fields:
            allergen:
              type: string
              required: true
            severity:
              type: '"contains" | "may_contain"'
              required: true
            source_ingredient:
              type: string
              required: true
    stories:
      - contains_warning
      - may_contain_caution
    outputs:
      component: src/deli/widgets/AllergenWarningBanner/AllergenWarningBanner.tsx
      types: src/deli/widgets/AllergenWarningBanner/AllergenWarningBanner.types.ts
      metadata: src/deli/widgets/AllergenWarningBanner/AllergenWarningBanner.metadata.ts
      stories: src/deli/widgets/AllergenWarningBanner/AllergenWarningBanner.stories.tsx

  # --- Organisms ---

  - id: deli.composition_card
    name: CompositionCard
    status: draft
    classification:
      level: organism
      role: menu_item_card
    intent:
      purpose: Render a browsable menu item card with name, ingredient summary, price, dietary badges, and tap-to-customize action.
      adapter_boundary: Receives menu item presentation ref; does not parse runtime JSON.
    consumes:
      archetypes:
        - Composition
      capabilities:
        - composable
        - dietary
      presentations:
        - composition_card
    contract:
      props:
        CompositionCardProps:
          fields:
            item:
              type: PresentationRef
              required: true
            price_cents:
              type: integer
              required: true
            dietary_tags:
              type: 'dietary_tag[]'
              required: false
            ingredient_summary:
              type: string
              required: false
    action_slots:
      onTapCustomize:
        accepts: PresentationRef
    stories:
      - sandwich_card
      - bowl_card
      - with_dietary_badges
      - sold_out_state
    outputs:
      component: src/deli/widgets/CompositionCard/CompositionCard.tsx
      types: src/deli/widgets/CompositionCard/CompositionCard.types.ts
      metadata: src/deli/widgets/CompositionCard/CompositionCard.metadata.ts
      stories: src/deli/widgets/CompositionCard/CompositionCard.stories.tsx

  - id: deli.composition_customizer
    name: CompositionCustomizer
    status: draft
    classification:
      level: organism
      role: item_customizer
    intent:
      purpose: Full customization surface for a menu item: ingredient list with swipe actions, inline substitution chips, config selectors, dietary summary, and add-to-order.
      adapter_boundary: Receives full menu item presentation ref with composition and config data; emits composition changes and add-to-order action.
    consumes:
      archetypes:
        - Composition
      capabilities:
        - composable
        - substitutable
        - configurable
        - dietary
      presentations:
        - composition_detail
        - ingredient_list
        - substitution_badge
        - substitution_pair
        - config_selector
        - dietary_badge
    contract:
      props:
        CompositionCustomizerProps:
          fields:
            item:
              type: PresentationRef
              required: true
            current_composition:
              type: CompositionState
              required: true
            substitution_suggestions:
              type: 'SubstitutionRef[]'
              required: false
            customer_dietary_profile:
              type: 'dietary_tag[]'
              required: false
    action_slots:
      onRemoveIngredient:
        accepts: PresentationRef
      onApplySubstitution:
        accepts: SubstitutionRef
      onChangeConfig:
        accepts: ConfigChange
      onAddToOrder:
        accepts: OrderItemRequest
    stories:
      - full_customization_flow
      - with_substitution_suggestions
      - with_allergen_conflict
      - dietary_filtered
    outputs:
      component: src/deli/widgets/CompositionCustomizer/CompositionCustomizer.tsx
      types: src/deli/widgets/CompositionCustomizer/CompositionCustomizer.types.ts
      metadata: src/deli/widgets/CompositionCustomizer/CompositionCustomizer.metadata.ts
      stories: src/deli/widgets/CompositionCustomizer/CompositionCustomizer.stories.tsx

  - id: deli.substitution_detail_sheet
    name: SubstitutionDetailSheet
    status: draft
    classification:
      level: organism
      role: substitution_browser
    intent:
      purpose: Bottom sheet showing all ranked replacement candidates for a removed ingredient, with role overlap, flavor fit, dietary flags, and price deltas.
      adapter_boundary: Receives substitution presentation ref with all candidates; emits apply/reject callbacks.
    consumes:
      archetypes:
        - Substitution
      capabilities:
        - substitutable
      presentations:
        - substitution_detail
    contract:
      props:
        SubstitutionDetailSheetProps:
          fields:
            original_ingredient:
              type: string
              required: true
            candidates:
              type: 'SubstitutionCandidate[]'
              required: true
            unfilled_roles:
              type: 'ingredient_role[]'
              required: true
            customer_dietary_profile:
              type: 'dietary_tag[]'
              required: false
    action_slots:
      onApplyCandidate:
        accepts: SubstitutionCandidateRef
      onDismiss:
        accepts: SubstitutionRef
    stories:
      - cheese_replacement_candidates
      - bacon_replacement_candidates
      - bread_replacement_candidates
      - with_allergen_warnings
    outputs:
      component: src/deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.tsx
      types: src/deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.types.ts
      metadata: src/deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.metadata.ts
      stories: src/deli/widgets/SubstitutionDetailSheet/SubstitutionDetailSheet.stories.tsx

  - id: deli.order_cart
    name: OrderCart
    status: draft
    classification:
      level: organism
      role: cart_review
    intent:
      purpose: Slide-up cart showing order items with customizations, substitutions, config summaries, dietary aggregation, and place-order action.
      adapter_boundary: Receives order presentation ref; emits place-order action.
    consumes:
      archetypes:
        - WorkItem
        - Composition
      capabilities:
        - composable
        - configurable
        - dietary
        - stateful
      presentations:
        - order_item_row
        - dietary_badge
        - prep_status_indicator
    contract:
      props:
        OrderCartProps:
          fields:
            order:
              type: PresentationRef
              required: true
            items:
              type: 'OrderItemRef[]'
              required: true
            total_cents:
              type: integer
              required: true
    action_slots:
      onEditItem:
        accepts: OrderItemRef
      onRemoveItem:
        accepts: OrderItemRef
      onPlaceOrder:
        accepts: OrderRef
    stories:
      - single_item_cart
      - multi_item_cart
      - with_substitutions_shown
      - empty_cart
    outputs:
      component: src/deli/widgets/OrderCart/OrderCart.tsx
      types: src/deli/widgets/OrderCart/OrderCart.types.ts
      metadata: src/deli/widgets/OrderCart/OrderCart.metadata.ts
      stories: src/deli/widgets/OrderCart/OrderCart.stories.tsx

  - id: deli.order_tracker
    name: OrderTracker
    status: draft
    classification:
      level: organism
      role: status_tracker
    intent:
      purpose: Post-order status tracking showing station progress, prep events, and pickup instructions.
      adapter_boundary: Receives order and event presentation refs; does not emit actions (read-only tracking).
    consumes:
      archetypes:
        - WorkItem
        - TimelineSpan
        - Event
      capabilities:
        - stateful
        - temporal
      presentations:
        - prep_status_indicator
        - timeline_marker
        - dense_row
    contract:
      props:
        OrderTrackerProps:
          fields:
            order:
              type: PresentationRef
              required: true
            prep_events:
              type: 'PresentationRef[]'
              required: false
            current_station:
              type: string
              required: false
    stories:
      - order_received
      - in_prep_multi_station
      - ready_for_pickup
      - completed
    outputs:
      component: src/deli/widgets/OrderTracker/OrderTracker.tsx
      types: src/deli/widgets/OrderTracker/OrderTracker.types.ts
      metadata: src/deli/widgets/OrderTracker/OrderTracker.metadata.ts
      stories: src/deli/widgets/OrderTracker/OrderTracker.stories.tsx

  - id: deli.menu_browser
    name: MenuBrowser
    status: draft
    classification:
      level: organism
      role: menu_surface
    intent:
      purpose: Primary browsing surface with dietary filter bar, category tabs, and composition card list.
      adapter_boundary: Receives menu item presentation refs; emits selection callbacks.
    consumes:
      archetypes:
        - Composition
      capabilities:
        - dietary
      presentations:
        - composition_card
        - dietary_badge
        - menu_category_header
    contract:
      props:
        MenuBrowserProps:
          fields:
            items:
              type: 'PresentationRef[]'
              required: true
            categories:
              type: 'string[]'
              required: true
            active_dietary_filters:
              type: 'dietary_tag[]'
              required: false
    action_slots:
      onSelectItem:
        accepts: PresentationRef
      onToggleDietaryFilter:
        accepts: dietary_tag
    stories:
      - full_menu
      - filtered_vegan
      - filtered_gluten_free
      - by_category
    outputs:
      component: src/deli/widgets/MenuBrowser/MenuBrowser.tsx
      types: src/deli/widgets/MenuBrowser/MenuBrowser.types.ts
      metadata: src/deli/widgets/MenuBrowser/MenuBrowser.metadata.ts
      stories: src/deli/widgets/MenuBrowser/MenuBrowser.stories.tsx
