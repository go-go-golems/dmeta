name: publish-examples-static

on:
  pull_request:
    paths:
      - Dockerfile.examples-static
      - .github/workflows/publish-examples-static.yaml
      - examples/street-deli-ordering/www/**
  push:
    branches:
      - main
      - task/dmeta-dsl
    paths:
      - Dockerfile.examples-static
      - .github/workflows/publish-examples-static.yaml
      - examples/street-deli-ordering/www/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: go-go-golems/dmeta-examples-static

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish static examples image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.examples-static
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
