schema_version: 0
artifact_type: dmeta_core_model
summary: Consolidated semantic archetype, capability, presentation, action, and domain example model for DMETA v0.
status: draft

logical_types:
  primitives: [string, number, integer, boolean, datetime, duration_ms, tone, json]
  collections: [list, map]

archetypes:
  Actor:
    description: Entity that can perform, own, receive, or be assigned work.
    default_capabilities: [identifiable, labelable, actionable, relatable, inspectable]
    recommended_presentations: [compact_ref, inline_token, summary_card, detail_panel]
    examples: [Agent, User, Carrier, Warehouse, Service, Assignee]
  WorkItem:
    description: Unit of work that can be tracked, progressed, completed, failed, retried, or inspected.
    default_capabilities: [identifiable, labelable, stateful, temporal, actionable, inspectable, relatable]
    recommended_presentations: [compact_ref, dense_row, summary_card, detail_panel]
    examples: [ToolRun, Shipment, Order, BuildJob, Ticket, PipelineStep]
  Event:
    description: Timestamped observation, log entry, scan, lifecycle update, or state transition.
    default_capabilities: [identifiable, temporal, append_only, inspectable, relatable]
    recommended_presentations: [inline_token, dense_row, detail_panel]
    examples: [LogEvent, ToolEvent, ScanEvent, StatusTransition, SensorReading]
  Resource:
    description: Thing used, moved, consumed, stored, referenced, or inspected by work.
    default_capabilities: [identifiable, labelable, relatable, inspectable]
    recommended_presentations: [compact_ref, summary_card, detail_panel]
    examples: [File, Package, InventoryItem, Machine, Endpoint, Location]
  Relation:
    description: Semantic edge between objects, such as assignment, dependency, containment, trigger, or location.
    default_capabilities: [identifiable, labelable, relatable, inspectable]
    recommended_presentations: [relation_link, inline_token, detail_panel]
    examples: [AssignedTo, DependsOn, BelongsTo, TriggeredBy, LocatedAt]
  Metric:
    description: Quantitative value used for comparison, monitoring, sorting, aggregation, or alerting.
    default_capabilities: [measurable, aggregatable, temporal, inspectable]
    recommended_presentations: [metric_cell, inline_token, summary_card]
    examples: [Duration, Latency, Throughput, Count, Cost, ErrorRate]
  TimelineSpan:
    description: Bounded interval such as a session, route, workflow run, incident window, or execution phase.
    default_capabilities: [identifiable, labelable, temporal, stateful, aggregatable, inspectable, relatable]
    recommended_presentations: [timeline_marker, dense_row, summary_card, detail_panel]
    examples: [Session, ShipmentRoute, WorkflowRun, IncidentWindow, ExecutionPhase]
  ActionSpec:
    description: Definition/signature of an operation that may be invoked or scheduled.
    default_capabilities: [identifiable, labelable, actionable, parameterized, inspectable]
    recommended_presentations: [compact_ref, summary_card, detail_panel]
    examples: [ToolDefinition, CommandDefinition, MutationSpec, ScheduledJobTemplate]
  ActionInvocation:
    description: Concrete execution of an operation.
    default_capabilities: [identifiable, labelable, stateful, temporal, executable, schedulable, inspectable, relatable]
    recommended_presentations: [dense_row, summary_card, detail_panel]
    examples: [ToolRun, JobRun, MutationRun, ImportRun]
  Annotation:
    description: Human or system-authored note, flag, classification, or explanation attached to another semantic object.
    default_capabilities: [identifiable, labelable, temporal, inspectable, relatable]
    recommended_presentations: [inline_token, summary_card, detail_panel]
    examples: [Comment, Flag, Label, ReviewNote, IncidentNote]

capabilities:
  identifiable:
    description: Subject has stable identity.
    projections:
      id:
        type: string
        required: true
        description: Canonical stable id.
    presentations: [compact_id]
    actions: [copy_reference]
    filters: [equals, not_equals, in]
  labelable:
    description: Subject has human-readable label text.
    projections:
      label:
        type: string
        required: true
        description: Primary display label.
      subtitle:
        type: string
        required: false
        description: Optional secondary label.
    presentations: [display_label]
    filters: [contains, equals]
  stateful:
    description: Subject has state/status that can be shown, filtered, and acted on.
    projections:
      state:
        type: string
        required: true
        description: Canonical state value.
      state_label:
        type: string
        required: false
        description: Human-readable state label.
      state_tone:
        type: tone
        required: false
        description: Optional semantic tone override.
    presentations: [status_badge, state_cell]
    actions: [filter_by_state]
    filters: [equals, not_equals, in]
  temporal:
    description: Subject has instant, interval, or duration time semantics.
    projections:
      timestamp:
        type: datetime
        required: false
        description: Instant timestamp.
      start_time:
        type: datetime
        required: false
        description: Interval start.
      end_time:
        type: datetime
        required: false
        description: Interval end.
      duration_ms:
        type: duration_ms
        required: false
        description: Duration in milliseconds.
    presentations: [timestamp_inline, duration_cell]
    filters: [before, after, between]
  inspectable:
    description: Subject can open a detail/inspection surface.
    projections:
      detail_ref:
        type: string
        required: false
        description: Optional detail routing reference.
    presentations: [detail_panel]
    actions: [inspect]
  relatable:
    description: Subject can reference or be referenced by other semantic subjects.
    projections:
      relation_refs:
        type: list
        required: false
        description: Related semantic references.
      actor_ref:
        type: string
        required: false
        description: Related actor id.
      work_item_ref:
        type: string
        required: false
        description: Related work item id.
      resource_ref:
        type: string
        required: false
        description: Related resource id.
    presentations: [relation_link]
    actions: [open_related]
    filters: [has_relation, relation_equals]
  actionable:
    description: Subject can be used as an action source or target.
    projections:
      available_actions:
        type: list
        required: false
        description: Optional action ids available for this subject.
    actions: [inspect]
  streamable:
    description: Subject can appear in an ordered stream.
    projections:
      sequence:
        type: integer
        required: false
        description: Optional stream sequence number.
  append_only:
    description: Subject is an immutable or append-only observation.
    projections:
      sequence:
        type: integer
        required: false
        description: Optional append-only sequence.
  measurable:
    description: Subject has numeric value semantics.
    projections:
      value:
        type: number
        required: true
        description: Numeric value.
      unit:
        type: string
        required: false
        description: Unit label.
    presentations: [metric_cell]
    filters: [lt, lte, gt, gte, between]
  aggregatable:
    description: Subject can be summarized or aggregated.
    projections:
      aggregate_key:
        type: string
        required: false
        description: Grouping key.
  schedulable:
    description: Subject can be scheduled for execution.
    projections:
      scheduled_at:
        type: datetime
        required: false
        description: Scheduled time.
    actions: [schedule_action]
  executable:
    description: Subject represents executable work.
    projections:
      execution_state:
        type: string
        required: false
        description: Execution-specific state.
    actions: [retry_work_item, cancel_work_item]
  spatial:
    description: Subject has location, route, or spatial semantics.
    projections:
      location:
        type: string
        required: false
        description: Location reference.
      origin:
        type: string
        required: false
        description: Origin reference.
      destination:
        type: string
        required: false
        description: Destination reference.
  parameterized:
    description: Subject has parameters or schema-defined inputs.
    projections:
      parameters:
        type: json
        required: false
        description: Parameter schema or current parameter values.

presentations:
  compact_id:
    description: Compact copyable identifier.
    layer: capability
    applies_to:
      capabilities: [identifiable]
    requires: [id]
    role: inline_code
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  display_label:
    description: Primary human-readable label.
    layer: capability
    applies_to:
      capabilities: [labelable]
    requires: [label]
    optional: [subtitle]
    role: inline_text
    density: any
    interaction:
      selectable: false
      context_menu: false
      copy: false
  status_badge:
    description: Compact state/status badge.
    layer: capability
    applies_to:
      capabilities: [stateful]
    requires: [state]
    optional: [state_label, state_tone]
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
  state_cell:
    description: Table cell state presentation.
    layer: capability
    applies_to:
      capabilities: [stateful]
    requires: [state]
    optional: [state_label, state_tone]
    role: table_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
  timestamp_inline:
    description: Compact timestamp display.
    layer: capability
    applies_to:
      capabilities: [temporal]
    requires_any: [timestamp, start_time]
    role: inline_mono
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  duration_cell:
    description: Duration value for tables/details.
    layer: capability
    applies_to:
      capabilities: [temporal]
    requires: [duration_ms]
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
  metric_cell:
    description: Numeric metric display with unit and alignment.
    layer: capability
    applies_to:
      capabilities: [measurable]
    requires: [value]
    optional: [unit]
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
  relation_link:
    description: Compact link/reference to a related semantic object.
    layer: capability
    applies_to:
      capabilities: [relatable]
    requires_any: [relation_refs, actor_ref, work_item_ref, resource_ref]
    role: relation_link
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  compact_ref:
    description: Compact reference combining id and label.
    layer: archetype
    applies_to:
      capabilities: [identifiable, labelable]
    requires: [id, label]
    optional: [state, state_tone]
    role: compact_reference
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  inline_token:
    description: Inline semantic token for dense streams.
    layer: archetype
    applies_to:
      archetypes: [Actor, WorkItem, Event, Resource, Metric, TimelineSpan]
    requires_any: [id, label, state, timestamp, value]
    role: inline_token
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  dense_row:
    description: Dense row for streams or tables.
    layer: archetype
    applies_to:
      archetypes: [WorkItem, Event, Resource, TimelineSpan, ActionInvocation]
    requires_any: [id, label, timestamp]
    role: dense_row
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: dense_row
  summary_card:
    description: Compact card/summary surface.
    layer: archetype
    applies_to:
      archetypes: [Actor, WorkItem, Resource, TimelineSpan, ActionSpec, ActionInvocation]
    requires_any: [id, label]
    role: summary_card
    density: regular
    interaction:
      selectable: true
      context_menu: true
      copy: false
  detail_panel:
    description: Full inspection surface for selected semantic subject.
    layer: archetype
    applies_to:
      capabilities: [inspectable]
    requires_any: [id, label, detail_ref]
    role: detail_panel
    density: spacious
    interaction:
      selectable: false
      context_menu: false
      copy: true
  timeline_marker:
    description: Compact marker or span for temporal processes.
    layer: archetype
    applies_to:
      archetypes: [TimelineSpan, Event, WorkItem]
    requires_any: [timestamp, start_time, end_time]
    role: timeline_marker
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false

actions:
  inspect:
    description: Open detail view for any inspectable subject.
    category: inspect
    accepts:
      - capability: inspectable
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
          - capability: inspectable
    result:
      kind: open_detail
  copy_reference:
    description: Copy the canonical id or copy value of a semantic presentation.
    category: utility
    accepts:
      - capability: identifiable
      - presentation: compact_ref
      - presentation: compact_id
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
          - capability: identifiable
    result:
      kind: copy
  filter_by_value:
    description: Add a filter matching the selected presentation value.
    category: filter
    accepts:
      - presentation: inline_token
      - presentation: compact_ref
      - presentation: metric_cell
    arguments:
      value:
        mode: selected_presentation
        required: true
    result:
      kind: apply_filter
  filter_by_state:
    description: Add a filter matching the selected state.
    category: filter
    accepts:
      - capability: stateful
      - presentation: status_badge
      - presentation: state_cell
    arguments:
      state:
        mode: selected_presentation
        required: true
        accepts:
          - capability: stateful
    result:
      kind: apply_filter
  open_related:
    description: Navigate to or reveal a related semantic subject.
    category: navigate
    accepts:
      - capability: relatable
      - presentation: relation_link
    arguments:
      relation:
        mode: presentation_candidate
        required: true
        accepts:
          - capability: relatable
    result:
      kind: open_related
  retry_work_item:
    description: Retry failed or retryable work.
    category: action
    accepts:
      - archetype: WorkItem
        requires_capabilities: [stateful, actionable]
      - archetype: ActionInvocation
        requires_capabilities: [stateful, executable]
    arguments:
      work_item:
        mode: selected_presentation
        required: true
        accepts:
          - archetype: WorkItem
          - archetype: ActionInvocation
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
  cancel_work_item:
    description: Cancel running or scheduled work.
    category: action
    accepts:
      - archetype: WorkItem
        requires_capabilities: [stateful, actionable]
      - archetype: ActionInvocation
        requires_capabilities: [stateful, executable]
    arguments:
      work_item:
        mode: selected_presentation
        required: true
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
  schedule_action:
    description: Schedule an action spec for execution.
    category: action
    accepts:
      - archetype: ActionSpec
    arguments:
      action_spec:
        mode: selected_presentation
        required: true
        accepts:
          - archetype: ActionSpec
      parameters:
        mode: parameter_form
        required: false
    result:
      kind: dispatch_action
  compare_metrics:
    description: Compare selected metric presentations.
    category: inspect
    accepts:
      - capability: measurable
      - presentation: metric_cell
    arguments:
      metric_a:
        mode: selected_presentation
        required: true
      metric_b:
        mode: presentation_candidate
        required: true
        accepts:
          - capability: measurable
    result:
      kind: open_comparison

domain_examples:
  agent_workflow:
    description: AI agent workflow dashboard pressure test.
    domain_types:
      Agent:
        description: Agent or model-backed worker.
        archetypes: [Actor]
        capabilities:
          identifiable:
            id: agent_id
          labelable:
            label: display_name
            subtitle: model_name
          stateful:
            state: status
          temporal:
            timestamp: last_seen_at
      ToolSpec:
        description: Tool definition/signature.
        archetypes: [ActionSpec]
        capabilities:
          identifiable:
            id: tool_name
          labelable:
            label: title
            subtitle: description
          parameterized:
            parameters: input_schema
      ToolRun:
        description: Concrete tool execution.
        archetypes: [ActionInvocation, WorkItem]
        capabilities:
          identifiable:
            id: call_id
          labelable:
            label: tool_name
          stateful:
            state: status
          temporal:
            start_time: started_at
            end_time: finished_at
            duration_ms: duration_ms
          relatable:
            actor_ref: agent_id
          executable:
            execution_state: status
      ToolEvent:
        description: Append-only observation emitted by a tool run.
        archetypes: [Event]
        capabilities:
          identifiable:
            id: event_id
          temporal:
            timestamp: timestamp
          append_only:
            sequence: sequence
          relatable:
            work_item_ref: call_id
      Session:
        description: Agent workflow session.
        archetypes: [TimelineSpan]
        capabilities:
          identifiable:
            id: session_id
          labelable:
            label: title
          temporal:
            start_time: started_at
            end_time: ended_at
          stateful:
            state: status
  retail_logistics:
    description: Retail logistics/order pipeline pressure test.
    domain_types:
      Carrier:
        description: Shipping carrier or delivery service.
        archetypes: [Actor]
        capabilities:
          identifiable:
            id: carrier_id
          labelable:
            label: carrier_name
          stateful:
            state: availability
      Warehouse:
        description: Warehouse/facility participating in fulfillment.
        archetypes: [Actor, Resource]
        capabilities:
          identifiable:
            id: warehouse_id
          labelable:
            label: warehouse_name
          spatial:
            location: facility_location
      Order:
        description: Customer order moving through fulfillment.
        archetypes: [WorkItem]
        capabilities:
          identifiable:
            id: order_id
          labelable:
            label: order_number
            subtitle: customer_name
          stateful:
            state: order_status
          temporal:
            timestamp: created_at
          relatable:
            actor_ref: customer_id
      Shipment:
        description: Shipment lifecycle for an order or package set.
        archetypes: [WorkItem, TimelineSpan]
        capabilities:
          identifiable:
            id: shipment_id
          labelable:
            label: tracking_number
            subtitle: destination
          stateful:
            state: shipment_status
          temporal:
            start_time: created_at
            end_time: delivered_at
          spatial:
            origin: origin_facility
            destination: destination_address
          relatable:
            actor_ref: carrier_id
            resource_ref: order_id
      Package:
        description: Physical package/resource in fulfillment.
        archetypes: [Resource]
        capabilities:
          identifiable:
            id: package_id
          labelable:
            label: package_label
          relatable:
            work_item_ref: shipment_id
      ScanEvent:
        description: Append-only facility/carrier scan event.
        archetypes: [Event]
        capabilities:
          identifiable:
            id: scan_id
          temporal:
            timestamp: scanned_at
          stateful:
            state: scan_type
          spatial:
            location: facility_id
          relatable:
            work_item_ref: shipment_id

validation:
  require_unique_ids:
    - archetypes
    - capabilities
    - presentations
    - actions
  require_known_references:
    archetype_capabilities: true
    archetype_presentations: true
    capability_presentations: true
    capability_actions: true
    presentation_capabilities: true
    presentation_archetypes: true
    action_accepts: true
    domain_example_archetypes: true
    domain_example_capabilities: true
  require_domain_examples:
    - agent_workflow
    - retail_logistics
