schema_version: 0
artifact_type: dmeta_ir_index
summary: Minimal DMETA v0 IR package for dense operational design-system compiler experiments.
status: draft

artifacts:
  core_model:
    path: ./01-core-model.yaml
    artifact_type: dmeta_core_model
    description: Split core-model package index with references to archetypes, capabilities, and per-domain examples.
    consumers:
      - validate-dmeta-ir
      - generate-core
  design_language:
    path: ./02-design-language.yaml
    artifact_type: dmeta_design_language
    description: Sober dense operational UI design-language ranges, recipes, states, and lint rules.
    consumers:
      - validate-dmeta-ir
      - generate-design-language
      - lint-dmeta-design-system
  interactions:
    path: ./interactions/00-index.yaml
    artifact_type: dmeta_interaction_package
    description: Modality-neutral actions, representations, and elaboration rules shared by MetaDesignSystems.
    consumers:
      - validate-dmeta-ir
      - elaborate-dmeta-interactions
      - lower-dmeta-metadesign
  web_meta_design_system:
    path: ./meta-design-systems/web/meta-design-system.yaml
    artifact_type: dmeta_meta_design_system
    description: Web/visual UI MetaDesignSystem package. Owns widget templates, surfaces, layouts, and React-target lowering inputs.
    consumers:
      - validate-dmeta-ir
      - lower-web
      - plan-scaffold
      - scaffold-react
  pbui_meta_design_system:
    path: ./meta-design-systems/pbui/meta-design-system.yaml
    artifact_type: dmeta_pbui_meta_design_system
    description: Presentation-based UI MetaDesignSystem package for CLIM-style presentation obligations and React proof target planning.
    consumers:
      - validate-pbui
      - lower-pbui
      - plan-pbui-react
      - scaffold-pbui-react

references:
  system_spec: ../../design-docs/04-concrete-dmeta-system-spec.md
  core_widget_spec: ../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
  design_tooling_spec: ../../design-docs/06-dmeta-design-language-and-tooling-spec.md

validation:
  require_artifact_type_match: true
  require_schema_version_match: true
  require_paths_exist: true
