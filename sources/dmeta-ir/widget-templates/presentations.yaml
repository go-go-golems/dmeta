schema_version: 0
artifact_type: dmeta_widget_templates
category: presentations
summary: DMETA presentations widget templates.
long_summary: Templates in this file are selectable/adaptable presentations starting points for concrete DMETA instances.
templates:
- id: dmeta.presentation_token
  name: PresentationToken
  status: template
  classification:
    level: atom
    role: semantic_presentation
  intent:
    purpose: Render a single presentation ref as inline selectable text/token/chip.
    adapter_boundary: Receives typed PresentationRef; does not parse runtime JSON.
  consumes:
    presentations:
    - compact_id
    - display_label
    - status_badge
    - timestamp_inline
    - compact_ref
    - inline_token
  contract:
    props:
      PresentationTokenProps:
        fields:
          subject:
            type: PresentationRef
            required: true
          variant:
            type: PresentationId
            required: true
          selected:
            type: boolean
            required: false
          candidate:
            type: boolean
            required: false
    action_slots:
      onOpenContextMenu:
        accepts: PresentationRef
      onSelectPresentation:
        accepts: PresentationRef
  stories:
  - default
  - selected
  - action_candidate
  - with_status
  outputs:
    component: src/dmeta/widgets/PresentationToken/PresentationToken.tsx
    types: src/dmeta/widgets/PresentationToken/PresentationToken.types.ts
    metadata: src/dmeta/widgets/PresentationToken/PresentationToken.metadata.ts
    stories: src/dmeta/widgets/PresentationToken/PresentationToken.stories.tsx
    barrel: src/dmeta/widgets/PresentationToken/index.ts
  template:
    category: presentations
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need PresentationToken as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
- id: dmeta.status_badge
  name: StatusBadge
  status: template
  classification:
    level: atom
    role: state_presentation
  intent:
    purpose: Render the stateful capability as a compact semantic badge.
    adapter_boundary: Receives normalized state presentation data and emits typed presentation callbacks.
  consumes:
    presentations:
    - status_badge
    - state_cell
    capabilities:
    - stateful
  contract:
    props:
      StatusBadgeProps:
        fields:
          subject:
            type: PresentationRef
            required: true
          state:
            type: string
            required: true
          tone:
            type: SemanticTone
            required: false
    action_slots:
      onOpenContextMenu:
        accepts: PresentationRef
  stories:
  - neutral
  - success
  - warning
  - danger
  - pending
  - selected
  outputs:
    component: src/dmeta/widgets/StatusBadge/StatusBadge.tsx
    types: src/dmeta/widgets/StatusBadge/StatusBadge.types.ts
    metadata: src/dmeta/widgets/StatusBadge/StatusBadge.metadata.ts
    stories: src/dmeta/widgets/StatusBadge/StatusBadge.stories.tsx
    barrel: src/dmeta/widgets/StatusBadge/index.ts
  template:
    category: presentations
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need StatusBadge as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
  semantic_context:
    capabilities:
    - stateful
    presentations:
    - status_badge
    - state_cell
    intent: Render stateful semantic state as a compact visual token. The inherited stateful projection contract is useful
      scaffold guidance, but concrete widgets still decide tone, label, and density.
    inherited_context_note: Any descendant capability of stateful can satisfy this context through capability inheritance.
  projection_hints:
    recommended:
    - stateful.state
    optional:
    - stateful.state_label
    - stateful.state_tone
    adapter_todos:
    - Decide whether the concrete variant receives a precomputed tone or derives tone from state.
  generation:
    scaffold_mode: adapter_todos
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: true
    strict_projection_adapter: false
- id: dmeta.compact_reference
  name: CompactReference
  status: template
  classification:
    level: atom
    role: reference_presentation
  intent:
    purpose: Render compact references for identifiable/labelable semantic objects.
    adapter_boundary: Receives PresentationRef and optional resolved label/state data.
  consumes:
    presentations:
    - compact_id
    - compact_ref
    - relation_link
    capabilities:
    - identifiable
    - labelable
    - relatable
  contract:
    props:
      CompactReferenceProps:
        fields:
          subject:
            type: PresentationRef
            required: true
          showState:
            type: boolean
            required: false
          truncate:
            type: boolean
            required: false
    action_slots:
      onCopy:
        accepts: PresentationRef
      onInspect:
        accepts: PresentationRef
      onOpenContextMenu:
        accepts: PresentationRef
  stories:
  - id_only
  - label_and_id
  - with_state
  - truncated
  - selected
  outputs:
    component: src/dmeta/widgets/CompactReference/CompactReference.tsx
    types: src/dmeta/widgets/CompactReference/CompactReference.types.ts
    metadata: src/dmeta/widgets/CompactReference/CompactReference.metadata.ts
    stories: src/dmeta/widgets/CompactReference/CompactReference.stories.tsx
    barrel: src/dmeta/widgets/CompactReference/index.ts
  template:
    category: presentations
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need CompactReference as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
  semantic_context:
    capabilities:
    - identifiable
    - labelable
    presentations:
    - compact_id
    - compact_ref
    - relation_link
    intent: Render a compact reference for a semantic subject. Identifier and label projections are strong hints, but the
      final reference surface may choose only label, id, or both.
  projection_hints:
    recommended:
    - identifiable.id
    - labelable.label
    optional:
    - labelable.subtitle
    adapter_todos:
    - Choose whether this instance renders ids visibly or only uses them for copy/actions.
  generation:
    scaffold_mode: reflective
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: false
    strict_projection_adapter: false
- id: dmeta.metric_cell
  name: MetricCell
  status: template
  classification:
    level: atom
    role: metric_presentation
  intent:
    purpose: Render comparable numeric values with units and tabular alignment.
    adapter_boundary: Receives normalized metric value and optional PresentationRef.
  consumes:
    presentations:
    - metric_cell
    - duration_cell
    capabilities:
    - measurable
    - temporal
  contract:
    props:
      MetricCellProps:
        fields:
          subject:
            type: PresentationRef
            required: false
          value:
            type: number
            required: true
          unit:
            type: string
            required: false
          align:
            type: '"left" | "right"'
            required: false
    action_slots:
      onCompare:
        accepts: PresentationRef
      onCopy:
        accepts: PresentationRef
  stories:
  - number
  - duration
  - unit
  - selected
  - comparison_candidate
  outputs:
    component: src/dmeta/widgets/MetricCell/MetricCell.tsx
    types: src/dmeta/widgets/MetricCell/MetricCell.types.ts
    metadata: src/dmeta/widgets/MetricCell/MetricCell.metadata.ts
    stories: src/dmeta/widgets/MetricCell/MetricCell.stories.tsx
    barrel: src/dmeta/widgets/MetricCell/index.ts
  template:
    category: presentations
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need MetricCell as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
