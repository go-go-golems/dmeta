schema_version: 0
artifact_type: dmeta_widget_templates
category: states
summary: Empty/loading/error/connection state templates.
long_summary: Templates in this file are selectable/adaptable states starting points for concrete DMETA instances. They are
  not mandatory baseline widgets; instance manifests select, rename, specialize, or exclude them.
templates:
- id: dmeta.empty_state
  name: EmptyState
  status: template
  classification:
    level: atom
    role: empty_state
  intent:
    purpose: Render a quiet empty/no-results state with optional recovery action.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: states
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
    - component_name
    - props
    - stories
    - presentation_mapping
    - action_slots
    - density
    - empty_state
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes: {}
  contract:
    props:
      EmptyStateProps:
        fields:
          title:
            type: string
            required: true
          description:
            type: string
            required: false
    action_slots:
      onAction:
        accepts: PresentationActionRequest
  stories:
  - no_data
  - no_filtered_results
  - no_permission
  outputs:
    component: src/dmeta/widgets/EmptyState/EmptyState.tsx
    types: src/dmeta/widgets/EmptyState/EmptyState.types.ts
    metadata: src/dmeta/widgets/EmptyState/EmptyState.metadata.ts
    stories: src/dmeta/widgets/EmptyState/EmptyState.stories.tsx
    barrel: src/dmeta/widgets/EmptyState/index.ts
