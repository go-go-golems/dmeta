- id: dmeta.disconnected_state
  name: DisconnectedState
  status: template
  classification:
    level: molecule
    role: connection_state
  intent:
    purpose: Render disconnected/reconnecting/stale realtime data state.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: states
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
    - component_name
    - props
    - stories
    - presentation_mapping
    - action_slots
    - density
    - empty_state
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes: {}
  contract:
    props:
      DisconnectedStateProps:
        fields:
          status:
            type: '"connected" | "reconnecting" | "disconnected"'
            required: true
    action_slots:
      onReconnect:
        accepts: void
  stories:
  - connected
  - reconnecting
  - disconnected
  outputs:
    component: src/dmeta/widgets/DisconnectedState/DisconnectedState.tsx
    types: src/dmeta/widgets/DisconnectedState/DisconnectedState.types.ts
    metadata: src/dmeta/widgets/DisconnectedState/DisconnectedState.metadata.ts
    stories: src/dmeta/widgets/DisconnectedState/DisconnectedState.stories.tsx
    barrel: src/dmeta/widgets/DisconnectedState/index.ts
- id: dmeta.stale_data_indicator
  name: StaleDataIndicator
  status: template
  classification:
    level: atom
    role: freshness_indicator
  intent:
    purpose: Render last-updated/freshness warning for dashboards and live result surfaces.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: states
    selection: optional
