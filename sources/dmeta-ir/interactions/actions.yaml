schema_version: 0
artifact_type: dmeta_interaction_actions
summary: Shared modality-neutral DMETA action catalog.
long_summary: >-
  Actions describe operations over semantic subjects before any target design
  system chooses callbacks, commands, gestures, routes, or voice intents. This
  shared catalog intentionally contains only generic actions. Domain/application
  actions should live in an inherited interaction package, such as the Street
  Deli example interaction package.
actions:
  Action:
    abstract: true
    extends: []
    intent: Root interaction action. It is never emitted directly.
    description: Root interaction action class.
    subjects: []
    inputs: {}
    effects:
      scope: none
      mutates_backend: false
    result:
      kind: none
  inspect_subject:
    extends: [Action]
    intent: Expose additional detail about a semantic subject without mutating it.
    description: Open or otherwise present detail for a selected semantic subject.
    subjects:
      - any_capabilities: [inspectable]
    inputs:
      subject_ref:
        type: SemanticRef
        required: true
        description: Subject to inspect.
    effects:
      scope: navigation_or_local_view
      mutates_backend: false
    result:
      kind: inspection_surface
  copy_reference:
    extends: [Action]
    intent: Copy or expose a stable reference for an identifiable subject.
    description: Copy a stable id or reference label.
    subjects:
      - all_capabilities: [identifiable]
    inputs:
      subject_ref:
        type: SemanticRef
        required: true
    effects:
      scope: client_clipboard
      mutates_backend: false
    result:
      kind: copied_reference
  select_subject:
    extends: [Action]
    intent: Select a semantic subject as the active item in the current interaction context.
    description: Generic non-mutating selection action.
    subjects:
      - any_capabilities: [identifiable]
    inputs:
      subject_ref:
        type: SemanticRef
        required: true
    effects:
      scope: local_selection
      mutates_backend: false
    result:
      kind: selected_subject
  filter_by_state:
    extends: [Action]
    intent: Constrain a result set or view by a state value.
    description: Apply a state filter from a stateful subject or state representation.
    subjects:
      - all_capabilities: [stateful]
    inputs:
      state:
        type: string
        required: true
    effects:
      scope: query_or_local_filter
      mutates_backend: false
    result:
      kind: filter_applied
