schema_version: 0
artifact_type: dmeta_interaction_elaboration_rules
summary: Shared generic rule set for deriving modality-neutral interaction obligations from resolved semantic facts.
rules:
  - id: identifiable_labelable_to_compact_reference
    when:
      all_capabilities: [identifiable, labelable]
    emits:
      representations: [compact_reference]
      actions: [copy_reference]
  - id: inspectable_to_inspection
    when:
      all_capabilities: [inspectable]
    emits:
      representations: [inspection_entrypoint]
      actions: [inspect_subject]
  - id: stateful_to_state_indicator
    when:
      all_capabilities: [stateful]
    emits:
      representations: [state_indicator]
      actions: [filter_by_state]
