schema_version: 0
artifact_type: dmeta_web_widget_templates
category: layout
summary: Shell, page, panel, toolbar, split-pane, and tab templates.
long_summary: Templates in this file are selectable/adaptable layout starting points for concrete DMETA instances. They are
  not mandatory baseline widgets; instance manifests select, rename, specialize, or exclude them.
templates:
- id: dmeta.workbench_shell
  name: WorkbenchShell
  status: template
  component:
    level: organism
    specificity: generic
    role: workspace_frame
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render a global workbench frame with navigation, workspace status, command/search affordances, and main content
      slots.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: layout
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      navigation_model:
        type: any
        required: false
        description: Instance-specific adaptation for navigation model.
      global_actions:
        type: any
        required: false
        description: Instance-specific adaptation for global actions.
      responsive_behavior:
        type: any
        required: false
        description: Instance-specific adaptation for responsive behavior.
    common_variants:
    - sidebar
    - topbar
    - single_panel
    avoid_when:
    - The instance is a single embedded widget or one fixed dashboard without app chrome.
  consumes: {}
  contract:
    props:
      WorkbenchShellProps:
        fields:
          navigation:
            type: NavigationItem[]
            required: false
          children:
            type: ReactNode
            required: true
  stories:
  - single_workspace
  - with_sidebar
  - with_topbar
  outputs:
    component: src/dmeta/widgets/WorkbenchShell/WorkbenchShell.tsx
    types: src/dmeta/widgets/WorkbenchShell/WorkbenchShell.types.ts
    metadata: src/dmeta/widgets/WorkbenchShell/WorkbenchShell.metadata.ts
    stories: src/dmeta/widgets/WorkbenchShell/WorkbenchShell.stories.tsx
    barrel: src/dmeta/widgets/WorkbenchShell/index.ts
- id: dmeta.page_header
  name: PageHeader
  status: template
  component:
    level: molecule
    specificity: generic
    role: page_identity
    generation_policy: scaffold_once
  intent:
    purpose: Render page title, subtitle, breadcrumbs/context refs, primary actions, and status summary.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: layout
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes:
    presentations:
    - compact_ref
    - status_badge
  contract:
    props:
      PageHeaderProps:
        fields:
          title:
            type: string
            required: true
          subtitle:
            type: string
            required: false
          actions:
            type: ActionDefinition[]
            required: false
    action_slots:
      onAction:
        accepts: PresentationActionRequest
  stories:
  - with_actions
  - with_context_ref
  - minimal
  outputs:
    component: src/dmeta/widgets/PageHeader/PageHeader.tsx
    types: src/dmeta/widgets/PageHeader/PageHeader.types.ts
    metadata: src/dmeta/widgets/PageHeader/PageHeader.metadata.ts
    stories: src/dmeta/widgets/PageHeader/PageHeader.stories.tsx
    barrel: src/dmeta/widgets/PageHeader/index.ts
