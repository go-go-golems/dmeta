- id: dmeta.split_pane
  name: SplitPane
  status: template
  component:
    level: organism
    specificity: generic
    role: master_detail_layout
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render a resizable or fixed split between primary context and secondary detail/inspector content.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: layout
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      collapse_behavior:
        type: any
        required: false
        description: Instance-specific adaptation for collapse behavior.
      initial_ratio:
        type: any
        required: false
        description: Instance-specific adaptation for initial ratio.
      responsive_stacking:
        type: any
        required: false
        description: Instance-specific adaptation for responsive stacking.
    common_variants:
    - fixed
    - resizable
    - collapsible
    avoid_when:
    - The instance does not need simultaneous context and inspection.
  consumes: {}
  contract:
    props:
      SplitPaneProps:
        fields:
          primary:
            type: ReactNode
            required: true
          secondary:
            type: ReactNode
            required: true
          orientation:
            type: '"horizontal" | "vertical"'
            required: false
  stories:
  - master_detail
  - collapsed_secondary
  - vertical
  outputs:
    component: src/dmeta/widgets/SplitPane/SplitPane.tsx
    types: src/dmeta/widgets/SplitPane/SplitPane.types.ts
    metadata: src/dmeta/widgets/SplitPane/SplitPane.metadata.ts
    stories: src/dmeta/widgets/SplitPane/SplitPane.stories.tsx
    barrel: src/dmeta/widgets/SplitPane/index.ts
- id: dmeta.tabs
  name: Tabs
  status: template
  component:
    level: molecule
    specificity: generic
    role: view_switcher
    generation_policy: scaffold_once
  intent:
    purpose: Render tabbed navigation among sibling views or detail sections.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: layout
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      tab_model:
        type: any
        required: false
        description: Instance-specific adaptation for tab model.
      routing:
        type: any
        required: false
        description: Instance-specific adaptation for routing.
      keyboard_behavior:
        type: any
        required: false
        description: Instance-specific adaptation for keyboard behavior.
    common_variants:
    - line_tabs
    - segmented
    - dense
    avoid_when:
    - The information architecture is a single fixed view or uses routes instead of tabs.
  consumes: {}
  contract:
    props:
      TabsProps:
        fields:
          tabs:
            type: TabItem[]
            required: true
          activeId:
            type: string
            required: true
    action_slots:
      onChangeTab:
        accepts: string
  stories:
  - two_tabs
  - many_tabs
  - keyboard_navigation
  outputs:
    component: src/dmeta/widgets/Tabs/Tabs.tsx
    types: src/dmeta/widgets/Tabs/Tabs.types.ts
    metadata: src/dmeta/widgets/Tabs/Tabs.metadata.ts
    stories: src/dmeta/widgets/Tabs/Tabs.stories.tsx
    barrel: src/dmeta/widgets/Tabs/index.ts
