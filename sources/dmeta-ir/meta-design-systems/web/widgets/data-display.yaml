schema_version: 0
artifact_type: dmeta_web_widget_templates
category: data-display
summary: Optional property, comparison, markdown, and preview templates.
long_summary: Templates in this file are selectable/adaptable data-display starting points for concrete DMETA instances. They
  are not mandatory baseline widgets; instance manifests select, rename, specialize, or exclude them.
templates:
- id: dmeta.key_value_list
  name: KeyValueList
  status: template
  component:
    level: molecule
    specificity: generic
    role: property_inspector
    generation_policy: scaffold_once
  intent:
    purpose: Render compact key-value properties, optionally using representation-aware value renderers.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: data-display
    selection: rare
    maturity: draft
    default_importance: optional
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      value_renderers:
        type: any
        required: false
        description: Instance-specific adaptation for value renderers.
      grouping:
        type: any
        required: false
        description: Instance-specific adaptation for grouping.
      copy_behavior:
        type: any
        required: false
        description: Instance-specific adaptation for copy behavior.
    common_variants:
    - plain
    - grouped
    - copyable
    avoid_when:
    - The instance has no generic inspector/detail properties.
  consumes:
    representations:
    - compact_ref
    - status_badge
    - metric_cell
    - relation_link
  contract:
    props:
      KeyValueListProps:
        fields:
          items:
            type: KeyValueItem[]
            required: true
          density:
            type: DensityMode
            required: false
    action_slots:
      onSelectValue:
        accepts: RepresentationRef
  stories:
  - basic
  - semantic_values
  - copyable
  outputs:
    component: src/dmeta/widgets/KeyValueList/KeyValueList.tsx
    types: src/dmeta/widgets/KeyValueList/KeyValueList.types.ts
    metadata: src/dmeta/widgets/KeyValueList/KeyValueList.metadata.ts
    stories: src/dmeta/widgets/KeyValueList/KeyValueList.stories.tsx
    barrel: src/dmeta/widgets/KeyValueList/index.ts
- id: dmeta.comparison_table
  name: ComparisonTable
  status: template
  component:
    level: organism
    specificity: generic
    role: comparison_table
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render side-by-side comparison of metrics, candidates, versions, or before/after records.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: data-display
    selection: rare
    maturity: draft
    default_importance: optional
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      comparison_axis:
        type: any
        required: false
        description: Instance-specific adaptation for comparison axis.
      highlight_rules:
        type: any
        required: false
        description: Instance-specific adaptation for highlight rules.
      unit_compatibility:
        type: any
        required: false
        description: Instance-specific adaptation for unit compatibility.
    common_variants:
    - metric_comparison
    - candidate_comparison
    - before_after
    avoid_when:
    - Comparison is not a primary user workflow.
  consumes:
    archetypes:
    - Metric
    - Resource
    - WorkItem
    capabilities:
    - measurable
    representations:
    - metric_cell
    - duration_cell
    - compact_ref
  contract:
    props:
      ComparisonTableProps:
        fields:
          columns:
            type: ComparisonColumn[]
            required: true
          rows:
            type: ComparisonRow[]
            required: true
    action_slots:
      onSelectCell:
        accepts: RepresentationRef
  stories:
  - metrics
  - candidates
  - before_after
  outputs:
    component: src/dmeta/widgets/ComparisonTable/ComparisonTable.tsx
    types: src/dmeta/widgets/ComparisonTable/ComparisonTable.types.ts
    metadata: src/dmeta/widgets/ComparisonTable/ComparisonTable.metadata.ts
    stories: src/dmeta/widgets/ComparisonTable/ComparisonTable.stories.tsx
    barrel: src/dmeta/widgets/ComparisonTable/index.ts
- id: dmeta.markdown_block
  name: MarkdownBlock
  status: template
  component:
    level: molecule
    specificity: generic
    role: markdown_content
    generation_policy: scaffold_once
  intent:
    purpose: Render sanitized markdown documentation, runbooks, notes, or tool output.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: data-display
    selection: optional
    maturity: draft
    default_importance: optional
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      sanitization:
        type: any
        required: false
        description: Instance-specific adaptation for sanitization.
      allowed_elements:
        type: any
        required: false
        description: Instance-specific adaptation for allowed elements.
      code_highlighting:
        type: any
        required: false
        description: Instance-specific adaptation for code highlighting.
    common_variants:
    - read_only
    - collapsible
    avoid_when:
    - The instance does not render rich text or untrusted markdown.
  consumes: {}
  contract:
    props:
      MarkdownBlockProps:
        fields:
          markdown:
            type: string
            required: true
    action_slots:
      onOpenLink:
        accepts: string
  stories:
  - basic
  - code_blocks
  - empty
  outputs:
    component: src/dmeta/widgets/MarkdownBlock/MarkdownBlock.tsx
    types: src/dmeta/widgets/MarkdownBlock/MarkdownBlock.types.ts
    metadata: src/dmeta/widgets/MarkdownBlock/MarkdownBlock.metadata.ts
    stories: src/dmeta/widgets/MarkdownBlock/MarkdownBlock.stories.tsx
    barrel: src/dmeta/widgets/MarkdownBlock/index.ts
- id: dmeta.preview_frame
  name: PreviewFrame
  status: template
  component:
    level: organism
    specificity: generic
    role: artifact_preview
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render a preview of an artifact such as a document, image, OCR page, web output, or generated report.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: data-display
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      sandboxing:
        type: any
        required: false
        description: Instance-specific adaptation for sandboxing.
      preview_kind:
        type: any
        required: false
        description: Instance-specific adaptation for preview kind.
      fallback_behavior:
        type: any
        required: false
        description: Instance-specific adaptation for fallback behavior.
    common_variants:
    - image
    - document
    - html
    - text
    avoid_when:
    - The instance has no previewable artifacts.
  consumes:
    archetypes:
    - Resource
    capabilities:
    - inspectable
  contract:
    props:
      PreviewFrameProps:
        fields:
          resource:
            type: RepresentationRef
            required: true
          preview:
            type: PreviewViewModel
            required: true
    action_slots:
      onOpenPreview:
        accepts: RepresentationRef
  stories:
  - image
  - document
  - html
  - unavailable
  outputs:
    component: src/dmeta/widgets/PreviewFrame/PreviewFrame.tsx
    types: src/dmeta/widgets/PreviewFrame/PreviewFrame.types.ts
    metadata: src/dmeta/widgets/PreviewFrame/PreviewFrame.metadata.ts
    stories: src/dmeta/widgets/PreviewFrame/PreviewFrame.stories.tsx
    barrel: src/dmeta/widgets/PreviewFrame/index.ts
