schema_version: 0
artifact_type: dmeta_web_widget_templates
category: actions
summary: DMETA actions Web widget templates.
long_summary: Templates in this file are selectable/adaptable actions starting points for concrete DMETA instances.
templates:
- id: dmeta.action_palette
  name: ActionPalette
  status: template
  component:
    level: organism
    specificity: generic
    role: typed_action_discovery
    generation_policy: scaffold_then_promote
  intent:
    purpose: Discover actions globally or for a selected PresentationRef and collect typed arguments.
    adapter_boundary: Receives generated action metadata, current selection, and candidate presentations.
  consumes:
    presentations:
    - compact_ref
    - inline_token
    - status_badge
    - metric_cell
  contract:
    props:
      ActionPaletteProps:
        fields:
          open:
            type: boolean
            required: true
          source:
            type: PresentationRef
            required: false
          actions:
            type: ActionDefinition[]
            required: true
          candidates:
            type: PresentationRef[]
            required: false
    action_slots:
      onChooseAction:
        accepts: ActionDefinition
      onChooseArgument:
        accepts: PresentationRef
      onExecute:
        accepts: PresentationActionRequest
  stories:
  - global
  - source_context
  - awaiting_argument
  - candidates
  - empty
  outputs:
    component: src/dmeta/widgets/ActionPalette/ActionPalette.tsx
    types: src/dmeta/widgets/ActionPalette/ActionPalette.types.ts
    metadata: src/dmeta/widgets/ActionPalette/ActionPalette.metadata.ts
    stories: src/dmeta/widgets/ActionPalette/ActionPalette.stories.tsx
    barrel: src/dmeta/widgets/ActionPalette/index.ts
  template:
    category: actions
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need ActionPalette as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
- id: dmeta.action_button
  name: ActionButton
  status: template
  component:
    level: atom
    specificity: generic
    role: action_control
    generation_policy: scaffold_once
  intent:
    purpose: Render one action with semantic tone, loading/disabled state, and adapter-boundary callback.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: actions
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes:
    capabilities:
    - actionable
  contract:
    props:
      ActionButtonProps:
        description: Top-level React props for a generic semantic action button.
        source: interaction_ir
        source_ref: actions
        fields:
          action:
            type_ref: ActionDefinition
            source: interaction_ir
            source_ref: actions.*
            required: true
            description: Normalized action definition selected by the adapter before rendering.
          tone:
            type_ref: SemanticTone
            source: design_language
            source_ref: presentation_recipes
            required: false
            description: Visual tone derived from semantic action category and design-language rules.
    action_slots:
      onExecute:
        accepts: PresentationActionRequest
        payload_type: PresentationActionRequest
        source: interaction_ir
        description: Callback boundary for executing the selected semantic action.
  stories:
  - primary
  - secondary
  - danger
  - loading
  outputs:
    component: src/dmeta/widgets/ActionButton/ActionButton.tsx
    types: src/dmeta/widgets/ActionButton/ActionButton.types.ts
    metadata: src/dmeta/widgets/ActionButton/ActionButton.metadata.ts
    stories: src/dmeta/widgets/ActionButton/ActionButton.stories.tsx
    barrel: src/dmeta/widgets/ActionButton/index.ts
- id: dmeta.action_group
  name: ActionGroup
  status: template
  component:
    level: molecule
    specificity: generic
    role: grouped_action_controls
    generation_policy: scaffold_once
  composition:
    uses:
    - template: dmeta.action_button
      role: action item renderer
      required: true
      description: Use dmeta.action_button as the action item renderer dependency for this component.
    provides:
    - grouped action layout
  intent:
    purpose: Render a group of primary/secondary actions for a selected subject, panel, page, or bulk selection.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: actions
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes:
    capabilities:
    - actionable
  contract:
    props:
      ActionGroupProps:
        fields:
          actions:
            type: ActionDefinition[]
            required: true
          subject:
            type: PresentationRef
            required: false
    action_slots:
      onExecute:
        accepts: PresentationActionRequest
  stories:
  - row_actions
  - panel_actions
  - bulk_actions
  outputs:
    component: src/dmeta/widgets/ActionGroup/ActionGroup.tsx
    types: src/dmeta/widgets/ActionGroup/ActionGroup.types.ts
    metadata: src/dmeta/widgets/ActionGroup/ActionGroup.metadata.ts
    stories: src/dmeta/widgets/ActionGroup/ActionGroup.stories.tsx
    barrel: src/dmeta/widgets/ActionGroup/index.ts
