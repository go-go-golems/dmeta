schema_version: 0
artifact_type: dmeta_web_widget_templates
category: dashboards
summary: Dashboard-first template options for single-screen and operational overview instances.
long_summary: Templates in this file are selectable/adaptable dashboards starting points for concrete DMETA instances. They
  are not mandatory baseline widgets; instance manifests select, rename, specialize, or exclude them.
templates:
- id: dmeta.operational_dashboard
  name: OperationalDashboard
  status: template
  component:
    level: organism
    specificity: generic
    role: dashboard_frame
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render a fixed or responsive dashboard composed of named operational regions.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: dashboards
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      region_layout:
        type: any
        required: false
        description: Instance-specific adaptation for region layout.
      refresh_policy:
        type: any
        required: false
        description: Instance-specific adaptation for refresh policy.
      alert_priority:
        type: any
        required: false
        description: Instance-specific adaptation for alert priority.
    common_variants:
    - single_screen
    - responsive_grid
    - wallboard
    avoid_when:
    - The instance is primarily table/stream/detail workflow rather than dashboard-first.
  consumes:
    archetypes:
    - ResultSet
    - Metric
    - WorkItem
    capabilities:
    - aggregatable
    - stateful
    - measurable
  contract:
    props:
      OperationalDashboardProps:
        fields:
          regions:
            type: DashboardRegionViewModel[]
            required: true
          density:
            type: DensityMode
            required: false
  stories:
  - wallboard
  - operator_dashboard
  - single_screen
  outputs:
    component: src/dmeta/widgets/OperationalDashboard/OperationalDashboard.tsx
    types: src/dmeta/widgets/OperationalDashboard/OperationalDashboard.types.ts
    metadata: src/dmeta/widgets/OperationalDashboard/OperationalDashboard.metadata.ts
    stories: src/dmeta/widgets/OperationalDashboard/OperationalDashboard.stories.tsx
    barrel: src/dmeta/widgets/OperationalDashboard/index.ts
- id: dmeta.dashboard_region
  name: DashboardRegion
  status: template
  component:
    level: molecule
    specificity: generic
    role: dashboard_region
    generation_policy: scaffold_once
  intent:
    purpose: Render one named dashboard region with title, status, content, and optional action hooks.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: dashboards
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected representations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      representation_mapping:
        type: any
        required: false
        description: Mapping from Interaction representations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes: {}
  contract:
    props:
      DashboardRegionProps:
        fields:
          title:
            type: string
            required: true
          children:
            type: ReactNode
            required: true
          status:
            type: RepresentationRef
            required: false
    action_slots:
      onRegionAction:
        accepts: PresentationActionRequest
  stories:
  - metric_region
  - queue_region
  - event_region
  outputs:
    component: src/dmeta/widgets/DashboardRegion/DashboardRegion.tsx
    types: src/dmeta/widgets/DashboardRegion/DashboardRegion.types.ts
    metadata: src/dmeta/widgets/DashboardRegion/DashboardRegion.metadata.ts
    stories: src/dmeta/widgets/DashboardRegion/DashboardRegion.stories.tsx
    barrel: src/dmeta/widgets/DashboardRegion/index.ts
