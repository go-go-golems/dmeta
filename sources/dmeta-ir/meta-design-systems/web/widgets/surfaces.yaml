schema_version: 0
artifact_type: dmeta_web_widget_templates
category: surfaces
summary: DMETA surfaces Web widget templates.
long_summary: Templates in this file are selectable/adaptable surfaces starting points for concrete DMETA instances.
templates:
- id: dmeta.detail_drawer
  name: DetailDrawer
  status: template
  component:
    level: organism
    specificity: generic
    role: semantic_detail_surface
    generation_policy: scaffold_then_promote
  intent:
    purpose: Inspect selected semantic subject while preserving list/table context.
    adapter_boundary: Receives normalized detail sections, related presentations, and action callbacks.
  consumes:
    presentations:
    - detail_panel
    - compact_ref
    - relation_link
    - status_badge
    - metric_cell
    capabilities:
    - inspectable
    - relatable
  contract:
    props:
      DetailDrawerProps:
        fields:
          subject:
            type: PresentationRef
            required: true
          sections:
            type: DetailSection[]
            required: true
          open:
            type: boolean
            required: true
    action_slots:
      onClose:
        accepts: void
      onAction:
        accepts: PresentationActionRequest
      onOpenRelated:
        accepts: PresentationRef
  stories:
  - tool_run_detail
  - shipment_detail
  - related_objects
  - collapsed_payloads
  outputs:
    component: src/dmeta/widgets/DetailDrawer/DetailDrawer.tsx
    types: src/dmeta/widgets/DetailDrawer/DetailDrawer.types.ts
    metadata: src/dmeta/widgets/DetailDrawer/DetailDrawer.metadata.ts
    stories: src/dmeta/widgets/DetailDrawer/DetailDrawer.stories.tsx
    barrel: src/dmeta/widgets/DetailDrawer/index.ts
  template:
    category: surfaces
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need DetailDrawer as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
