schema_version: 0
artifact_type: dmeta_widget_template_index
summary: Split widget template catalog for DMETA v0. Templates are selectable/adaptable starting points, not mandatory generated
  widgets.
long_summary: This package contains reusable Web widget templates that concrete DMETA instances can select, rename, specialize,
  and promote. The catalog is intentionally broader than any one application. Instance manifests decide which templates become
  generated widgets.
files:
  representations: ./representation-primitives.yaml
  streams: ./streams.yaml
  tables: ./tables.yaml
  surfaces: ./surfaces.yaml
  actions: ./actions.yaml
  filters: ./filters.yaml
  layout: ./layout.yaml
  dashboards: ./dashboards.yaml
  forms: ./forms.yaml
  states: ./states.yaml
  data_display: ./data-display.yaml
validation:
  require_unique_template_ids: true
  require_known_representations: true
  require_known_archetypes: true
  require_known_capabilities: true
  require_selection_guidance: true
authoring_guidance:
  semantic_context_policy: Web widget templates may reference archetypes, capabilities, and representations as reflection context
    for generated metadata, doc comments, README text, Storybook docs, and adapter TODOs. These references do not automatically
    force one rigid prop shape or layout.
  projection_generation_policy: Use projection_hints to distinguish required, recommended, optional, documentation-only, and
    adapter TODO guidance. Strict projection adapter generation must be opt-in.
  default_generation_policy:
    scaffold_mode: reflective
    emit_semantic_metadata: true
    emit_doc_comments: true
    emit_adapter_todos: false
    strict_projection_adapter: false
