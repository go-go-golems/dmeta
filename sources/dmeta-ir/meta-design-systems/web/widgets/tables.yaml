schema_version: 0
artifact_type: dmeta_web_widget_templates
category: tables
summary: DMETA tables Web widget templates.
long_summary: Templates in this file are selectable/adaptable tables starting points for concrete DMETA instances.
templates:
- id: dmeta.dense_table
  name: DenseTable
  status: template
  component:
    level: organism
    specificity: generic
    role: dense_table
    generation_policy: scaffold_then_promote
  intent:
    purpose: Render sortable/filterable dense records with presentation-aware cells.
    adapter_boundary: Receives normalized columns/rows and emits typed row/cell callbacks.
  consumes:
    archetypes:
    - WorkItem
    - Resource
    - Actor
    - Metric
    presentations:
    - dense_row
    - compact_ref
    - status_badge
    - state_cell
    - metric_cell
    - timestamp_inline
  contract:
    props:
      DenseTableProps:
        fields:
          columns:
            type: DenseTableColumn[]
            required: true
          rows:
            type: DenseTableRow[]
            required: true
          density:
            type: DensityMode
            required: false
    action_slots:
      onCellAction:
        accepts: PresentationRef
      onRowAction:
        accepts: PresentationRef
      onSort:
        accepts: DenseTableSort
  stories:
  - work_items
  - shipments
  - metrics
  - selected_rows
  - filtered_state
  outputs:
    component: src/dmeta/widgets/DenseTable/DenseTable.tsx
    types: src/dmeta/widgets/DenseTable/DenseTable.types.ts
    metadata: src/dmeta/widgets/DenseTable/DenseTable.metadata.ts
    stories: src/dmeta/widgets/DenseTable/DenseTable.stories.tsx
    barrel: src/dmeta/widgets/DenseTable/index.ts
  template:
    category: tables
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this instance need DenseTable as a concrete component or can another selected template cover the same role?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
    common_variants:
    - default
    avoid_when:
    - The concrete instance has no workflow matching this template role.
- id: dmeta.presentation_cell
  name: PresentationCell
  status: template
  component:
    level: atom
    specificity: generic
    role: presentation_table_cell
    generation_policy: scaffold_once
  intent:
    purpose: Render one table cell by delegating to presentation-aware value renderers.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: tables
    selection: common
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes:
    presentations:
    - compact_ref
    - status_badge
    - state_cell
    - metric_cell
    - timestamp_inline
    - relation_link
  contract:
    props:
      PresentationCellProps:
        fields:
          cell:
            type: PresentationCellViewModel
            required: true
    action_slots:
      onCellAction:
        accepts: PresentationRef
  stories:
  - compact_ref
  - status
  - metric
  - relation
  outputs:
    component: src/dmeta/widgets/PresentationCell/PresentationCell.tsx
    types: src/dmeta/widgets/PresentationCell/PresentationCell.types.ts
    metadata: src/dmeta/widgets/PresentationCell/PresentationCell.metadata.ts
    stories: src/dmeta/widgets/PresentationCell/PresentationCell.stories.tsx
    barrel: src/dmeta/widgets/PresentationCell/index.ts
- id: dmeta.bulk_action_bar
  name: BulkActionBar
  status: template
  component:
    level: molecule
    specificity: generic
    role: bulk_action_bar
    generation_policy: scaffold_once
  intent:
    purpose: Render actions for selected rows/presentations with count, scope, and confirmation affordances.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: tables
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes:
    capabilities:
    - actionable
    presentations:
    - compact_ref
  contract:
    props:
      BulkActionBarProps:
        fields:
          selected:
            type: PresentationRef[]
            required: true
          actions:
            type: ActionDefinition[]
            required: true
    action_slots:
      onExecuteBulk:
        accepts: PresentationActionRequest
      onClearSelection:
        accepts: void
  stories:
  - no_selection
  - some_selected
  - danger_action
  outputs:
    component: src/dmeta/widgets/BulkActionBar/BulkActionBar.tsx
    types: src/dmeta/widgets/BulkActionBar/BulkActionBar.types.ts
    metadata: src/dmeta/widgets/BulkActionBar/BulkActionBar.metadata.ts
    stories: src/dmeta/widgets/BulkActionBar/BulkActionBar.stories.tsx
    barrel: src/dmeta/widgets/BulkActionBar/index.ts
