schema_version: 0
artifact_type: dmeta_web_widget_templates
category: forms
summary: Action parameter and basic field templates.
long_summary: Templates in this file are selectable/adaptable forms starting points for concrete DMETA instances. They are
  not mandatory baseline widgets; instance manifests select, rename, specialize, or exclude them.
templates:
- id: dmeta.action_parameter_form
  name: ActionParameterForm
  status: template
  classification:
    level: organism
    role: action_argument_form
  intent:
    purpose: Render typed action parameters, confirmation text, and submit/cancel controls for selected actions.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: forms
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      field_set:
        type: any
        required: false
        description: Instance-specific adaptation for field set.
      validation:
        type: any
        required: false
        description: Instance-specific adaptation for validation.
      confirmation_copy:
        type: any
        required: false
        description: Instance-specific adaptation for confirmation copy.
    common_variants:
    - inline
    - dialog
    - drawer
    avoid_when:
    - The selected instance exposes no parameterized or side-effecting actions.
  consumes:
    archetypes:
    - ActionSpec
    capabilities:
    - parameterized
    - actionable
  contract:
    props:
      ActionParameterFormProps:
        fields:
          action:
            type: ActionDefinition
            required: true
          parameters:
            type: ParameterField[]
            required: true
    action_slots:
      onSubmit:
        accepts: PresentationActionRequest
      onCancel:
        accepts: void
  stories:
  - simple_params
  - confirmation
  - validation_errors
  outputs:
    component: src/dmeta/widgets/ActionParameterForm/ActionParameterForm.tsx
    types: src/dmeta/widgets/ActionParameterForm/ActionParameterForm.types.ts
    metadata: src/dmeta/widgets/ActionParameterForm/ActionParameterForm.metadata.ts
    stories: src/dmeta/widgets/ActionParameterForm/ActionParameterForm.stories.tsx
    barrel: src/dmeta/widgets/ActionParameterForm/index.ts
- id: dmeta.field_group
  name: FieldGroup
  status: template
  classification:
    level: molecule
    role: field_group
  intent:
    purpose: Render a labeled group of fields with description, validation summary, and density rules.
    adapter_boundary: Receives normalized view models and typed semantic refs; emits typed callbacks; does not parse raw backend
      JSON or own trusted side effects.
  template:
    category: forms
    selection: optional
    maturity: draft
    default_importance: common
    selection_questions:
    - Does this concrete instance need this widget behavior, or is it better represented by a domain-specific local template?
    - Which selected presentations/actions should this template expose?
    adaptation_points:
      component_name:
        type: any
        required: false
        description: Concrete component name selected by the instance manifest.
      props:
        type: any
        required: false
        description: Concrete prop surface and view-model shape for the selected instance.
      stories:
        type: any
        required: false
        description: Storybook scenarios relevant to the selected variant and instance.
      presentation_mapping:
        type: any
        required: false
        description: Mapping from semantic presentations to rendered slots/cells/regions.
      action_slots:
        type: any
        required: false
        description: Typed callbacks/actions exposed by the concrete widget.
      density:
        type: any
        required: false
        description: Density mode or spacing behavior selected for the concrete design system.
      empty_state:
        type: any
        required: false
        description: Empty/no-results behavior and copy for this widget.
    common_variants:
    - default
    avoid_when:
    - The instance has no workflow matching this template role.
    - A more specific local template better expresses the product interaction.
  consumes: {}
  contract:
    props:
      FieldGroupProps:
        fields:
          title:
            type: string
            required: false
          children:
            type: ReactNode
            required: true
  stories:
  - basic
  - with_description
  - with_error
  outputs:
    component: src/dmeta/widgets/FieldGroup/FieldGroup.tsx
    types: src/dmeta/widgets/FieldGroup/FieldGroup.types.ts
    metadata: src/dmeta/widgets/FieldGroup/FieldGroup.metadata.ts
    stories: src/dmeta/widgets/FieldGroup/FieldGroup.stories.tsx
    barrel: src/dmeta/widgets/FieldGroup/index.ts
