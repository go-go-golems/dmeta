schema_version: 0
artifact_type: dmeta_pbui_presentation_bindings
summary: Reusable renderer bindings from abstract PBUI presentation types to CLIM React components.
intent: >-
  Bind common PBUI presentation types to reusable CLIM React component names, classes, display decisions, and event-binding roles. Application profiles can override bindings for domain-specific presentations or subpresentations.
source:
  visual_reference: reusable-clim-profile
  runtime_reference: /home/manuel/code/wesen/2026-05-21--readwise-viewer/pkg/web/clim/render.ts
  rationale: >-
    Readwise demonstrates the reusable runtime shape for presentation refs and action presentations. Concrete applications should override this profile when a presentation needs domain-specific rows, subpresentations, or visual grammar.
bindings:
  pbui.presentation_ref:
    component: PresentationRefLine
    summary: Render a semantic object reference as a CLIM text-object line.
    intent: >-
      Preserve the prototype pattern `<Type> label #id role/meta` while using
      PBUI/Readwise PresentationRef data as the runtime model.
    display:
      block: true
      inline: false
      show_type_tag: true
      show_id: true
      show_label: true
      show_role_meta: true
      show_copy_value: false
    classes:
      base: pres pres-block
      selected: selected
      selectable: selectable
      disabled: select-disabled
      type: pres-type
      id: pres-id
      role: role
    event_bindings:
      click: select_or_execute_pending_action
      context_menu: show_compatible_action_menu
    data_attributes:
      - data-type
      - data-id
      - data-label
      - data-capabilities
  pbui.action_presentation:
    component: ActionPresentationInline
    summary: Render an available action as a first-class inline CLIM presentation.
    intent: >-
      Make actions visible and selectable as interface objects, following the
      Readwise ActionPresentation pattern and the static CLIM prototype action link style.
    display:
      inline: true
      block: false
      show_danger_marker: true
      show_disabled_reason: true
      show_argument_types: false
    classes:
      base: pres action pres-action
      dangerous: pres-danger
      disabled: pres-disabled
      action: action
    event_bindings:
      click: request_or_execute_action
      context_menu: inspect_action_metadata
    data_attributes:
      - data-type
      - data-id
      - data-action-id
      - data-label
      - data-capabilities
  pbui.action_chooser:
    component: ActionHintBar
    summary: Render compatible actions for the selected presentation in the command/action surface.
    intent: >-
      Preserve the CLIM rhythm where selecting a presentation exposes compatible
      actions nearby. In the static CLIM prototype this is the lower per-view command bar;
      in Readwise this is a hint bar containing Action presentations.
    placement:
      preferred_surface: action_bar
      fallback_surface: command_line
    display:
      inline_actions: true
      group_by_safety: true
      show_disabled_actions: false
    classes:
      base: cmd-bar
      action: action
      dangerous: pres-danger
  pbui.inspector_panel:
    component: InspectorPanelBlock
    summary: Render object/type/action details as a structured CLIM help/inspection block.
    intent: >-
      Present metadata about selected objects, object types, projections,
      compatible actions, and provenance. This binding supports both DESCRIBE
      style results and future richer inspector surfaces.
    placement:
      preferred_surface: active_view
      secondary_surface: command_line_action_result
    display:
      block: true
      sections:
        - header
        - type_summary
        - projection_sections
        - compatible_actions
        - provenance
    classes:
      base: pres-block
      section: section-label
      dim: role
  pbui.lifecycle_status:
    component: LifecycleStatusBlock
    summary: Render order lifecycle progress as tracker steps.
    intent: >-
      Preserve the prototype tracker view's ordered Received/Preparing/Ready/Picked
      Up progression while allowing PBUI lifecycle metadata to drive the view.
    placement:
      preferred_surface: tracker_view
    display:
      block: true
      show_current_state: true
      show_phase_list: true
      show_next_step_hint: true
    classes:
      base: tracker-step
      done: done
      active: active
      pending: pending
    subpresentations:
      steps:
        component: TrackerStepLine
        classes:
          base: tracker-step
          done: done
          active: active
          pending: pending
  pbui.composition_presentation:
    component: CompositionPresentationBlock
    summary: Render composed objects with part rows, roles, substitutions, and local actions.
    intent: >-
      Turn one abstract composition presentation into a family of CLIM text-object subpresentations: composition header, part rows, removed/substituted states, substitution candidates, role labels, summaries, and actions. Concrete applications should override subpresentation renderers when domain vocabulary matters.
    placement:
      preferred_surface: active_view
    display:
      block: true
      show_composition_header: true
      show_part_rows: true
      show_role_labels: true
      show_substitution_candidates: true
      show_cart_summary: true
    classes:
      base: pres-block
      section: section-label
      ingredient_removed: ing-removed
      ingredient_substituted: ing-substituted
      role: role
    subpresentations:
      composition_header:
        component: CompositionHeaderLine
        classes:
          base: pres pres-block
          type: pres-type
          role: role
      part_rows:
        component: IngredientPresentationRow
        classes:
          base: pres pres-block
          removed: ing-removed
          substituted: ing-substituted
          type: pres-type
          role: role
      role_labels:
        component: RoleLabelInline
        classes:
          base: role
      substitution_candidates:
        component: SubstitutionCandidateLine
        classes:
          base: pres sub-candidate
          auto: auto
          type: pres-type
      cart_item:
        component: CartItemBlock
        classes:
          base: cart-item-block
          item: pres pres-block
notes: >-
  These bindings intentionally name reusable renderer components. Application profiles may inherit them directly or override selected bindings with domain-specific renderer components and subpresentation slots.
