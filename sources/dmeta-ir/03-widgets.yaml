summary: Widget template package index for DMETA v0. Use sources/dmeta-ir/widget-templates/*.yaml as the source of selectable/adaptable
  templates.
long_summary: DMETA widgets are meta-design-system templates. Concrete instances select templates, adapt them, and generate
