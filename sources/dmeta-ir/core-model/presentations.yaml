schema_version: 0
artifact_type: dmeta_presentations
summary: Presentation contracts for rendering semantic archetypes and capabilities.
long_summary: Presentations are named display contracts, not merely React components. A presentation states which layer it
  belongs to, which archetypes or capabilities it applies to, which projections it requires, which interaction affordances
  it exposes, and which design-language recipe should render it. Presentations are the bridge between the semantic core model
  and the widget IR.
references:
  semantic_model_design_doc: ../../../design-docs/02-semantic-archetype-and-capability-model.md
  core_model_widget_ir_spec: ../../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
  design_language_spec: ../../../design-docs/06-dmeta-design-language-and-tooling-spec.md
presentations:
  compact_id:
    description: Compact copyable identifier.
    layer: capability
    applies_to:
      capabilities:
      - identifiable
    requires:
    - id
    role: inline_code
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  display_label:
    description: Primary human-readable label.
    layer: capability
    applies_to:
      capabilities:
      - labelable
    requires:
    - label
    optional:
    - subtitle
    role: inline_text
    density: any
    interaction:
      selectable: false
      context_menu: false
      copy: false
  status_badge:
    description: Compact state/status badge.
    layer: capability
    applies_to:
      capabilities:
      - stateful
    requires:
    - state
    optional:
    - state_label
    - state_tone
    role: badge
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
  state_cell:
    description: Table cell state presentation.
    layer: capability
    applies_to:
      capabilities:
      - stateful
    requires:
    - state
    optional:
    - state_label
    - state_tone
    role: table_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: status_badge
  timestamp_inline:
    description: Compact timestamp display.
    layer: capability
    applies_to:
      capabilities:
      - temporal
    requires_any:
    - timestamp
    - start_time
    role: inline_mono
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  duration_cell:
    description: Duration value for tables/details.
    layer: capability
    applies_to:
      capabilities:
      - temporal
    requires:
    - duration_ms
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
  metric_cell:
    description: Numeric metric display with unit and alignment.
    layer: capability
    applies_to:
      capabilities:
      - measurable
    requires:
    - value
    optional:
    - unit
    role: metric_cell
    density: any
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: metric_cell
  relation_link:
    description: Compact link/reference to a related semantic object.
    layer: capability
    applies_to:
      capabilities:
      - relatable
    requires_any:
    - relation_refs
    - actor_ref
    - work_item_ref
    - resource_ref
    role: relation_link
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  compact_ref:
    description: Compact reference combining id and label.
    layer: archetype
    applies_to:
      capabilities:
      - identifiable
      - labelable
    requires:
    - id
    - label
    optional:
    - state
    - state_tone
    role: compact_reference
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  inline_token:
    description: Inline semantic token for dense streams.
    layer: archetype
    applies_to:
      archetypes:
      - Actor
      - WorkItem
      - Event
      - Resource
      - Metric
      - TimelineSpan
    requires_any:
    - id
    - label
    - state
    - timestamp
    - value
    role: inline_token
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: true
    style_recipe: compact_ref
  dense_row:
    description: Dense row for streams or tables.
    layer: archetype
    applies_to:
      archetypes:
      - WorkItem
      - Event
      - Resource
      - TimelineSpan
      - ActionInvocation
    requires_any:
    - id
    - label
    - timestamp
    role: dense_row
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
    style_recipe: dense_row
  summary_card:
    description: Compact card/summary surface.
    layer: archetype
    applies_to:
      archetypes:
      - Actor
      - WorkItem
      - Resource
      - TimelineSpan
      - ActionSpec
      - ActionInvocation
    requires_any:
    - id
    - label
    role: summary_card
    density: regular
    interaction:
      selectable: true
      context_menu: true
      copy: false
  detail_panel:
    description: Full inspection surface for selected semantic subject.
    layer: archetype
    applies_to:
      capabilities:
      - inspectable
    requires_any:
    - id
    - label
    - detail_ref
    role: detail_panel
    density: spacious
    interaction:
      selectable: false
      context_menu: false
      copy: true
  timeline_marker:
    description: Compact marker or span for temporal processes.
    layer: archetype
    applies_to:
      archetypes:
      - TimelineSpan
      - Event
      - WorkItem
    requires_any:
    - timestamp
    - start_time
    - end_time
    role: timeline_marker
    density: compact
    interaction:
      selectable: true
      context_menu: true
      copy: false
actions:
  inspect:
    description: Open detail view for any inspectable subject.
    category: inspect
    accepts:
    - capability: inspectable
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
        - capability: inspectable
    result:
      kind: open_detail
  copy_reference:
    description: Copy the canonical id or copy value of a semantic presentation.
    category: utility
    accepts:
    - capability: identifiable
    - presentation: compact_ref
    - presentation: compact_id
    arguments:
      subject:
        mode: selected_presentation
        required: true
        accepts:
        - capability: identifiable
    result:
      kind: copy
  filter_by_value:
    description: Add a filter matching the selected presentation value.
    category: filter
    accepts:
    - presentation: inline_token
    - presentation: compact_ref
    - presentation: metric_cell
    arguments:
      value:
        mode: selected_presentation
        required: true
    result:
      kind: apply_filter
  filter_by_state:
    description: Add a filter matching the selected state.
    category: filter
    accepts:
    - capability: stateful
    - presentation: status_badge
    - presentation: state_cell
    arguments:
      state:
        mode: selected_presentation
        required: true
        accepts:
        - capability: stateful
    result:
      kind: apply_filter
  open_related:
    description: Navigate to or reveal a related semantic subject.
    category: navigate
    accepts:
    - capability: relatable
    - presentation: relation_link
    arguments:
      relation:
        mode: presentation_candidate
        required: true
        accepts:
        - capability: relatable
    result:
      kind: open_related
  retry_work_item:
    description: Retry failed or retryable work.
    category: action
    accepts:
    - archetype: WorkItem
      requires_capabilities:
      - stateful
      - actionable
    - archetype: ActionInvocation
      requires_capabilities:
      - stateful
      - executable
    arguments:
      work_item:
        mode: selected_presentation
        required: true
        accepts:
        - archetype: WorkItem
        - archetype: ActionInvocation
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
  cancel_work_item:
    description: Cancel running or scheduled work.
    category: action
    accepts:
    - archetype: WorkItem
      requires_capabilities:
      - stateful
      - actionable
    - archetype: ActionInvocation
      requires_capabilities:
      - stateful
      - executable
    arguments:
      work_item:
        mode: selected_presentation
        required: true
      confirmation:
        mode: confirmation
        required: true
    result:
      kind: dispatch_action
  schedule_action:
    description: Schedule an action spec for execution.
    category: action
    accepts:
    - archetype: ActionSpec
    arguments:
      action_spec:
        mode: selected_presentation
        required: true
        accepts:
        - archetype: ActionSpec
      parameters:
        mode: parameter_form
        required: false
    result:
      kind: dispatch_action
  compare_metrics:
    description: Compare selected metric presentations.
    category: inspect
    accepts:
    - capability: measurable
    - presentation: metric_cell
    arguments:
      metric_a:
        mode: selected_presentation
        required: true
      metric_b:
        mode: presentation_candidate
        required: true
        accepts:
        - capability: measurable
    result:
      kind: open_comparison
