schema_version: 0
artifact_type: dmeta_capabilities
summary: Reusable semantic capabilities, projections, filters, presentations, and action affordances for DMETA.
long_summary: 'Capabilities are reusable affordances that cut across archetypes and domains. They are the level where many
  presentation and action rules belong: status badges attach to stateful, timestamp renderers attach to temporal, compact
  id renderers attach to identifiable, and relation links attach to relatable. A capability should define the projections
  that tools and widgets can rely on. If a capability has no projections, presentations, actions, filters, validation rules,
  or planned generator consumer, it is probably too vague for the formal IR.'
references:
  design_doc: ../../../design-docs/02-semantic-archetype-and-capability-model.md
  spec: ../../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
capabilities:
  Capability:
    abstract: true
    description: Root affordance/projection class.
    extends: []
    projections: {}
    presentations: []
    actions: []
    filters: []
    long_description: Every semantic capability inherits from Capability. The root is abstract and exists so validation, generated TypeScript, and action/presentation matching can reason about the full capability hierarchy explicitly.
  identifiable:
    extends:
    - Capability
    description: Subject has stable identity.
    projections:
      id:
        type: string
        required: true
        description: Canonical stable id.
    presentations:
    - compact_id
    actions:
    - copy_reference
    filters:
    - equals
    - not_equals
    - in
    long_description: 'Identifiable means a subject has a stable identity that can be referenced across surfaces, copied,
      used in URLs or actions, and matched against related records. The `id` projection is intentionally required because
      many downstream behaviors depend on it: compact references, copy actions, detail routing, relation matching, and stable
      selection state.'
  labelable:
    extends:
    - Capability
    description: Subject has human-readable label text.
    projections:
      label:
        type: string
        required: true
        description: Primary display label.
      subtitle:
        type: string
        required: false
        description: Optional secondary label.
    presentations:
    - display_label
    filters:
    - contains
    - equals
    long_description: 'Labelable means a subject has human-readable text suitable for display. Labels are not identities:
      they may change, collide, or be localized. The UI should generally show labels for readability while preserving access
      to stable ids for precision. Optional subtitles provide secondary context such as model name, destination, owner, or
      short description.'
  stateful:
    extends:
    - Capability
    description: Subject has state/status that can be shown, filtered, and acted on.
    projections:
      state:
        type: string
        required: true
        description: Canonical state value.
      state_label:
        type: string
        required: false
        description: Human-readable state label.
      state_tone:
        type: tone
        required: false
        description: Optional semantic tone override.
    presentations:
    - status_badge
    - state_cell
    actions:
    - filter_by_state
    filters:
    - equals
    - not_equals
    - in
    long_description: Stateful means a subject has lifecycle, status, or condition semantics that users need to scan, filter,
      and act on. The state may represent execution state, shipment status, health, availability, alert condition, or workflow
      phase. Stateful presentations such as status badges must pair text with tone; color reinforces meaning but does not
      replace it.
  temporal:
    extends:
    - Capability
    description: Subject has instant, interval, or duration time semantics.
    projections:
      timestamp:
        type: datetime
        required: false
        description: Instant timestamp.
      start_time:
        type: datetime
        required: false
        description: Interval start.
      end_time:
        type: datetime
        required: false
        description: Interval end.
      duration_ms:
        type: duration_ms
        required: false
        description: Duration in milliseconds.
    presentations:
    - timestamp_inline
    - duration_cell
    filters:
    - before
    - after
    - between
    long_description: 'Temporal means a subject has time semantics: an instant, interval, duration, or some combination of
      those. Dense operational systems depend heavily on temporal ordering, recency, latency, and duration comparison. Temporal
      projections enable stream ordering, timeline markers, duration cells, time filters, and detail views.'
  inspectable:
    extends:
    - Capability
    description: Subject can open a detail/inspection surface.
    projections:
      detail_ref:
        type: string
        required: false
        description: Optional detail routing reference.
    presentations:
    - detail_panel
    actions:
    - inspect
    long_description: 'Inspectable means a subject can open a deeper detail surface. This capability separates compact dense
      presentations from richer inspection panels. A subject may be inspectable even if it has no special action behavior.
      Inspection should preserve context: users should be able to open details from a table, stream, relation, or token without
      losing their place.'
  relatable:
    extends:
    - Capability
    description: Subject can reference or be referenced by other semantic subjects.
    projections:
      relation_refs:
        type: list
        required: false
        description: Related semantic references.
      actor_ref:
        type: string
        required: false
        description: Related actor id.
      work_item_ref:
        type: string
        required: false
        description: Related work item id.
      resource_ref:
        type: string
        required: false
        description: Related resource id.
    presentations:
    - relation_link
    actions:
    - open_related
    filters:
    - has_relation
    - relation_equals
    long_description: 'Relatable means a subject participates in semantic links to other subjects. Dense operational work
      is graph-shaped: events point to work items, work items point to actors, resources belong to orders, and annotations
      attach to incidents. Relatable projections enable relation links, related-object lists, navigation actions, and filtering
      by association.'
  actionable:
    extends:
    - Capability
    description: Subject can be used as an action source or target.
    projections:
      available_actions:
        type: list
        required: false
        description: Optional action ids available for this subject.
    actions:
    - inspect
    long_description: Actionable means a subject can be the source or target of user/system operations. This does not mean
      the widget executes the operation directly; widgets emit typed action requests and the adapter/backend handles trusted
      side effects. Actionable subjects participate in context menus, command palettes, and typed argument collection.
  streamable:
    extends:
    - Capability
    description: Subject can appear in an ordered stream.
    projections:
      sequence:
        type: integer
        required: false
        description: Optional stream sequence number.
    long_description: Streamable means a subject can appear in an ordered feed, log, event stream, or incrementally updating
      list. Streamable subjects need stable sequence/order behavior and compact row or token presentations. This capability
      is important for realtime logs, scan feeds, tool output, agent traces, and monitoring streams.
  append_only:
    extends:
    - Capability
    description: Subject is an immutable or append-only observation.
    projections:
      sequence:
        type: integer
        required: false
        description: Optional append-only sequence.
    long_description: Append-only means a subject is treated as an immutable observation or historical record. Append-only
      records should not be visually conflated with mutable WorkItems. This capability helps tooling and UI distinguish event
      streams and audit trails from stateful objects whose current value changes over time.
  measurable:
    extends:
    - Capability
    description: Subject has numeric value semantics.
    projections:
      value:
        type: number
        required: true
        description: Numeric value.
      unit:
        type: string
        required: false
        description: Unit label.
    presentations:
    - metric_cell
    filters:
    - lt
    - lte
    - gt
    - gte
    - between
    long_description: Measurable means a subject exposes numeric value semantics. The value may be duration, count, cost,
      throughput, latency, error rate, or capacity. Measurable values need units, alignment, comparison actions, and range
      filters. They should be rendered with tabular numeric treatment in dense tables.
  aggregatable:
    extends:
    - Capability
    description: Subject can be summarized or aggregated.
    projections:
      aggregate_key:
        type: string
        required: false
        description: Grouping key.
    long_description: Aggregatable means a subject can participate in summaries, grouping, rollups, charts, or aggregate indicators.
      It often appears with Metric, TimelineSpan, WorkItem, or Event collections. The capability does not prescribe a chart;
      it says that the subject has stable grouping/summarization semantics.
  schedulable:
    extends:
    - Capability
    description: Subject can be scheduled for execution.
    projections:
      scheduled_at:
        type: datetime
        required: false
        description: Scheduled time.
    actions:
    - schedule_action
    long_description: Schedulable means a subject can be planned for future execution or activation. It is common on ActionInvocation-like
      objects, jobs, maintenance windows, and workflow tasks. Scheduling semantics should be explicit because scheduled work
      differs from immediate commands and from already-running work.
  executable:
    extends:
    - Capability
    description: Subject represents executable work.
    projections:
      execution_state:
        type: string
        required: false
        description: Execution-specific state.
    actions:
    - retry_work_item
    - cancel_work_item
    long_description: 'Executable means a subject represents work that can run, complete, fail, retry, or be cancelled. This
      capability is narrower than actionable: many things are actionable, but executable things have execution-specific lifecycle
      and control semantics. It enables retry/cancel actions and execution-state detail.'
  spatial:
    extends:
    - Capability
    description: Subject has location, route, or spatial semantics.
    projections:
      location:
        type: string
        required: false
        description: Location reference.
      origin:
        type: string
        required: false
        description: Origin reference.
      destination:
        type: string
        required: false
        description: Destination reference.
    long_description: Spatial means a subject has location, route, origin, destination, or facility semantics. It is needed
      for logistics, physical operations, agricultural sensors, warehouses, field devices, and infrastructure views. Spatial
      does not require map rendering; it first provides structured projections for location-aware filtering, relation, and
      display.
  parameterized:
    extends:
    - Capability
    description: Subject has parameters or schema-defined inputs.
    projections:
      parameters:
        type: json
        required: false
        description: Parameter schema or current parameter values.
    long_description: 'Parameterized means a subject has schema-defined inputs or configurable values. ActionSpec is the primary
      example: a tool definition or command definition has parameters before it is invoked. Parameterized projections drive
      forms, validation, previews, and action scheduling.'
  filterable:
    extends:
    - Capability
    description: Subject or surface can be constrained by typed filter expressions.
    projections:
      filter_target_id:
        type: string
        required: true
        description: Stable id for the filter target or result surface.
      filter_dimensions:
        type: list
        required: false
        description: Available dimensions that can constrain this target.
      active_filters:
        type: list
        required: false
        description: Active filter expressions or criteria currently constraining the target.
    presentations:
    - filter_summary
    actions:
    - apply_filter
    - clear_filters
    filters: []
    long_description: Filterable means the subject is the thing being filtered, not merely a value that can appear in a filter.
      Event stream windows, dense table result sets, search results, workflow queues, shipment queues, and trace windows are
      filterable surfaces. The adapter owns backend query lowering, but widgets and generated registries need this capability
      to know where filter expressions can be applied and which dimensions are valid for the current surface.
  filter_source:
    extends:
    - Capability
    description: Subject presentation can derive one or more filter expressions for compatible targets.
    projections:
      filter_keys:
        type: list
        required: false
        description: Candidate filter dimensions this subject can populate.
      filter_value:
        type: json
        required: false
        description: Default scalar or structured value to use in a filter expression.
      filter_label:
        type: string
        required: false
        description: Human-readable label for active filter chips derived from this subject.
    presentations:
    - filter_value_token
    actions:
    - filter_by_value
    - filter_by_relation
    filters:
    - equals
    - in
    - relation_equals
    long_description: Filter_source means a visible semantic presentation can be turned into a constraint for a compatible
      filterable target. It is deliberately separate from filterable. An Agent, Session, Client, StatusBadge, timestamp,
      relation link, or metric cell may supply a filter value, while an EventStream ResultSet or DenseTable ResultSet receives
      the resulting expression. The runtime matches sources to targets through filter keys, dimensions, relation paths, or
      adapter-provided mappings.
  searchable:
    extends:
    - Capability
    description: Subject or collection can be narrowed by a text query.
    projections:
      search_text:
        type: string
        required: false
        description: Text indexed for search on a single record.
      search_scope:
        type: string
        required: false
        description: Named search scope for a collection or result surface.
      active_search:
        type: string
        required: false
        description: Current text query applied to a searchable target.
    presentations:
    - search_summary
    actions:
    - apply_search
    - clear_search
    filters:
    - contains
    long_description: Searchable means the subject or result surface can be narrowed by text query. Search is related to
      filtering but should remain distinct because it involves tokenization, indexing, highlighting, query scope, and sometimes
      backend-specific search syntax. Many ResultSets will be both filterable and searchable, but structured filter chips
      and free-text search should remain separate pieces of UI and runtime state.
  facetable:
    extends:
    - Capability
    description: Subject or result set can expose grouped filter buckets with counts.
    projections:
      facets:
        type: list
        required: false
        description: Available facet dimensions, values, and counts for the current result set.
    presentations:
    - facet_bucket
    actions:
    - apply_facet_filter
    filters:
    - equals
    - in
    long_description: >
      Facetable means a filterable result surface can expose grouped buckets such as state counts, client counts, agent counts,
      severity counts, facility counts, or event-type counts. Facets are both summary data and filter sources: selecting a
      bucket usually applies a corresponding filter expression to the same target. Facetable should be modeled separately
      from aggregatable because the buckets are specifically tied to query narrowing.
  sortable:
    extends:
    - Capability
    description: Subject or result set can be ordered by one or more sort keys.
    projections:
      sort_keys:
        type: list
        required: false
        description: Available sort dimensions or fields.
      active_sort:
        type: list
        required: false
        description: Current sort expressions for the result surface.
    long_description: Sortable means a result surface exposes stable order semantics, such as newest first, duration descending,
      severity descending, state then timestamp, or carrier then delivery ETA. Sorting is not a filter, but high-density tables
      and streams need it in the same result-state model so adapters, URL state, Storybook examples, and ResultWindowControls
      stay consistent.
  windowable:
    extends:
    - Capability
    description: Subject or result set can be read through page, cursor, or live-tail windows.
    projections:
      cursor:
        type: string
        required: false
        description: Backend or adapter cursor for the current result window.
      limit:
        type: integer
        required: false
        description: Maximum number of records in the current result window.
      live_tail:
        type: boolean
        required: false
        description: Whether the result surface follows newly appended records.
    long_description: Windowable means a result surface is not assumed to hold all matching records at once. Event streams,
      traces, logs, and large operational tables are usually cursor-backed, paginated, virtualized, or live-tailed. Windowable
      complements filterable and searchable by making result navigation explicit for widgets such as RecordStream, DenseTable,
      and ResultWindowControls.
