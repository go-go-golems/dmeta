schema_version: 0
artifact_type: dmeta_domain_example
id: agent_workflow
summary: AI agent workflow dashboard pressure test.
long_summary: This domain example pressure-tests the generic DMETA archetype and capability vocabulary. It is not a production
  domain schema; it shows how concrete domain objects map to the reusable core model so validators, generators, and reviewers
  can detect whether the abstractions are too narrow or too vague.
references:
  core_model_design_doc: ../../../../design-docs/02-semantic-archetype-and-capability-model.md
  core_model_widget_ir_spec: ../../../../design-docs/05-dmeta-core-model-and-widget-ir-spec.md
domain_example:
  description: AI agent workflow dashboard pressure test.
  domain_types:
    Agent:
      description: Agent or model-backed worker.
      archetypes:
      - Actor
      capabilities:
        identifiable:
          id: agent_id
        labelable:
          label: display_name
          subtitle: model_name
        stateful:
          state: status
        temporal:
          timestamp: last_seen_at
        filter_source:
          filter_keys: [agent_id]
          filter_value: agent_id
          filter_label: display_name
    Client:
      description: Client application, user interface, or external caller that owns or initiates agent sessions.
      archetypes:
      - Actor
      capabilities:
        identifiable:
          id: client_id
        labelable:
          label: client_name
        filter_source:
          filter_keys: [client_id]
          filter_value: client_id
          filter_label: client_name
    ToolSpec:
      description: Tool definition/signature.
      archetypes:
      - ActionSpec
      capabilities:
        identifiable:
          id: tool_name
        labelable:
          label: title
          subtitle: description
        parameterized:
          parameters: input_schema
    ToolRun:
      description: Concrete tool execution.
      archetypes:
      - ActionInvocation
      - WorkItem
      capabilities:
        identifiable:
          id: call_id
        labelable:
          label: tool_name
        stateful:
          state: status
        temporal:
          start_time: started_at
          end_time: finished_at
          duration_ms: duration_ms
        relatable:
          actor_ref: agent_id
        executable:
          execution_state: status
    ToolEvent:
      description: Append-only observation emitted by a tool run.
      archetypes:
      - Event
      capabilities:
        identifiable:
          id: event_id
        temporal:
          timestamp: timestamp
        append_only:
          sequence: sequence
        relatable:
          work_item_ref: call_id
    Session:
      description: Agent workflow session.
      archetypes:
      - TimelineSpan
      capabilities:
        identifiable:
          id: session_id
        labelable:
          label: title
        temporal:
          start_time: started_at
          end_time: ended_at
        stateful:
          state: status
        relatable:
          actor_ref: client_id
        filter_source:
          filter_keys: [session_id, client_id]
          filter_value: session_id
          filter_label: title
    AgentEventResultSet:
      description: Filterable/searchable event stream window for agent workflow events.
      archetypes:
      - ResultSet
      capabilities:
        identifiable:
          id: result_set_id
        labelable:
          label: result_label
        filterable:
          filter_target_id: agent_event_stream
          filter_dimensions: [agent_id, client_id, session_id, state, timestamp]
          active_filters: active_filters
        searchable:
          search_scope: event_message
          active_search: query
        facetable:
          facets: facets
        windowable:
          cursor: next_cursor
          limit: page_size
          live_tail: live_tail
